<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FITSTATION 24 — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --brand: #0B132B;
    --accent: #FF5C00;
    --teal: #5BC0BE;
    --ok: #16A34A;
    --warn: #F59E0B;
    --bad: #DC2626;
    --bg: #F4F4F5;
    --surface: #FFFFFF;
    --border: #E5E7EB;
    --muted: #6B7280;
    --text: #1F2A44;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Sarabun', 'Noto Sans Thai', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: 14px; }
  .hidden { display: none !important; }

  /* ====== LOGIN ====== */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0B132B 0%, #1C2541 100%);
    padding: 20px;
  }
  .login-card {
    background: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 380px;
  }
  .login-card .logo {
    text-align: center;
    margin-bottom: 24px;
  }
  .login-card .logo .name {
    font-size: 22px;
    font-weight: 700;
    color: var(--brand);
    letter-spacing: 1px;
  }
  .login-card .logo .sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  .login-card label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    margin-top: 14px;
  }
  .login-card input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s;
  }
  .login-card input:focus { border-color: var(--accent); }
  .login-card .err {
    background: #FEE2E2;
    color: var(--bad);
    padding: 10px;
    border-radius: 8px;
    font-size: 12px;
    margin-top: 14px;
    display: none;
  }
  .login-card .err.show { display: block; }
  .login-card button.primary {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-weight: 600;
    margin-top: 20px;
    transition: background 0.15s;
  }
  .login-card button.primary:hover { background: #E04D00; }
  .login-card .demo {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
  }
  .login-card .demo-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-family: ui-monospace, 'SF Mono', Monaco, monospace;
    cursor: pointer;
  }
  .login-card .demo-row:hover { color: var(--accent); }

  /* ====== APP LAYOUT ====== */
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 240px;
    background: var(--brand);
    color: white;
    padding: 20px 0;
    flex-shrink: 0;
  }
  .sidebar .brand {
    padding: 0 20px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .sidebar .brand .name {
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 1px;
  }
  .sidebar .brand .sub {
    font-size: 11px;
    color: #9CA3AF;
    margin-top: 2px;
  }
  .sidebar nav { padding: 12px 0; }
  .sidebar nav button {
    display: block;
    width: 100%;
    padding: 10px 20px;
    background: transparent;
    color: #D1D5DB;
    border: none;
    text-align: left;
    font-size: 13px;
    transition: all 0.12s;
    border-left: 3px solid transparent;
  }
  .sidebar nav button:hover {
    background: rgba(255,255,255,0.05);
    color: white;
  }
  .sidebar nav button.active {
    background: rgba(255,92,0,0.1);
    color: white;
    border-left-color: var(--accent);
    font-weight: 600;
  }
  .sidebar .user-box {
    margin-top: auto;
    padding: 16px 20px;
    border-top: 1px solid rgba(255,255,255,0.1);
    font-size: 12px;
  }
  .sidebar .user-box .uname { color: white; font-weight: 600; }
  .sidebar .user-box .urole { color: #9CA3AF; font-size: 11px; }
  .sidebar .user-box button {
    margin-top: 8px;
    background: transparent;
    color: #D1D5DB;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11px;
    width: 100%;
  }
  .sidebar .user-box button:hover { background: rgba(255,255,255,0.05); }

  .main {
    flex: 1;
    overflow-x: hidden;
  }
  .topbar {
    background: white;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
  }
  .topbar .branch-pick select {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    font-size: 13px;
  }
  .content { padding: 24px 28px; }

  /* ====== KPI cards ====== */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 22px;
  }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .kpi .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .kpi .value { font-size: 26px; font-weight: 700; color: var(--brand); }
  .kpi .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .kpi.accent .value { color: var(--accent); }
  .kpi.ok .value { color: var(--ok); }

  /* ====== Cards ====== */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .card h2 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    color: var(--text);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card h2 small {
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
  }

  /* ====== Tables ====== */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left;
    color: var(--muted);
    font-weight: 500;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  tbody td {
    padding: 10px;
    border-bottom: 1px solid var(--border);
  }
  tbody tr:hover { background: var(--bg); }
  td.right, th.right { text-align: right; }
  td.center, th.center { text-align: center; }

  /* Badges */
  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 500;
  }
  .badge.ok { background: #DCFCE7; color: #166534; }
  .badge.warn { background: #FEF3C7; color: #92400E; }
  .badge.bad { background: #FEE2E2; color: #991B1B; }
  .badge.info { background: #DBEAFE; color: #1E40AF; }
  .badge.gray { background: #F3F4F6; color: #4B5563; }

  /* ====== Forms ====== */
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 14px;
  }
  .form-grid .field { display: flex; flex-direction: column; gap: 4px; }
  .form-grid label { font-size: 11px; color: var(--muted); }
  .form-grid input, .form-grid select, .form-grid textarea {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
    transition: border-color 0.15s;
    background: white;
  }
  .form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus {
    border-color: var(--accent);
  }
  .form-grid .field.full { grid-column: 1 / -1; }

  button.btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 9px 18px;
    border-radius: 7px;
    font-weight: 600;
    font-size: 13px;
    transition: background 0.15s;
  }
  button.btn:hover { background: #E04D00; }
  button.btn.secondary {
    background: white;
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.btn.secondary:hover { background: var(--bg); }
  button.btn.danger { background: var(--bad); }
  button.btn.small { padding: 5px 10px; font-size: 12px; }

  .row-actions { display: flex; gap: 6px; }

  /* Charts */
  .chart-wrap {
    position: relative;
    height: 240px;
    width: 100%;
  }

  /* Two-col layout */
  .two-col {
    display: grid;
    grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
    gap: 18px;
  }
  @media (max-width: 900px) {
    .two-col { grid-template-columns: 1fr; }
    .sidebar { width: 60px; }
    .sidebar nav button { padding: 10px 18px; font-size: 0; }
    .sidebar .brand, .sidebar .user-box { padding-left: 14px; padding-right: 14px; }
  }

  /* Modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
  }
  .modal {
    background: white;
    border-radius: 12px;
    padding: 24px;
    width: 95%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--brand); color: white;
    padding: 12px 18px; border-radius: 8px;
    font-size: 13px; z-index: 2000;
    transition: opacity 0.3s, transform 0.3s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }
  .toast.ok { background: var(--ok); }
  .toast.bad { background: var(--bad); }
  .toast.warn { background: var(--warn); color: #422006; }

  /* Member status colors */
  .days-low { color: var(--bad); font-weight: 600; }
  .days-warn { color: var(--warn); font-weight: 600; }
  .hrs-low { color: var(--bad); font-weight: 600; }

  /* Misc */
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .toolbar .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .toolbar input, .toolbar select {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: white;
    font-size: 13px;
  }
</style>
</head>

<!-- ============== LOGIN SCREEN ============== -->

    <div class="content" id="content"></div>

</div>

<div id="modal-host"></div>

// ============================================================
// FITSTATION 24 — Single-file dashboard
// All data persists in localStorage. Export/Import for backup.
// ============================================================

const LS_KEY = 'fitstation24_data_v1';
const SESSION_KEY = 'fitstation24_session';

// ---------- DEFAULT SEED DATA ----------

      { email: 'manager.br2@fitstation.com',   pwd: 'm2pass',   name: 'อนันต์ เอกชัย',     role: 'Manager', branch: 'BR02' },

      { id: 'E002', name: 'สมหญิง', surname: 'สวยงาม',   position: 'เคาน์เตอร์',   branch: 'BR01', status: 'Active' },
      { id: 'E003', name: 'วิชัย',  surname: 'แข็งแรง',  position: 'เทรนเนอร์',     branch: 'BR01', status: 'Active' },

      { id: 'E005', name: 'อนันต์', surname: 'เอกชัย',   position: 'ผู้จัดการสาขา', branch: 'BR02', status: 'Active' },

      { id: 'M0002', name: 'นภัสกร',    surname: 'ใจกล้า',    age: 34, branch: 'BR01', startDate: daysAgo(90),  endDate: daysAhead(10),  hours: 2,  trainer: 'พิมพ์', lineUid: '', status: 'Active' },

      { id: 'M0005', name: 'อรณิชา',     surname: 'พิทักษ์',   age: 31, branch: 'BR02', startDate: daysAgo(60),  endDate: daysAhead(305), hours: 12, trainer: 'พิมพ์', lineUid: '', status: 'Active' },

      { id: nid(), ts: daysAgo(0), branch: 'BR01', empId: 'E002', type: 'MEM',  memberId: 'M0003', memberName: 'สิรินทรา วงศ์ทอง', amount: 12000, slip: 'https://example.com/slip-1.jpg', note: 'สมัคร 12 เดือน', notify: 'Sent' },

function nid() { return Math.random().toString(36).slice(2, 10); }

// ---------- STORAGE ----------
let DATA = null;
let SESSION = null;
let CURRENT_VIEW = 'dashboard';
let CURRENT_BRANCH = '*';
let CHARTS = {};
let DASH_PERIOD = { type: 'today', from: null, to: null };

// ---------- PAGINATION ----------
const PAGE_SIZE = 20;
let SALES_LOG_PAGE = 1;
let TRAININGS_PAGE = 1;
let DASH_SALES_PAGE = 1;
let MEMBER_SEARCH = '';
let MEMBER_STATUS = '';

function paginationHTML(total, current, onChangeFn) {
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  current = Math.max(1, Math.min(current, totalPages));
  if (totalPages <= 1) return '';
  const pages = [];
  const push = (p) => pages.push(`<button class="btn small ${p === current ? '' : 'secondary'}" onclick="${onChangeFn}(${p})">${p}</button>`);
  const dots = () => pages.push('<span class="muted small" style="padding:0 4px;">…</span>');
  if (totalPages <= 7) {
    for (let i = 1; i <= totalPages; i++) push(i);
  } else {
    push(1);
    if (current > 4) dots();
    const s = Math.max(2, current - 2);
    const e = Math.min(totalPages - 1, current + 2);
    for (let i = s; i <= e; i++) push(i);
    if (current < totalPages - 3) dots();
    push(totalPages);
  }
  const prevDisabled = current === 1 ? 'disabled' : '';
  const nextDisabled = current === totalPages ? 'disabled' : '';
  return `<div class="pagination" style="display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:14px;">
    <button class="btn small secondary" ${prevDisabled} onclick="${onChangeFn}(${current - 1})">« ก่อนหน้า</button>
    ${pages.join(' ')}
    <button class="btn small secondary" ${nextDisabled} onclick="${onChangeFn}(${current + 1})">ถัดไป »</button>
    <span class="muted small" style="margin-left:8px;">หน้า ${current} / ${totalPages}</span>
  </div>`;
}

// ---------- ROLE / BRANCH HELPERS ----------
function visibleBranches() {
  if (!SESSION) return [];
  if (SESSION.branch === '*') return DATA.branches.map(b => b.code);
  return [SESSION.branch];
}

function canSeeAllBranches() { return SESSION && SESSION.branch === '*'; }
function isOwner() { return SESSION && SESSION.role === 'Owner'; }
function isManagerOrAbove() { return SESSION && (SESSION.role === 'Owner' || SESSION.role === 'Manager'); }
function effectiveBranchFilter() {
  // If user can only see one branch, force-pick it
  if (!canSeeAllBranches()) return SESSION.branch;
  return CURRENT_BRANCH;
}
function filterByBranch(arr) {
  const b = effectiveBranchFilter();
  if (b === '*') return arr;
  return arr.filter(x => x.branch === b);
}

// ---------- FORMATTERS ----------
function thb(n) { return DATA.settings.currency + Number(n || 0).toLocaleString('th-TH'); }
function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('th-TH', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
}
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: 'numeric' });
}
function fmtTimeShort(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', hour12: false });
}
function todayStart() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function isSameDay(iso, refDate) {
  const d = new Date(iso);
  return d.getFullYear() === refDate.getFullYear() && d.getMonth() === refDate.getMonth() && d.getDate() === refDate.getDate();
}
function inRange(iso, range) {
  const t = new Date(iso).getTime();
  return t >= range.start.getTime() && t < range.end.getTime();
}
function getDashRange() {
  const today = todayStart();
  const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
  const dayMs = 1000 * 60 * 60 * 24;
  switch (DASH_PERIOD.type) {
    case 'today':
      return { start: today, end: tomorrow, label: 'วันนี้', days: 1 };
    case 'yesterday': {
      const s = new Date(today); s.setDate(s.getDate() - 1);
      return { start: s, end: today, label: 'เมื่อวาน', days: 1 };
    }
    case '7d': {
      const s = new Date(today); s.setDate(s.getDate() - 6);
      return { start: s, end: tomorrow, label: '7 วันล่าสุด', days: 7 };
    }
    case '30d': {
      const s = new Date(today); s.setDate(s.getDate() - 29);
      return { start: s, end: tomorrow, label: '30 วันล่าสุด', days: 30 };
    }
    case 'thisMonth': {
      const s = new Date(today.getFullYear(), today.getMonth(), 1);
      const e = new Date(today.getFullYear(), today.getMonth() + 1, 1);
      return { start: s, end: e, label: 'เดือนนี้', days: Math.round((e - s) / dayMs) };
    }
    case 'lastMonth': {
      const s = new Date(today.getFullYear(), today.getMonth() - 1, 1);
      const e = new Date(today.getFullYear(), today.getMonth(), 1);
      return { start: s, end: e, label: 'เดือนที่แล้ว', days: Math.round((e - s) / dayMs) };
    }
    case 'custom': {
      const s = DASH_PERIOD.from ? new Date(DASH_PERIOD.from) : new Date(today);
      s.setHours(0, 0, 0, 0);
      const eRef = DASH_PERIOD.to ? new Date(DASH_PERIOD.to) : new Date(today);
      eRef.setHours(0, 0, 0, 0);
      const e = new Date(eRef); e.setDate(e.getDate() + 1);
      const days = Math.max(1, Math.round((e - s) / dayMs));
      return { start: s, end: e, label: 'กำหนดเอง', days };
    }
    default:
      return { start: today, end: tomorrow, label: 'วันนี้', days: 1 };
  }
}
function setDashPeriod(type, from, to) {
  DASH_PERIOD = { type, from: from || null, to: to || null };
  if (CURRENT_VIEW === 'dashboard') navigate('dashboard');
}
function applyDashCustomRange() {
  const f = document.getElementById('dash-from').value;
  const t = document.getElementById('dash-to').value;
  if (!f || !t) { toast('กรุณาเลือกวันที่ให้ครบ', 'bad'); return; }
  if (new Date(f) > new Date(t)) { toast('วันที่เริ่มต้นต้องไม่เกินวันสิ้นสุด', 'bad'); return; }
  setDashPeriod('custom', f, t);
}
function daysBetween(iso1, ref) {
  const a = new Date(iso1); a.setHours(0,0,0,0);
  const b = new Date(ref);  b.setHours(0,0,0,0);
  return Math.round((a - b) / (1000*60*60*24));
}

// ---------- TOAST ----------
function toast(msg, kind) {
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(8px)'; }, 2400);
  setTimeout(() => t.remove(), 2800);
}

// ---------- DAILY DECREMENT (run on first load each day) ----------
function runDailyMaintenance() {
  const today = new Date().toISOString().slice(0, 10);
  if (DATA.lastDailyRun === today) return;
  DATA.lastDailyRun = today;

  // Build alerts list
  const newAlerts = [];
  const ref = todayStart();
  DATA.members.forEach(m => {
    if (m.status !== 'Active') return;
    if (m.endDate) {
      const dl = daysBetween(m.endDate, ref);
      if (dl >= 0 && dl <= DATA.settings.expiryWarnDays) {
        newAlerts.push({
          id: nid(), ts: new Date().toISOString(),
          type: 'Member Expiring', branch: m.branch,
          memberId: m.id, memberName: m.name + ' ' + m.surname,
          value: dl + ' วัน', message: 'หมดอายุในอีก ' + dl + ' วัน',
          status: m.lineUid ? 'Sent' : 'No LINE',
        });
      }
    }
    if (m.hours > 0 && m.hours <= DATA.settings.trainerWarnHrs) {
      newAlerts.push({
        id: nid(), ts: new Date().toISOString(),
        type: 'Trainer Hours Low', branch: m.branch,
        memberId: m.id, memberName: m.name + ' ' + m.surname,
        value: m.hours + ' ครั้ง', message: 'เหลือชั่วโมงเทรน ' + m.hours + ' ครั้ง',
        status: m.lineUid ? 'Sent' : 'No LINE',
      });
    }
  });
  // Replace today's alerts with new ones (avoid daily duplicates)
  DATA.alerts = newAlerts.concat(DATA.alerts.filter(a => !isSameDay(a.ts, ref))).slice(0, 200);
  saveData();
}

    b.classList.toggle('active', b.dataset.id === view);

  Object.values(CHARTS).forEach(c => c.destroy && c.destroy());

    'dashboard': 'Dashboard', 'sales': 'บันทึกยอดขาย', 'trainings': 'บันทึกการเทรน',

    'employees': 'พนักงาน', 'reports': 'รายงาน', 'settings': 'ตั้งค่าระบบ',
  };
  document.getElementById('page-title').textContent = titles[view] || view;
  const c = document.getElementById('content');
  c.innerHTML = '';
  if (view === 'dashboard')      renderDashboard(c);
  else if (view === 'sales')     renderSalesEntry(c);
  else if (view === 'trainings') renderTrainingsEntry(c);
  else if (view === 'members')   renderMembers(c);
  else if (view === 'sales-log') renderSalesLog(c);
  else if (view === 'alerts')    renderAlerts(c);
  else if (view === 'employees') renderEmployees(c);
  else if (view === 'reports')   renderReports(c);
  else if (view === 'settings')  renderSettings(c);
}

// ============ DASHBOARD ============
function renderDashboard(root) {
  const range = getDashRange();
  const periodLabel = range.label;

  // Period selector
  const periodBar = document.createElement('div');
  periodBar.className = 'card';
  periodBar.style.padding = '12px 16px';
  periodBar.style.marginBottom = '14px';
  const opts = [
    { id: 'today',     label: 'วันนี้' },
    { id: 'yesterday', label: 'เมื่อวาน' },
    { id: '7d',        label: '7 วัน' },
    { id: '30d',       label: '30 วัน' },
    { id: 'thisMonth', label: 'เดือนนี้' },
    { id: 'lastMonth', label: 'เดือนที่แล้ว' },
    { id: 'custom',    label: 'กำหนดเอง' },
  ];
  const fromVal = DASH_PERIOD.from || new Date().toISOString().slice(0, 10);
  const toVal = DASH_PERIOD.to || new Date().toISOString().slice(0, 10);
  periodBar.innerHTML = `
    <div style="display:flex; flex-wrap:wrap; gap:6px; align-items:center;">
      <span class="muted small" style="margin-right:6px;">ช่วงเวลา:</span>
      ${opts.map(o => `<button class="btn small ${DASH_PERIOD.type === o.id ? '' : 'secondary'}" onclick="setDashPeriod('${o.id}')">${o.label}</button>`).join('')}
      <span id="dash-custom-range" style="display:${DASH_PERIOD.type === 'custom' ? 'inline-flex' : 'none'}; gap:6px; align-items:center; margin-left:8px;">
        <input type="date" id="dash-from" value="${fromVal}" style="padding:5px 8px; border:1px solid var(--border); border-radius:6px;">
        <span class="muted small">ถึง</span>
        <input type="date" id="dash-to" value="${toVal}" style="padding:5px 8px; border:1px solid var(--border); border-radius:6px;">
        <button class="btn small" onclick="applyDashCustomRange()">ใช้</button>
      </span>
    </div>
  `;
  root.appendChild(periodBar);

  const sales = filterByBranch(DATA.sales);
  const trainings = filterByBranch(DATA.trainings);

  const periodSales = sales.filter(s => inRange(s.ts, range));
  const periodMem = periodSales.filter(s => s.type === 'MEM').reduce((a,b) => a + b.amount, 0);
  const periodPt  = periodSales.filter(s => s.type === 'PT').reduce((a,b) => a + b.amount, 0);
  const periodPlan = periodSales.filter(s => s.type === 'Plan').reduce((a,b) => a + b.amount, 0);
  const periodTotal = periodMem + periodPt + periodPlan;
  const periodTrain = trainings.filter(t => t.verified && inRange(t.ts, range)).length;

  const memCount = periodSales.filter(s => s.type === 'MEM').length;
  const ptCount  = periodSales.filter(s => s.type === 'PT').length;

  // KPI cards
  const kpi = document.createElement('div');
  kpi.className = 'kpi-grid';
  kpi.innerHTML = `
    <div class="kpi accent">
      <div class="label">ยอดรวม${periodLabel}</div>
      <div class="value">${thb(periodTotal)}</div>
      <div class="sub">${periodSales.length} รายการ</div>
    </div>
    <div class="kpi">
      <div class="label">MEM ${periodLabel}</div>
      <div class="value">${memCount}</div>
      <div class="sub">${thb(periodMem)}</div>
    </div>
    <div class="kpi">
      <div class="label">PT ${periodLabel}</div>
      <div class="value">${ptCount}</div>
      <div class="sub">${thb(periodPt)}</div>
    </div>
    <div class="kpi ok">
      <div class="label">เทรน${periodLabel}</div>
      <div class="value">${periodTrain}</div>
      <div class="sub">ครั้ง</div>
    </div>
  `;
  root.appendChild(kpi);

  // Branch breakdown card
  const bb = document.createElement('div');
  bb.className = 'card';
  let rows = '';
  const showBranches = canSeeAllBranches() ? DATA.branches.map(b => b.code) : [SESSION.branch];
  let totals = { mem: 0, pt: 0, plan: 0, all: 0, train: 0, overdue: 0 };
  const overdueRef = todayStart();
  showBranches.forEach(code => {
    const br = DATA.branches.find(x => x.code === code);
    const bs = DATA.sales.filter(s => s.branch === code && inRange(s.ts, range));
    const mem = bs.filter(x => x.type === 'MEM').reduce((a,b) => a + b.amount, 0);
    const pt  = bs.filter(x => x.type === 'PT').reduce((a,b) => a + b.amount, 0);
    const pl  = bs.filter(x => x.type === 'Plan').reduce((a,b) => a + b.amount, 0);
    const tot = mem + pt + pl;
    const tr  = DATA.trainings.filter(t => t.branch === code && t.verified && inRange(t.ts, range)).length;
    const overdue = DATA.members.filter(m => m.branch === code && m.status === 'Active' && new Date(m.endDate) < overdueRef).length;
    totals.mem += mem; totals.pt += pt; totals.plan += pl; totals.all += tot; totals.train += tr; totals.overdue += overdue;
    rows += `
      <tr>
        <td><strong>${code}</strong> · <span class="muted">${br ? br.name.replace(code + ' - ', '') : ''}</span></td>
        <td class="right">${thb(mem)}</td>
        <td class="right">${thb(pt)}</td>
        <td class="right">${thb(pl)}</td>
        <td class="right"><strong>${thb(tot)}</strong></td>
        <td class="right">${tr}</td>
        <td class="right">${overdue > 0 ? '<span class="badge bad">'+overdue+'</span>' : '<span class="muted">0</span>'}</td>
      </tr>`;
  });
  if (showBranches.length > 1) {
    rows += `
      <tr style="background: var(--bg); font-weight: 600;">
        <td>รวม</td>
        <td class="right">${thb(totals.mem)}</td>
        <td class="right">${thb(totals.pt)}</td>
        <td class="right">${thb(totals.plan)}</td>
        <td class="right">${thb(totals.all)}</td>
        <td class="right">${totals.train}</td>
        <td class="right">${totals.overdue}</td>
      </tr>`;
  }
  bb.innerHTML = `
    <h2>ยอด${periodLabel}แยกตามสาขา <small>${fmtDate(range.start.toISOString())}${range.days > 1 ? ' - ' + fmtDate(new Date(range.end.getTime() - 86400000).toISOString()) : ''}</small></h2>
    <table>
      <thead><tr>
        <th>สาขา</th><th class="right">MEM</th><th class="right">PT</th><th class="right">Plan</th>
        <th class="right">รวม</th><th class="right">เทรน</th><th class="right">เกินกำหนด</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
  root.appendChild(bb);

  // Two-col: revenue chart + alerts
  const tc = document.createElement('div');
  tc.className = 'two-col';

  const left = document.createElement('div');
  left.className = 'card';
  const chartWindow = Math.max(range.days, 14);
  left.innerHTML = `<h2>ยอดขายรวมรายวัน <small>${chartWindow} วันล่าสุด</small></h2><div class="chart-wrap"><canvas id="dashChartRev"></canvas></div>`;
  tc.appendChild(left);

  const right = document.createElement('div');
  right.className = 'card';
  const recentAlerts = DATA.alerts.filter(a => !canSeeAllBranches() ? a.branch === SESSION.branch : (CURRENT_BRANCH === '*' || a.branch === CURRENT_BRANCH)).slice(0, 6);
  let alertHtml = '';
  if (recentAlerts.length === 0) {
    alertHtml = '<div class="muted small" style="padding: 16px 0;">ไม่มีการแจ้งเตือน</div>';
  } else {
    recentAlerts.forEach(a => {
      const cls = a.type === 'Member Expiring' ? 'warn' : 'info';
      alertHtml += `<div style="display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border);">
        <span class="badge ${cls}" style="white-space: nowrap;">${a.value}</span>
        <div style="min-width: 0; flex: 1;">
          <div style="font-weight: 500;">${a.memberName}</div>
          <div class="muted small">${a.branch} · ${a.message}</div>
        </div>
      </div>`;
    });
  }
  right.innerHTML = `<h2>การแจ้งเตือน</h2>${alertHtml}`;
  tc.appendChild(right);
  root.appendChild(tc);

  // Recent sales card
  const rs = document.createElement('div');
  rs.className = 'card';
  const recent = sales.slice().sort((a,b) => new Date(b.ts) - new Date(a.ts));

  const rsTotalPages = Math.max(1, Math.ceil(recent.length / PAGE_SIZE));
  if (DASH_SALES_PAGE > rsTotalPages) DASH_SALES_PAGE = rsTotalPages;
  if (DASH_SALES_PAGE < 1) DASH_SALES_PAGE = 1;
  const rsStart = (DASH_SALES_PAGE - 1) * PAGE_SIZE;
  const rsPageList = recent.slice(rsStart, rsStart + PAGE_SIZE);

  let rsRows = '';
  rsPageList.forEach(s => {
    const typeBadge = `<span style="font-weight: 600; color: ${typeColor(s.type)};">${s.type}</span>`;
    const notify = renderNotifyBadge(s.notify);
    const slipLink = s.slip ? `<a href="${s.slip}" target="_blank" rel="noopener" style="color: var(--accent);">ดู</a>` : '<span class="muted">—</span>';
    rsRows += `<tr>
      <td>${fmtTimeShort(s.ts)}</td>
      <td>${typeBadge}</td>
      <td>${s.memberName || '<span class="muted">—</span>'}</td>
      <td>${s.branch}</td>
      <td class="right"><strong>${thb(s.amount)}</strong></td>
      <td class="center">${slipLink}</td>
      <td class="center">${notify}</td>
    </tr>`;
  });
  if (rsRows === '') rsRows = '<tr><td colspan="7" class="muted center" style="padding: 20px;">ยังไม่มีรายการขาย</td></tr>';

  const rsRangeLabel = recent.length > 0
    ? `แสดง ${rsStart + 1}–${Math.min(rsStart + PAGE_SIZE, recent.length)} จาก ${recent.length} รายการ`
    : `${recent.length} รายการ`;

  rs.innerHTML = `<h2>รายการขายล่าสุด <small>${rsRangeLabel}</small></h2>
    <table>
      <thead><tr>
        <th>เวลา</th><th>ประเภท</th><th>สมาชิก</th><th>สาขา</th>
        <th class="right">ยอด</th><th class="center">สลิป</th><th class="center">LINE</th>
      </tr></thead>
      <tbody>${rsRows}</tbody>
    </table>
    ${paginationHTML(recent.length, DASH_SALES_PAGE, 'setDashSalesPage')}`;
  root.appendChild(rs);

  // Build chart
  const refToday = todayStart();
  const chartDaysCount = chartWindow;
  const days = [];
  const totals2 = [];
  for (let i = chartDaysCount - 1; i >= 0; i--) {
    const d = new Date(refToday); d.setDate(d.getDate() - i);
    days.push(d.toLocaleDateString('th-TH', { day: '2-digit', month: 'short' }));
    const sum = DATA.sales.filter(s => isSameDay(s.ts, d) && (CURRENT_BRANCH === '*' || s.branch === CURRENT_BRANCH))
                          .reduce((a, b) => a + b.amount, 0);
    totals2.push(sum);
  }
  CHARTS.dashRev = new Chart(document.getElementById('dashChartRev'), {
    type: 'line',
    data: {
      labels: days,
      datasets: [{
        label: 'ยอดรวม', data: totals2,
        borderColor: '#FF5C00', backgroundColor: 'rgba(255,92,0,0.1)',
        fill: true, tension: 0.35, pointRadius: 3,
        pointBackgroundColor: '#FF5C00', borderWidth: 2,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => '฿' + c.parsed.y.toLocaleString() } }
      },
      scales: {
        x: { ticks: { color: '#6B7280', font: { size: 10 }, autoSkip: true, maxTicksLimit: 7 }, grid: { display: false } },
        y: { ticks: { color: '#6B7280', font: { size: 10 }, callback: v => '฿' + (v/1000).toFixed(0) + 'K' }, grid: { color: '#E5E7EB' } }
      }
    }
  });
}

function onSubmitSale(e) {
  e.preventDefault();
  const branch = document.getElementById('se-branch').value;
  const empId = document.getElementById('se-emp').value;
  const type = document.getElementById('se-type').value;
  const amount = Number(document.getElementById('se-amount').value);
  const memberId = document.getElementById('se-member').value;
  const memberName = document.getElementById('se-mname').value;
  const slip = document.getElementById('se-slip').value;
  const note = document.getElementById('se-note').value;

  if ((type === 'MEM' || type === 'PT') && !slip) {
    if (!confirm('ประเภท ' + type + ' ปกติต้องแนบสลิป\nบันทึกโดยไม่มีสลิปจริงหรือ?')) return;
  }

  const sale = {
    id: nid(), ts: new Date().toISOString(),
    branch, empId, type, memberId, memberName, amount, slip, note,
    notify: (type === 'MEM' || type === 'PT')
              ? (slip ? (DATA.settings.lineConfigured ? 'Sent' : 'Pending') : 'Pending')
              : '—',
  };
  DATA.sales.unshift(sale);
  saveData();
  toast('บันทึกยอดเรียบร้อย ' + thb(amount), 'ok');
  if (sale.notify === 'Sent') toast('ส่ง LINE Group แล้ว', 'ok');
  else if (sale.notify === 'Pending') toast('รอส่ง LINE (ตั้งค่า LINE OA ก่อน)', 'warn');
  resetSaleForm();
}

function onPickTrainMember() {
  const sel = document.getElementById('te-member');
  const opt = sel.options[sel.selectedIndex];
  if (opt && opt.dataset.branch) {
    document.getElementById('te-branch').value = opt.dataset.branch;
  }
}

function onSubmitTrain(e) {
  e.preventDefault();
  const branch = document.getElementById('te-branch').value;
  const memberId = document.getElementById('te-member').value;
  const trainerId = document.getElementById('te-trainer').value;
  const pwd = document.getElementById('te-pwd').value;
  const note = document.getElementById('te-note').value;

  const member = DATA.members.find(m => m.id === memberId);
  const trainer = DATA.employees.find(e => e.id === trainerId);
  const br = DATA.branches.find(b => b.code === branch);

  if (!member || !trainer || !br) {
    toast('ข้อมูลไม่ครบ', 'bad'); return;
  }
  if (member.hours <= 0) {
    toast('สมาชิกนี้ไม่เหลือชั่วโมงเทรน', 'bad'); return;
  }
  const verified = (pwd === br.managerPwd);
  if (!verified) {
    DATA.trainings.unshift({
      id: nid(), ts: new Date().toISOString(), branch, memberId,
      memberName: member.name + ' ' + member.surname,
      trainerId, trainerName: trainer.name,
      verified: false, hoursBefore: member.hours, hoursAfter: member.hours,
    });
    saveData();
    toast('รหัสเมเนเจอร์ไม่ถูกต้อง — ไม่หักชั่วโมง', 'bad');
    document.getElementById('te-pwd').value = '';
    return;
  }
  // Deduct
  const hoursBefore = member.hours;
  member.hours = Math.max(0, member.hours - 1);
  DATA.trainings.unshift({
    id: nid(), ts: new Date().toISOString(), branch, memberId,
    memberName: member.name + ' ' + member.surname,
    trainerId, trainerName: trainer.name,
    verified: true, hoursBefore, hoursAfter: member.hours, note,
  });
  // Add as a "Train" sale row for tracking
  DATA.sales.unshift({
    id: nid(), ts: new Date().toISOString(), branch, empId: trainerId,
    type: 'Train', memberId, memberName: member.name + ' ' + member.surname,
    amount: 0, slip: '', note: 'บันทึกเทรน', notify: '—',
  });
  // Alert if low hours
  if (member.hours <= DATA.settings.trainerWarnHrs) {
    DATA.alerts.unshift({
      id: nid(), ts: new Date().toISOString(),
      type: 'Trainer Hours Low', branch,
      memberId: member.id, memberName: member.name + ' ' + member.surname,
      value: member.hours + ' ครั้ง',
      message: 'เหลือชั่วโมงเทรน ' + member.hours + ' ครั้ง',
      status: member.lineUid ? 'Sent' : 'No LINE',
    });
  }
  saveData();
  toast('หักชั่วโมงสำเร็จ — เหลือ ' + member.hours + ' ครั้ง', 'ok');
  navigate('trainings');
}

function renderMembersList() {
  const container = document.getElementById('members-list-container');
  if (!container) return;
  const editable = ['Owner','Manager','Staff'].includes(SESSION.role);
  const card = document.createElement('div');
  card.className = 'card';
  const ref = todayStart();
  let list = filterByBranch(DATA.members);
  if (MEMBER_SEARCH) {
    const q = MEMBER_SEARCH.toLowerCase();
    list = list.filter(m => (m.name + ' ' + m.surname + ' ' + m.id).toLowerCase().includes(q));
  }
  if (MEMBER_STATUS) list = list.filter(m => m.status === MEMBER_STATUS);
  list.sort((a, b) => daysBetween(a.endDate, ref) - daysBetween(b.endDate, ref));

  let rows = '';
  list.forEach(m => {
    const days = daysBetween(m.endDate, ref);
    const dayCls = days < 0 ? 'days-low' : (days <= DATA.settings.expiryWarnDays ? 'days-warn' : '');
    const hrCls = m.hours > 0 && m.hours <= DATA.settings.trainerWarnHrs ? 'hrs-low' : '';
    rows += `<tr>
      <td>${m.id}</td>
      <td><strong>${m.name} ${m.surname}</strong></td>
      <td class="center">${m.age}</td>
      <td class="center">${m.branch}</td>
      <td class="center">${fmtDate(m.endDate)}</td>
      <td class="center ${dayCls}">${days < 0 ? 'หมดแล้ว ' + (-days) + ' วัน' : days + ' วัน'}</td>
      <td class="center ${hrCls}">${m.hours}</td>
      <td>${m.trainer || '<span class="muted">—</span>'}</td>
      <td class="center">${statusBadge(m.status)}</td>
      ${editable ? `<td class="row-actions">
        <button class="btn small secondary" onclick="openMemberModal('${m.id}')">แก้</button>
      </td>` : ''}
    </tr>`;
  });
  if (rows === '') rows = `<tr><td colspan="${editable?10:9}" class="muted center" style="padding: 20px;">ไม่พบข้อมูลสมาชิก</td></tr>`;

  const headerLabel = (MEMBER_SEARCH || MEMBER_STATUS)
    ? `ผลการค้นหา <small>${list.length} รายการ</small>`
    : `สมาชิกทั้งหมด <small>${list.length} รายการ</small>`;

  card.innerHTML = `
    <h2>${headerLabel}</h2>
    <table>
      <thead><tr>
        <th>ID</th><th>ชื่อ-นามสกุล</th><th class="center">อายุ</th>
        <th class="center">สาขา</th><th class="center">วันหมดอายุ</th><th class="center">วันคงเหลือ</th>
        <th class="center">ชม.เทรน</th><th>เทรนเนอร์</th><th class="center">สถานะ</th>
        ${editable ? '<th></th>' : ''}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
  container.innerHTML = '';
  container.appendChild(card);
}

function statusBadge(s) {
  if (s === 'Active')   return '<span class="badge ok">Active</span>';
  if (s === 'Frozen')   return '<span class="badge info">Frozen</span>';
  if (s === 'Expired')  return '<span class="badge bad">Expired</span>';
  if (s === 'Cancelled')return '<span class="badge gray">Cancelled</span>';
  return '<span class="badge gray">' + s + '</span>';
}

function openMemberModal(id) {
  const m = id ? DATA.members.find(x => x.id === id) : null;
  const isNew = !m;
  const branches = DATA.branches.map(b => `<option value="${b.code}" ${m && m.branch===b.code?'selected':''}>${b.code}</option>`).join('');
  const statuses = ['Active','Frozen','Expired','Cancelled']
    .map(s => `<option value="${s}" ${m && m.status===s?'selected':''}>${s}</option>`).join('');

function saveMember(e, idOrNull) {
  e.preventDefault();

    lineUid: document.getElementById('mm-line').value,

// ============ IMPORT MEMBERS (Excel/CSV) ============
async function importMembers(e) {
  const input = e.target;
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  if (typeof XLSX === 'undefined') { toast('โหลด SheetJS ไม่สำเร็จ (ต้องเชื่อมต่ออินเทอร์เน็ต)', 'bad'); return; }

  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
    if (!rows.length) { toast('ไฟล์ไม่มีข้อมูล', 'bad'); return; }
    if (!confirm('พบ ' + rows.length + ' แถวในไฟล์ — เพิ่มเข้าระบบ? (ID ที่ซ้ำจะถูกข้าม)')) return;

    const norm = s => String(s||'').trim().toLowerCase().replace(/\s+/g,'').replace(/[._\-]/g,'');
    const aliases = {
      id:        ['id','memberid','member_id','รหัส','รหัสสมาชิก'],
      name:      ['name','firstname','first_name','ชื่อ'],
      surname:   ['surname','lastname','last_name','นามสกุล'],
      age:       ['age','อายุ'],
      branch:    ['branch','สาขา'],
      startDate: ['startdate','start','start_date','วันสมัคร','วันเริ่ม'],
      endDate:   ['enddate','end','end_date','วันหมดอายุ','วันสิ้นสุด'],
      hours:     ['hours','hour','ชม','ชั่วโมง','ชม.เทรน','ชมเทรน'],
      trainer:   ['trainer','เทรนเนอร์'],
      lineUid:   ['lineuid','line','lineid','line_id','lineuserid'],
      status:    ['status','สถานะ'],
    };
    const colKey = {};
    const firstRowKeys = Object.keys(rows[0]);
    Object.keys(aliases).forEach(field => {
      const wanted = aliases[field].map(norm);
      const k = firstRowKeys.find(k => wanted.includes(norm(k)));
      if (k) colKey[field] = k;
    });

    const toIso = v => {
      if (v === '' || v == null) return '';
      if (v instanceof Date && !isNaN(v)) return v.toISOString();
      if (typeof v === 'number' && XLSX.SSF && XLSX.SSF.parse_date_code) {
        const d = XLSX.SSF.parse_date_code(v);
        if (d) return new Date(Date.UTC(d.y, d.m-1, d.d)).toISOString();
      }
      const d = new Date(v);
      return isNaN(d.getTime()) ? '' : d.toISOString();
    };

    const today = new Date().toISOString();
    const defaultBranch = (DATA.branches[0] && DATA.branches[0].code) || 'BR01';
    const branchCodes = DATA.branches.map(b => b.code);
    const validStatus = ['Active','Frozen','Expired','Cancelled'];
    const existingIds = new Set(DATA.members.map(m => m.id));
    let nextNum = 1000 + DATA.members.length;

    let added = 0, skipped = 0, errors = 0;
    const skippedIds = [];

    rows.forEach((row, idx) => {
      try {
        const get = f => colKey[f] ? row[colKey[f]] : '';
        const name = String(get('name')||'').trim();
        const surname = String(get('surname')||'').trim();
        if (!name && !surname) { errors++; return; }

        let id = String(get('id')||'').trim();
        if (!id) {
          do { nextNum++; id = 'M' + String(nextNum).padStart(4,'0'); }
          while (existingIds.has(id));
        }
        if (existingIds.has(id)) { skipped++; if (skippedIds.length < 10) skippedIds.push(id); return; }

        const startDate = toIso(get('startDate')) || today;
        const endDate = toIso(get('endDate')) || startDate;
        let branch = String(get('branch')||'').trim().toUpperCase();
        if (!branchCodes.includes(branch)) branch = defaultBranch;
        let status = String(get('status')||'').trim();
        if (!validStatus.includes(status)) status = 'Active';

        DATA.members.push({
          id, name, surname,
          age: Number(get('age')) || 0,
          branch,
          startDate, endDate,
          hours: Number(get('hours')) || 0,
          trainer: String(get('trainer')||'').trim(),
          lineUid: String(get('lineUid')||'').trim(),
          status,
        });
        existingIds.add(id);
        added++;
      } catch (err) {
        console.error('row error', idx, err);
        errors++;
      }
    });

    saveData();
    let msg = 'นำเข้าสำเร็จ ' + added + ' คน';
    if (skipped) msg += ' / ข้าม ' + skipped + ' (ID ซ้ำ)';
    if (errors)  msg += ' / ผิดพลาด ' + errors + ' แถว';
    toast(msg, added ? 'ok' : 'bad');
    if (skippedIds.length) console.log('Skipped IDs:', skippedIds);
    navigate('members');
  } catch (err) {
    console.error(err);
    toast('อ่านไฟล์ไม่สำเร็จ: ' + err.message, 'bad');
  }
}

      <td><input type="password" value="${b.managerPwd}" onchange="DATA.branches[${i}].managerPwd=this.value" style="width: 130px;" placeholder="••••"></td>
      <td><input value="${b.lineToken}" onchange="DATA.branches[${i}].lineToken=this.value" style="width: 100%;" placeholder="Channel Access Token"></td>
      <td><input value="${b.lineGroupId}" onchange="DATA.branches[${i}].lineGroupId=this.value" style="width: 100%;" placeholder="LINE Group ID"></td>
      <td class="row-actions"><button class="btn small danger" onclick="deleteBranch(${i})">ลบ</button></td>
    </tr>`;
  });
  card1.innerHTML = `
    <h2>สาขา + LINE OA <small>คลิก "บันทึก" หลังแก้</small></h2>
    <table>
      <thead><tr><th>รหัส</th><th>ชื่อ</th><th>รหัสเมเนเจอร์</th><th>LINE Token</th><th>Group ID</th><th></th></tr></thead>
      <tbody>${brRows}</tbody>
    </table>
    <div style="margin-top: 12px; display: flex; gap: 8px;">
      <button class="btn" onclick="saveSettings()">บันทึกการเปลี่ยนแปลง</button>
      <button class="btn secondary" onclick="addBranch()">+ เพิ่มสาขา</button>
    </div>
  `;
  root.appendChild(card1);

  // Global config
  const card2 = document.createElement('div');
  card2.className = 'card';
  card2.innerHTML = `
    <h2>ค่าทั่วไป</h2>
    <div class="form-grid">
      <div class="field"><label>แจ้งเตือนล่วงหน้าก่อนหมดอายุ (วัน)</label>
        <input type="number" min="1" value="${DATA.settings.expiryWarnDays}" onchange="DATA.settings.expiryWarnDays=Number(this.value);saveData();">
      </div>
      <div class="field"><label>แจ้งเตือนเมื่อชม.เทรนเหลือ ≤</label>
        <input type="number" min="1" value="${DATA.settings.trainerWarnHrs}" onchange="DATA.settings.trainerWarnHrs=Number(this.value);saveData();">
      </div>
      <div class="field"><label>สัญลักษณ์เงิน</label>
        <input value="${DATA.settings.currency}" onchange="DATA.settings.currency=this.value;saveData();">
      </div>
    </div>
  `;
  root.appendChild(card2);

  // Users
  const card3 = document.createElement('div');
  card3.className = 'card';
  let uRows = '';
  DATA.users.forEach((u, i) => {
    uRows += `<tr>
      <td>${u.email}</td>
      <td><strong>${u.name}</strong></td>
      <td><span class="badge gray">${u.role}</span></td>
      <td>${u.branch === '*' ? 'ทุกสาขา' : u.branch}</td>
      <td class="row-actions">
        <button class="btn small secondary" onclick="changePassword(${i})">รีเซ็ตรหัส</button>
        ${u.role !== 'Owner' ? `<button class="btn small danger" onclick="deleteUser(${i})">ลบ</button>` : ''}
      </td>
    </tr>`;
  });
  card3.innerHTML = `
    <h2>ผู้ใช้งานระบบ <small>Login + Role-based access</small></h2>
    <table>
      <thead><tr><th>อีเมล</th><th>ชื่อ</th><th>Role</th><th>สาขา</th><th></th></tr></thead>
      <tbody>${uRows}</tbody>
    </table>
    <div style="margin-top: 12px;"><button class="btn" onclick="addUser()">+ เพิ่มผู้ใช้</button></div>
  `;
  root.appendChild(card3);

  // Backup
  const card4 = document.createElement('div');
  card4.className = 'card';
  card4.innerHTML = `
    <h2>สำรองข้อมูล</h2>
    <p class="muted small" style="margin-bottom: 12px;">ข้อมูลทั้งหมดเก็บใน browser localStorage ของเครื่องนี้ — ใช้ Export เพื่อสำรอง / Import เพื่อย้ายเครื่อง</p>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <button class="btn" onclick="exportJSON()">Export JSON</button>
      <button class="btn secondary" onclick="document.getElementById('import-file').click()">Import JSON</button>
      <input id="import-file" type="file" accept=".json" style="display: none;" onchange="importJSON(event)">
      <button class="btn danger" onclick="resetAll()">รีเซ็ตเป็นข้อมูลตั้งต้น</button>
    </div>
  `;
  root.appendChild(card4);
}

function saveSettings() { saveData(); toast('บันทึกเรียบร้อย', 'ok'); navigate('settings'); }
function addBranch() {
  const code = prompt('รหัสสาขาใหม่ (เช่น BR04):');
  if (!code) return;
  if (DATA.branches.some(b => b.code === code)) { toast('รหัสซ้ำ', 'bad'); return; }
  DATA.branches.push({ code, name: 'FITSTATION 24 - ' + code, lineToken: '', lineGroupId: '', managerPwd: 'changeme' });
  saveData(); navigate('settings');
}
function deleteBranch(idx) {
  if (!confirm('ลบสาขา ' + DATA.branches[idx].code + ' ?')) return;
  DATA.branches.splice(idx, 1);
  saveData(); navigate('settings');
}
function addUser() {
  const email = prompt('อีเมลผู้ใช้ใหม่:');
  if (!email) return;
  const name = prompt('ชื่อ-นามสกุล:'); if (!name) return;
  const role = prompt('Role (Owner/Manager/Staff/Trainer):', 'Staff');
  if (!['Owner','Manager','Staff','Trainer'].includes(role)) { toast('Role ไม่ถูก', 'bad'); return; }
  const branchInput = prompt('สาขา (รหัสสาขา หรือ * สำหรับทุกสาขา):', 'BR01');
  const pwd = prompt('รหัสผ่านเริ่มต้น:', 'changeme');
  DATA.users.push({ email, pwd, name, role, branch: branchInput || 'BR01' });
  saveData(); toast('เพิ่มผู้ใช้เรียบร้อย', 'ok'); navigate('settings');
}
function changePassword(idx) {
  const newPwd = prompt('รหัสผ่านใหม่ของ ' + DATA.users[idx].email + ':');
  if (!newPwd) return;
  DATA.users[idx].pwd = newPwd; saveData(); toast('รีเซ็ตรหัสเรียบร้อย', 'ok');
}
function deleteUser(idx) {
  if (!confirm('ลบผู้ใช้ ' + DATA.users[idx].email + ' ?')) return;
  DATA.users.splice(idx, 1); saveData(); navigate('settings');
}

// ============ EXPORT/IMPORT ============
function exportJSON() {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'fitstation24-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Export สำเร็จ', 'ok');
}
function importJSON(e) {
  const file = e.target.files[0]; if (!file) return;
  if (!confirm('Import จะแทนที่ข้อมูลทั้งหมด ดำเนินการต่อ?')) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      DATA = JSON.parse(r.result);
      saveData(); toast('Import สำเร็จ', 'ok'); navigate('settings');
    } catch (err) { toast('ไฟล์ไม่ถูกต้อง', 'bad'); }
  };
  r.readAsText(file);
}
function resetAll() {
  if (!confirm('รีเซ็ตข้อมูลทั้งหมดกลับเป็นค่าตั้งต้น? (ลบทุกอย่าง)')) return;
  DATA = defaultData(); saveData(); toast('รีเซ็ตเรียบร้อย', 'ok'); navigate('dashboard');
}
function exportCSV(kind) {
  let rows = [];
  if (kind === 'sales') {
    rows.push(['Time','Branch','EmpID','Type','MemberID','MemberName','Amount','Slip','Note','Notify']);
    filterByBranch(DATA.sales).forEach(s => {
      rows.push([s.ts, s.branch, s.empId, s.type, s.memberId, s.memberName, s.amount, s.slip, s.note, s.notify]);
    });
  }
  const csv = rows.map(r => r.map(v => '"' + String(v||'').replace(/"/g,'""') + '"').join(',')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = kind + '-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click(); URL.revokeObjectURL(url);
}

// ============ MODAL ============
function showModal(html) {
  const host = document.getElementById('modal-host');
  host.innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal() {
  document.getElementById('modal-host').innerHTML = '';
}

// ============ INIT ============
loadData();
SESSION = loadSession();
if (SESSION) bootApp();

// Allow Enter key to submit login
document.getElementById('login-pwd').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
</script>
