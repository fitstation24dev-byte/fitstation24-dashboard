name: รายงานสรุปยอด LINE

on:
  schedule:
    - cron: '0 1 * * *'    # 08:00 เวลาไทย — สรุปผลรายวัน (เมื่อวาน) → กลุ่มสาขา
    - cron: '0 16 * * *'   # 23:00 เวลาไทย — รายงานผู้บริหาร + สรุปรายเดือนสาขา (วันสิ้นเดือน)
  workflow_dispatch:
    inputs:
      report:
        description: 'บังคับส่งรายงาน (ว่าง = ตามกำหนดของรอบปัจจุบัน)'
        type: choice
        options: ['', exec-daily, exec-weekly, exec-monthly, branch-daily, branch-monthly]
        default: ''
      dry_run:
        description: 'แค่แสดงข้อความ ไม่ส่ง LINE'
        type: boolean
        default: true

concurrency:
  group: exec-report
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ส่งรายงาน
        env:
          TZ: Asia/Bangkok
          JOB: ${{ github.event.schedule == '0 1 * * *' && 'morning' || (github.event.schedule == '0 16 * * *' && 'evening' || '') }}
          REPORT: ${{ inputs.report }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/send-exec-report.js
