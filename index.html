<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FITSTATION 24 — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --brand: #0B132B;
    --accent: #FF5C00;
    --teal: #5BC0BE;
    --ok: #16A34A;
    --warn: #F59E0B;
    --bad: #DC2626;
    --bg: #F4F4F5;
    --surface: #FFFFFF;
    --border: #E5E7EB;
    --muted: #6B7280;
    --text: #1F2A44;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Sarabun', 'Noto Sans Thai', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: 14px; }
  .hidden { display: none !important; }

  /* ====== LOGIN ====== */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0B132B 0%, #1C2541 100%);
    padding: 20px;
  }
  .login-card {
    background: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 380px;
  }
  .login-card .logo {
    text-align: center;
    margin-bottom: 24px;
  }
  .login-card .logo .name {
    font-size: 22px;
    font-weight: 700;
    color: var(--brand);
    letter-spacing: 1px;
  }
  .login-card .logo .sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  .login-card label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    margin-top: 14px;
  }
  .login-card input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s;
  }
  .login-card input:focus { border-color: var(--accent); }
  .login-card .err {
    background: #FEE2E2;
    color: var(--bad);
    padding: 10px;
    border-radius: 8px;
    font-size: 12px;
    margin-top: 14px;
    display: none;
  }
  .login-card .err.show { display: block; }
  .login-card button.primary {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-weight: 600;
    margin-top: 20px;
    transition: background 0.15s;
  }
  .login-card button.primary:hover { background: #E04D00; }
  .login-card .demo {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
  }
  .login-card .demo-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-family: ui-monospace, 'SF Mono', Monaco, monospace;
    cursor: pointer;
  }
  .login-card .demo-row:hover { color: var(--accent); }

  /* ====== APP LAYOUT ====== */
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 240px;
    background: var(--brand);
    color: white;
    padding: 20px 0;
    flex-shrink: 0;
  }
  .sidebar .brand {
    padding: 0 20px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .sidebar .brand .name {
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 1px;
  }
  .sidebar .brand .sub {
    font-size: 11px;
    color: #9CA3AF;
    margin-top: 2px;
  }
  .sidebar nav { padding: 12px 0; }
  .sidebar nav button {
    display: block;
    width: 100%;
    padding: 10px 20px;
    background: transparent;
    color: #D1D5DB;
    border: none;
    text-align: left;
    font-size: 13px;
    transition: all 0.12s;
    border-left: 3px solid transparent;
  }
  .sidebar nav button:hover {
    background: rgba(255,255,255,0.05);
    color: white;
  }
  .sidebar nav button.active {
    background: rgba(255,92,0,0.1);
    color: white;
    border-left-color: var(--accent);
    font-weight: 600;
  }
  .sidebar .user-box {
    margin-top: auto;
    padding: 16px 20px;
    border-top: 1px solid rgba(255,255,255,0.1);
    font-size: 12px;
  }
  .sidebar .user-box .uname { color: white; font-weight: 600; }
  .sidebar .user-box .urole { color: #9CA3AF; font-size: 11px; }
  .sidebar .user-box button {
    margin-top: 8px;
    background: transparent;
    color: #D1D5DB;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11px;
    width: 100%;
  }
  .sidebar .user-box button:hover { background: rgba(255,255,255,0.05); }

  .main {
    flex: 1;
    overflow-x: hidden;
  }
  .topbar {
    background: white;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
  }
  .topbar .branch-pick select {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    font-size: 13px;
  }
  .content { padding: 24px 28px; }

  /* ====== KPI cards ====== */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 22px;
  }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .kpi .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .kpi .value { font-size: 26px; font-weight: 700; color: var(--brand); }
  .kpi .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .kpi.accent .value { color: var(--accent); }
  .kpi.ok .value { color: var(--ok); }

  /* ====== Cards ====== */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .card h2 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    color: var(--text);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card h2 small {
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
  }

  /* ====== Employee cards ====== */
  .emp-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px;
  }
  .emp-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 16px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    transition: box-shadow 0.15s, transform 0.15s;
  }
  .emp-card:hover {
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    transform: translateY(-2px);
  }
  .emp-avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    object-fit: cover;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: var(--muted);
    overflow: hidden;
    font-weight: 600;
  }
  img.emp-avatar { display: block; }
  .emp-card .ename { font-weight: 600; font-size: 14px; color: var(--text); }
  .emp-card .epos { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .emp-card .eid {
    font-size: 10px; color: var(--muted); margin-top: 6px;
    letter-spacing: 0.5px; font-family: ui-monospace, monospace;
  }
  .emp-card .emeta { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .emp-card .eactions { margin-top: 14px; display: flex; gap: 6px; width: 100%; }
  .emp-card .eactions button { flex: 1; }

  /* Photo upload (in modal) */
  .photo-upload { display: flex; align-items: center; gap: 14px; }
  .photo-upload .preview {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--bg); border: 1px dashed var(--border);
    overflow: hidden; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; color: var(--muted);
  }
  .photo-upload .preview img { width: 100%; height: 100%; object-fit: cover; }
  .photo-upload .controls { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .photo-upload input[type=file] { font-size: 12px; }

  /* Slip upload (in sales form) */
  .slip-input { display: flex; gap: 12px; align-items: flex-start; }
  .slip-preview {
    width: 72px; height: 72px; border-radius: 8px;
    background: var(--bg); border: 1px dashed var(--border);
    flex-shrink: 0; cursor: pointer; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: var(--muted);
    transition: border-color 0.15s;
  }
  .slip-preview:hover { border-color: var(--accent); }
  .slip-preview img { width: 100%; height: 100%; object-fit: cover; }
  .slip-controls { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
  .slip-controls input[type=file] { font-size: 12px; }

  /* ====== Tables ====== */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left;
    color: var(--muted);
    font-weight: 500;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  tbody td {
    padding: 10px;
    border-bottom: 1px solid var(--border);
  }
  tbody tr:hover { background: var(--bg); }
  td.right, th.right { text-align: right; }
  td.center, th.center { text-align: center; }

  /* Badges */
  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 500;
  }
  .badge.ok { background: #DCFCE7; color: #166534; }
  .badge.warn { background: #FEF3C7; color: #92400E; }
  .badge.bad { background: #FEE2E2; color: #991B1B; }
  .badge.info { background: #DBEAFE; color: #1E40AF; }
  .badge.gray { background: #F3F4F6; color: #4B5563; }

  /* ====== Forms ====== */
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 14px;
  }
  .form-grid .field { display: flex; flex-direction: column; gap: 4px; }
  .form-grid label { font-size: 11px; color: var(--muted); }
  .form-grid input, .form-grid select, .form-grid textarea {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
    transition: border-color 0.15s;
    background: white;
  }
  .form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus {
    border-color: var(--accent);
  }
  .form-grid .field.full { grid-column: 1 / -1; }

  button.btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 9px 18px;
    border-radius: 7px;
    font-weight: 600;
    font-size: 13px;
    transition: background 0.15s;
  }
  button.btn:hover { background: #E04D00; }
  button.btn.secondary {
    background: white;
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.btn.secondary:hover { background: var(--bg); }
  button.btn.danger { background: var(--bad); }
  button.btn.small { padding: 5px 10px; font-size: 12px; }

  .row-actions { display: flex; gap: 6px; }

  /* Charts */
  .chart-wrap {
    position: relative;
    height: 240px;
    width: 100%;
  }

  /* Two-col layout */
  .two-col {
    display: grid;
    grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
    gap: 18px;
  }
  @media (max-width: 900px) {
    .two-col { grid-template-columns: 1fr; }
    .sidebar { width: 60px; }
    .sidebar nav button { padding: 10px 18px; font-size: 0; }
    .sidebar .brand, .sidebar .user-box { padding-left: 14px; padding-right: 14px; }
  }

  /* Modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
  }
  .modal {
    background: white;
    border-radius: 12px;
    padding: 24px;
    width: 95%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--brand); color: white;
    padding: 12px 18px; border-radius: 8px;
    font-size: 13px; z-index: 2000;
    transition: opacity 0.3s, transform 0.3s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }
  .toast.ok { background: var(--ok); }
  .toast.bad { background: var(--bad); }
  .toast.warn { background: var(--warn); color: #422006; }

  /* Member status colors */
  .days-low { color: var(--bad); font-weight: 600; }
  .days-warn { color: var(--warn); font-weight: 600; }
  .hrs-low { color: var(--bad); font-weight: 600; }

  /* Misc */
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .toolbar .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .toolbar input, .toolbar select {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: white;
    font-size: 13px;
  }
</style>
</head>
<body>

<!-- ============== LOGIN SCREEN ============== -->
<div id="login-screen">
  <div class="login-card">
    <div class="logo">
      <div class="name">FITSTATION 24</div>
      <div class="sub">Dashboard System</div>
    </div>
    <label>Username</label>
    <input id="login-email" type="text" placeholder="username" autocomplete="username">
    <label>Password</label>
    <input id="login-pwd" type="password" placeholder="••••••••" autocomplete="current-password">
    <div id="login-err" class="err">Username หรือ Password ไม่ถูกต้อง</div>
    <button class="primary" onclick="doLogin()">เข้าสู่ระบบ</button>
  </div>
</div>

<!-- ============== MAIN APP ============== -->
<div id="app" class="app hidden">
  <aside class="sidebar" style="display: flex; flex-direction: column;">
    <div class="brand">
      <div class="name">FITSTATION 24</div>
      <div class="sub">Dashboard System</div>
    </div>
    <nav id="nav" style="flex: 1;"></nav>
    <div class="user-box">
      <div class="uname" id="user-name">—</div>
      <div class="urole" id="user-role">—</div>
      <button onclick="doLogout()">ออกจากระบบ</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="page-title">Dashboard</h1>
      <div style="display:flex; align-items:center; gap:14px;">
        <span id="db-status" style="font-size: 11px; color: #9CA3AF;" title="สถานะการซิงค์ข้อมูล">○ Offline</span>
        <div class="branch-pick">
          <select id="branch-filter" onchange="onBranchChange()"></select>
        </div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="modal-host"></div>

<script>
// ============================================================
// FITSTATION 24 — Single-file dashboard
// All data persists in localStorage. Export/Import for backup.
// ============================================================

const LS_KEY = 'fitstation24_data_v1';
const SESSION_KEY = 'fitstation24_session';

// ============================================================
// SUPABASE ADAPTER (cross-device sync)
// Falls back silently to localStorage if Supabase is unavailable.
// ============================================================
const SUPABASE_URL = 'https://xfnlwuqnxbrhbwveiwgm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhmbmx3dXFueGJyaGJ3dmVpd2dtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MjEzNDIsImV4cCI6MjA5MzM5NzM0Mn0.UKMN7PW-KxMuMNUcA3Iac9GdGI0-nMb2ZpdSC1q6QWU';
const LINE_FUNCTION_URL = SUPABASE_URL + '/functions/v1/swift-handler';
const SLIP_BUCKET = 'slips';

const TABLE_SPEC = {
  branches:  { table: 'app_branches',  pk: 'code',  fields: [['code','code'],['name','name'],['lineToken','line_token'],['lineGroupId','line_group_id'],['managerEmail','manager_email'],['managerPwd','manager_pwd']] },
  users:     { table: 'app_users',     pk: 'email', fields: [['email','email'],['pwd','pwd'],['name','name'],['role','role'],['branch','branch']] },
  employees: { table: 'app_employees', pk: 'id',    fields: [['id','id'],['name','name'],['surname','surname'],['position','position'],['branch','branch'],['status','status'],['photo','photo']] },
  members:   { table: 'app_members',   pk: 'id',    fields: [['id','id'],['name','name'],['surname','surname'],['age','age'],['branch','branch'],['startDate','start_date'],['endDate','end_date'],['hours','hours'],['trainer','trainer'],['lineUid','line_uid'],['status','status']] },
  sales:     { table: 'app_sales',     pk: 'id',    fields: [['id','id'],['ts','ts'],['branch','branch'],['empId','emp_id'],['type','type'],['memberId','member_id'],['memberName','member_name'],['amount','amount'],['channel','channel'],['slip','slip'],['note','note'],['notify','notify']] },
  trainings: { table: 'app_trainings', pk: 'id',    fields: [['id','id'],['ts','ts'],['branch','branch'],['memberId','member_id'],['memberName','member_name'],['trainerId','trainer_id'],['trainerName','trainer_name'],['verified','verified'],['hoursBefore','hours_before'],['hoursAfter','hours_after']] },
  alerts:    { table: 'app_alerts',    pk: 'id',    fields: [['id','id'],['ts','ts'],['kind','kind'],['message','message'],['branch','branch'],['read','read']] },
};

const db = {
  client: null,
  enabled: false,
  saveTimer: null,
  status: 'offline',  // 'offline' | 'online' | 'error' | 'syncing'

  init() {
    if (!window.supabase || !SUPABASE_URL || !SUPABASE_KEY) {
      console.warn('[db] Supabase not configured, using localStorage only');
      return false;
    }
    try {
      this.client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      this.enabled = true;
      this.setStatus('syncing');
      return true;
    } catch (e) {
      console.error('[db] init failed', e);
      return false;
    }
  },

  setStatus(s) {
    this.status = s;
    const el = document.getElementById('db-status');
    if (!el) return;
    const map = {
      online:  { text: '● Online',  color: '#15803D', title: 'ซิงค์ออนไลน์ทำงานอยู่' },
      offline: { text: '○ Offline', color: '#9CA3AF', title: 'ใช้ localStorage เท่านั้น' },
      syncing: { text: '◌ Syncing', color: '#D97706', title: 'กำลังซิงค์ข้อมูล' },
      error:   { text: '⚠ Sync error', color: '#DC2626', title: 'ซิงค์ขัดข้อง — แก้ไขในเครื่องอย่างเดียว' },
    };
    const m = map[s] || map.offline;
    el.textContent = m.text;
    el.style.color = m.color;
    el.title = m.title;
  },

  toRow(name, item) {
    const row = {};
    for (const [js, sql] of TABLE_SPEC[name].fields) row[sql] = item[js] !== undefined ? item[js] : null;
    return row;
  },
  toItem(name, row) {
    const item = {};
    for (const [js, sql] of TABLE_SPEC[name].fields) item[js] = row[sql];
    return item;
  },

  async loadAll() {
    if (!this.enabled) return null;
    try {
      const out = {};
      for (const [name, spec] of Object.entries(TABLE_SPEC)) {
        const { data, error } = await this.client.from(spec.table).select('*');
        if (error) throw error;
        out[name] = (data || []).map(r => this.toItem(name, r));
      }
      const { data: settingsRows, error: se } = await this.client.from('app_settings').select('*');
      if (se) throw se;
      const sm = {};
      for (const r of (settingsRows || [])) sm[r.key] = r.value;
      out.settings = sm.global || null;
      out.lastDailyRun = sm.lastDailyRun || '';
      const { data: logRows, error: le } = await this.client.from('app_login_log').select('*').order('id', { ascending: false }).limit(200);
      if (le) throw le;
      out.loginLog = (logRows || []).map(r => ({ ts: r.ts, email: r.email, role: r.role, branch: r.branch, action: r.action }));
      this.setStatus('online');
      return out;
    } catch (e) {
      console.error('[db] loadAll failed', e);
      this.setStatus('error');
      return null;
    }
  },

  async pushAll(data) {
    if (!this.enabled) return;
    try {
      const ops = [];
      for (const [name, spec] of Object.entries(TABLE_SPEC)) {
        const items = data[name] || [];
        if (items.length === 0) continue;
        const rows = items.map(i => this.toRow(name, i));
        ops.push(this.client.from(spec.table).upsert(rows, { onConflict: spec.pk }));
      }
      ops.push(this.client.from('app_settings').upsert({ key: 'global', value: data.settings || {} }, { onConflict: 'key' }));
      ops.push(this.client.from('app_settings').upsert({ key: 'lastDailyRun', value: data.lastDailyRun || '' }, { onConflict: 'key' }));
      const results = await Promise.all(ops);
      for (const r of results) if (r.error) throw r.error;
      this.setStatus('online');
    } catch (e) {
      console.error('[db] pushAll failed', e);
      this.setStatus('error');
    }
  },

  pushAllDebounced(data) {
    if (!this.enabled) return;
    clearTimeout(this.saveTimer);
    this.setStatus('syncing');
    this.saveTimer = setTimeout(() => this.pushAll(data), 700);
  },

  async del(name, id) {
    if (!this.enabled) return;
    const spec = TABLE_SPEC[name];
    if (!spec) return;
    try {
      const { error } = await this.client.from(spec.table).delete().eq(spec.pk, id);
      if (error) throw error;
    } catch (e) { console.error('[db] delete failed', name, id, e); }
  },

  async appendLogin(entry) {
    if (!this.enabled) return;
    try { await this.client.from('app_login_log').insert({ ts: entry.ts, email: entry.email, role: entry.role, branch: entry.branch, action: entry.action }); }
    catch (e) { console.error('[db] login log append failed', e); }
  },

  async isEmpty() {
    if (!this.enabled) return false;
    try {
      const { count } = await this.client.from('app_branches').select('*', { count: 'exact', head: true });
      return (count || 0) === 0;
    } catch (e) { return false; }
  },

  subscribe(onChange) {
    if (!this.enabled) return;
    const tables = Object.values(TABLE_SPEC).map(s => s.table).concat(['app_settings', 'app_login_log']);
    let pendingTimer = null;
    const trigger = (t) => {
      clearTimeout(pendingTimer);
      pendingTimer = setTimeout(() => onChange(t), 300);
    };
    for (const t of tables) {
      this.client.channel('rt:' + t)
        .on('postgres_changes', { event: '*', schema: 'public', table: t }, () => trigger(t))
        .subscribe();
    }
  },
};

// ---------- STORAGE ----------
let DATA = null;
let SESSION = null;
let CURRENT_VIEW = 'dashboard';
let CURRENT_BRANCH = '*';
let CHARTS = {};

async function loadData() {
  // 1. Try Supabase first
  if (db.enabled) {
    const remote = await db.loadAll();
    if (remote) {
      const empty = await db.isEmpty();
      if (empty) {
        // First-run: seed Supabase with localStorage data if available, else defaults
        let seedSrc = null;
        try {
          const raw = localStorage.getItem(LS_KEY);
          if (raw) seedSrc = JSON.parse(raw);
        } catch {}
        DATA = seedSrc || defaultData();
        await db.pushAll(DATA);
      } else {
        const seed = defaultData();
        DATA = {
          settings:      remote.settings  || seed.settings,
          branches:      remote.branches.length  ? remote.branches  : seed.branches,
          users:         remote.users.length     ? remote.users     : seed.users,
          employees:     remote.employees,
          members:       remote.members,
          sales:         remote.sales,
          trainings:     remote.trainings,
          alerts:        remote.alerts,
          loginLog:      remote.loginLog,
          lastDailyRun:  remote.lastDailyRun,
        };
      }
      localStorage.setItem(LS_KEY, JSON.stringify(DATA));
      return;
    }
  }
  // 2. Fallback to localStorage
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) {
      DATA = defaultData();
      saveData();
    } else {
      DATA = JSON.parse(raw);
    }
  } catch (e) {
    console.error('loadData error', e);
    DATA = defaultData();
    saveData();
  }
}

function saveData() {
  localStorage.setItem(LS_KEY, JSON.stringify(DATA));
  db.pushAllDebounced(DATA);
}

function loadSession() {
  try {
    const raw = sessionStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function saveSession(s) {
  if (s) sessionStorage.setItem(SESSION_KEY, JSON.stringify(s));
  else sessionStorage.removeItem(SESSION_KEY);
}

// ---------- AUTH ----------
function doLogin() {
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const pwd = document.getElementById('login-pwd').value;
  const u = DATA.users.find(x => x.email.toLowerCase() === email && x.pwd === pwd);
  if (!u) {
    document.getElementById('login-err').classList.add('show');
    return;
  }
  SESSION = { email: u.email, name: u.name, role: u.role, branch: u.branch, loginAt: new Date().toISOString() };
  saveSession(SESSION);
  const logEntry = { ts: SESSION.loginAt, email: u.email, role: u.role, branch: u.branch, action: 'LOGIN' };
  DATA.loginLog.unshift(logEntry);
  if (DATA.loginLog.length > 200) DATA.loginLog = DATA.loginLog.slice(0, 200);
  db.appendLogin(logEntry);
  saveData();
  bootApp();
}

function doLogout() {
  SESSION = null;
  saveSession(null);
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('login-email').value = '';
  document.getElementById('login-pwd').value = '';

}

// ---------- ROLE / BRANCH HELPERS ----------
function visibleBranches() {
  if (!SESSION) return [];
  if (SESSION.branch === '*') return DATA.branches.map(b => b.code);
  return [SESSION.branch];
}

function canSeeAllBranches() { return SESSION && SESSION.branch === '*'; }
function isOwner() { return SESSION && SESSION.role === 'Owner'; }
function isManagerOrAbove() { return SESSION && (SESSION.role === 'Owner' || SESSION.role === 'Manager'); }
function effectiveBranchFilter() {
  // If user can only see one branch, force-pick it
  if (!canSeeAllBranches()) return SESSION.branch;
  return CURRENT_BRANCH;
}
function filterByBranch(arr) {
  const b = effectiveBranchFilter();
  if (b === '*') return arr;
  return arr.filter(x => x.branch === b);
}

// ---------- FORMATTERS ----------
function thb(n) { return DATA.settings.currency + Number(n || 0).toLocaleString('th-TH'); }
function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('th-TH', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
}
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: 'numeric' });
}
function fmtTimeShort(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', hour12: false });
}
function todayStart() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function isSameDay(iso, refDate) {
  const d = new Date(iso);
  return d.getFullYear() === refDate.getFullYear() && d.getMonth() === refDate.getMonth() && d.getDate() === refDate.getDate();
}
function daysBetween(iso1, ref) {
  const a = new Date(iso1); a.setHours(0,0,0,0);
  const b = new Date(ref);  b.setHours(0,0,0,0);
  return Math.round((a - b) / (1000*60*60*24));
}

// ---------- TOAST ----------
function toast(msg, kind) {
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(8px)'; }, 2400);
  setTimeout(() => t.remove(), 2800);
}

// ---------- DAILY DECREMENT (run on first load each day) ----------
function runDailyMaintenance() {
  const today = new Date().toISOString().slice(0, 10);
  if (DATA.lastDailyRun === today) return;
  DATA.lastDailyRun = today;

  // Build alerts list
  const newAlerts = [];
  const ref = todayStart();
  DATA.members.forEach(m => {
    if (m.status !== 'Active') return;
    if (m.endDate) {
      const dl = daysBetween(m.endDate, ref);
      if (dl >= 0 && dl <= DATA.settings.expiryWarnDays) {
        newAlerts.push({
          id: nid(), ts: new Date().toISOString(),
          type: 'Member Expiring', branch: m.branch,
          memberId: m.id, memberName: m.name + ' ' + m.surname,
          value: dl + ' วัน', message: 'หมดอายุในอีก ' + dl + ' วัน',
          status: m.lineUid ? 'Sent' : 'No LINE',
        });
      }
    }
    if (m.hours > 0 && m.hours <= DATA.settings.trainerWarnHrs) {
      newAlerts.push({
        id: nid(), ts: new Date().toISOString(),
        type: 'Trainer Hours Low', branch: m.branch,
        memberId: m.id, memberName: m.name + ' ' + m.surname,
        value: m.hours + ' ครั้ง', message: 'เหลือชั่วโมงเทรน ' + m.hours + ' ครั้ง',
        status: m.lineUid ? 'Sent' : 'No LINE',
      });
    }
  });
  // Replace today's alerts with new ones (avoid daily duplicates)
  DATA.alerts = newAlerts.concat(DATA.alerts.filter(a => !isSameDay(a.ts, ref))).slice(0, 200);
  saveData();
}

  document.getElementById('app').classList.remove('hidden');
  document.getElementById('user-name').textContent = SESSION.name;
  document.getElementById('user-role').textContent = SESSION.role + (SESSION.branch !== '*' ? ' · ' + SESSION.branch : '');

    { id: 'sales',      label: 'บันทึกยอดขาย',      roles: ['Owner','Manager','Staff'] },

    { id: 'alerts',     label: 'การแจ้งเตือน',     roles: ['Owner','Manager','Staff'] },
    { id: 'employees',  label: 'พนักงาน',           roles: ['Owner','Manager'] },

    { id: 'settings',   label: 'ตั้งค่าระบบ',       roles: ['Owner'] },
  ];
  nav.innerHTML = '';
  items.forEach(i => {
    if (!i.roles.includes(SESSION.role)) return;
    const b = document.createElement('button');
    b.textContent = i.label;
    b.dataset.id = i.id;
    b.onclick = () => navigate(i.id);
    nav.appendChild(b);
  });

  // Branch picker
  const bf = document.getElementById('branch-filter');
  bf.innerHTML = '';
  if (canSeeAllBranches()) {
    const opt = document.createElement('option');
    opt.value = '*'; opt.textContent = 'ทุกสาขา';
    bf.appendChild(opt);
  }
  visibleBranches().forEach(code => {
    const br = DATA.branches.find(b => b.code === code);
    if (br) {
      const opt = document.createElement('option');
      opt.value = code;
      opt.textContent = br.name;
      bf.appendChild(opt);
    }
  });
  CURRENT_BRANCH = canSeeAllBranches() ? '*' : SESSION.branch;
  bf.value = CURRENT_BRANCH;

  runDailyMaintenance();
  navigate('dashboard');
}

function onBranchChange() {
  CURRENT_BRANCH = document.getElementById('branch-filter').value;
  navigate(CURRENT_VIEW);
}

function navigate(view) {
  CURRENT_VIEW = view;
  document.querySelectorAll('#nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.id === view);
  });
  Object.values(CHARTS).forEach(c => c.destroy && c.destroy());
  CHARTS = {};
  const titles = {
    'dashboard': 'Dashboard', 'sales': 'บันทึกยอดขาย', 'trainings': 'บันทึกการเทรน',
    'members': 'สมาชิก', 'sales-log': 'ประวัติการขาย', 'alerts': 'การแจ้งเตือน',
    'employees': 'พนักงาน', 'reports': 'รายงาน', 'settings': 'ตั้งค่าระบบ',
  };
  document.getElementById('page-title').textContent = titles[view] || view;
  const c = document.getElementById('content');
  c.innerHTML = '';

  else if (view === 'sales')     renderSalesEntry(c);
  else if (view === 'trainings') renderTrainingsEntry(c);
  else if (view === 'members')   renderMembers(c);

  else if (view === 'alerts')    renderAlerts(c);
  else if (view === 'employees') renderEmployees(c);
  else if (view === 'reports')   renderReports(c);

}

// ============ DASHBOARD ============
function renderDashboard(root) {
  const ref = todayStart();
  const tomorrow = new Date(ref); tomorrow.setDate(tomorrow.getDate() + 1);

  const sales = filterByBranch(DATA.sales);
  const trainings = filterByBranch(DATA.trainings);

  const todaySales = sales.filter(s => isSameDay(s.ts, ref));
  const todayMem = todaySales.filter(s => s.type === 'MEM').reduce((a,b) => a + b.amount, 0);
  const todayPt  = todaySales.filter(s => s.type === 'PT').reduce((a,b) => a + b.amount, 0);
  const todayPlan = todaySales.filter(s => s.type === 'Plan').reduce((a,b) => a + b.amount, 0);
  const todayTotal = todayMem + todayPt + todayPlan;
  const todayTrain = trainings.filter(t => t.verified && isSameDay(t.ts, ref)).length;

  const memCount = todaySales.filter(s => s.type === 'MEM').length;
  const ptCount  = todaySales.filter(s => s.type === 'PT').length;

  // KPI cards
  const kpi = document.createElement('div');
  kpi.className = 'kpi-grid';
  kpi.innerHTML = `
    <div class="kpi accent">
      <div class="label">ยอดรวมวันนี้</div>

  // Branch breakdown card
  const bb = document.createElement('div');

function handleSaleSlip(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { toast('กรุณาเลือกไฟล์รูปภาพ', 'bad'); return; }
  if (file.size > 8 * 1024 * 1024) { toast('ไฟล์ใหญ่เกิน 8MB', 'bad'); return; }
  const reader = new FileReader();
  reader.onload = ev2 => {
    const img = new Image();
    img.onload = () => {
      const max = 800;
      const ratio = Math.min(max / img.width, max / img.height, 1);
      const w = Math.round(img.width * ratio);
      const h = Math.round(img.height * ratio);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      const slipEl = document.getElementById('se-slip');
      if (slipEl) { slipEl.value = dataUrl; updateSlipPreview(); updateLinePreview(); }
    };
    img.onerror = () => toast('ไม่สามารถอ่านไฟล์รูปได้', 'bad');
    img.src = ev2.target.result;
  };
  reader.readAsDataURL(file);
}

async function uploadSlipToStorage(dataUrl, saleId) {
  if (!dataUrl) return '';
  if (!dataUrl.startsWith('data:')) return dataUrl; // already a URL — pass through
  if (!db.client) throw new Error('Supabase ยังไม่เชื่อมต่อ');
  const blob = await (await fetch(dataUrl)).blob();
  const ext = (blob.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg');
  const yyyymmdd = new Date().toISOString().slice(0, 10);
  const path = `${yyyymmdd}/${saleId}.${ext}`;
  const { error } = await db.client.storage
    .from(SLIP_BUCKET)
    .upload(path, blob, { contentType: blob.type, upsert: true });
  if (error) throw error;
  const { data } = db.client.storage.from(SLIP_BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

async function sendSaleToLine(sale, slipUrl) {
  const branch = DATA.branches.find(b => b.code === sale.branch);
  const emp = DATA.employees.find(e => e.id === sale.empId);
  const text = `🧾 ยอดใหม่ — ${branch ? branch.name : sale.branch}
ประเภท: ${sale.type}
ช่องทาง: ${sale.channel || '-'}
สมาชิก: ${sale.memberName || '-'}
พนักงาน: ${emp ? emp.name + ' ' + emp.surname : sale.empId}
ยอด: ${DATA.settings.currency}${Number(sale.amount).toLocaleString()}${sale.note ? '\nหมายเหตุ: ' + sale.note : ''}
เวลา: ${new Date(sale.ts).toLocaleString('th-TH')}`;
  const res = await fetch(LINE_FUNCTION_URL, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text, slipUrl: slipUrl || undefined }),
  });
  const result = await res.json().catch(() => ({}));
  if (!res.ok || !result.ok) throw new Error(result.error || ('HTTP ' + res.status));
}

async function onSubmitSale(e) {
  e.preventDefault();
  const branch = document.getElementById('se-branch').value;
  const empId = document.getElementById('se-emp').value;
  const type = document.getElementById('se-type').value;
  const amount = Number(document.getElementById('se-amount').value);
  const channel = document.getElementById('se-channel').value;
  const memberName = document.getElementById('se-mname').value;
  const slip = document.getElementById('se-slip').value;
  const note = document.getElementById('se-note').value;

  if ((type === 'MEM' || type === 'PT') && !slip) {
    if (!confirm('ประเภท ' + type + ' ปกติต้องแนบสลิป\nบันทึกโดยไม่มีสลิปจริงหรือ?')) return;
  }

  const needsLine = (type === 'MEM' || type === 'PT');
  const sale = {
    id: nid(), ts: new Date().toISOString(),
    branch, empId, type, memberId: '', memberName, amount, channel, slip, note,
    notify: needsLine ? 'Pending' : '—',
  };
  DATA.sales.unshift(sale);
  saveData();
  toast('บันทึกยอดเรียบร้อย ' + thb(amount), 'ok');
  resetSaleForm();

  if (!needsLine) return;

  // Send LINE notification asynchronously
  try {
    let slipUrl = '';
    if (slip) {
      slipUrl = await uploadSlipToStorage(slip, sale.id);
      // Replace data URL with public URL in DATA + DB
      const idx = DATA.sales.findIndex(s => s.id === sale.id);
      if (idx >= 0) DATA.sales[idx].slip = slipUrl;
    }
    await sendSaleToLine(sale, slipUrl);
    const idx = DATA.sales.findIndex(s => s.id === sale.id);
    if (idx >= 0) DATA.sales[idx].notify = 'Sent';
    saveData();
    toast('ส่ง LINE Group แล้ว ✓', 'ok');
  } catch (err) {
    console.error('LINE notify failed', err);
    const idx = DATA.sales.findIndex(s => s.id === sale.id);
    if (idx >= 0) DATA.sales[idx].notify = 'Failed';
    saveData();
    toast('บันทึกแล้ว แต่ส่ง LINE ไม่สำเร็จ: ' + (err.message || err), 'bad');
  }
}

function onSubmitTrain(e) {
  e.preventDefault();
  const branch = document.getElementById('te-branch').value;
  const memberId = document.getElementById('te-member').value;
  const trainerId = document.getElementById('te-trainer').value;
  const pwd = document.getElementById('te-pwd').value;
  const note = document.getElementById('te-note').value;

  if (!memberId) { toast('กรุณาเลือกสมาชิกจากรายการ (พิมพ์แล้วเลือกตัวเลือกที่ขึ้น)', 'bad'); return; }
  const member = DATA.members.find(m => m.id === memberId);
  const trainer = DATA.employees.find(e => e.id === trainerId);
  const br = DATA.branches.find(b => b.code === branch);

  if (!member || !trainer || !br) {
    toast('ข้อมูลไม่ครบ', 'bad'); return;
  }
  if (member.hours <= 0) {
    toast('สมาชิกนี้ไม่เหลือชั่วโมงเทรน', 'bad'); return;
  }
  const verified = (pwd === br.managerPwd);
  if (!verified) {
    DATA.trainings.unshift({
      id: nid(), ts: new Date().toISOString(), branch, memberId,
      memberName: member.name + ' ' + member.surname,
      trainerId, trainerName: trainer.name,
      verified: false, hoursBefore: member.hours, hoursAfter: member.hours,
    });
    saveData();
    toast('รหัสเมเนเจอร์ไม่ถูกต้อง — ไม่หักชั่วโมง', 'bad');
    document.getElementById('te-pwd').value = '';
    return;
  }
  // Deduct
  const hoursBefore = member.hours;
  member.hours = Math.max(0, member.hours - 1);
  DATA.trainings.unshift({
    id: nid(), ts: new Date().toISOString(), branch, memberId,
    memberName: member.name + ' ' + member.surname,
    trainerId, trainerName: trainer.name,
    verified: true, hoursBefore, hoursAfter: member.hours, note,
  });
  // Add as a "Train" sale row for tracking
  DATA.sales.unshift({
    id: nid(), ts: new Date().toISOString(), branch, empId: trainerId,
    type: 'Train', memberId, memberName: member.name + ' ' + member.surname,
    amount: 0, slip: '', note: 'บันทึกเทรน', notify: '—',
  });
  // Alert if low hours
  if (member.hours <= DATA.settings.trainerWarnHrs) {
    DATA.alerts.unshift({
      id: nid(), ts: new Date().toISOString(),
      type: 'Trainer Hours Low', branch,
      memberId: member.id, memberName: member.name + ' ' + member.surname,
      value: member.hours + ' ครั้ง',
      message: 'เหลือชั่วโมงเทรน ' + member.hours + ' ครั้ง',
      status: member.lineUid ? 'Sent' : 'No LINE',
    });
  }
  saveData();
  toast('หักชั่วโมงสำเร็จ — เหลือ ' + member.hours + ' ครั้ง', 'ok');
  navigate('trainings');
}

  `;
  root.appendChild(tb);

  // preserve search/filter values across re-renders
  const prevSearch = document.getElementById('m-search') ? document.getElementById('m-search').value : '';
  const prevStatus = document.getElementById('m-status') ? document.getElementById('m-status').value : '';
  // (the toolbar HTML re-rendered, so values reset; restore manually)
  setTimeout(() => {
    const s = document.getElementById('m-search'); if (s && prevSearch) s.value = prevSearch;
    const st = document.getElementById('m-status'); if (st && prevStatus) st.value = prevStatus;
  }, 0);

  const search = (window.event && window.event.target && window.event.target.id === 'm-search') ? window.event.target.value : '';
  const statusFilter = (window.event && window.event.target && window.event.target.id === 'm-status') ? window.event.target.value : '';

  const card = document.createElement('div');
  card.className = 'card';
  const ref = todayStart();
  let list = filterByBranch(DATA.members);
  if (search) {
    const q = search.toLowerCase();
    list = list.filter(m => (m.name + ' ' + m.surname + ' ' + m.id).toLowerCase().includes(q));
  }
  if (statusFilter) list = list.filter(m => m.status === statusFilter);
  list.sort((a, b) => daysBetween(a.endDate, ref) - daysBetween(b.endDate, ref));

  let rows = '';
  list.forEach(m => {
    const days = daysBetween(m.endDate, ref);
    const dayCls = days < 0 ? 'days-low' : (days <= DATA.settings.expiryWarnDays ? 'days-warn' : '');
    const hrCls = m.hours > 0 && m.hours <= DATA.settings.trainerWarnHrs ? 'hrs-low' : '';
    rows += `<tr>
      <td>${m.id}</td>
      <td><strong>${m.name} ${m.surname}</strong></td>
      <td class="center">${m.age}</td>
      <td class="center">${m.branch}</td>
      <td class="center">${fmtDate(m.endDate)}</td>
      <td class="center ${dayCls}">${days < 0 ? 'หมดแล้ว ' + (-days) + ' วัน' : days + ' วัน'}</td>
      <td class="center ${hrCls}">${m.hours}</td>
      <td>${m.trainer || '<span class="muted">—</span>'}</td>
      <td class="center">${statusBadge(m.status)}</td>
      ${editable ? `<td class="row-actions">
        <button class="btn small secondary" onclick="openMemberModal('${m.id}')">แก้</button>
      </td>` : ''}
    </tr>`;
  });
  if (rows === '') rows = `<tr><td colspan="${editable?10:9}" class="muted center" style="padding: 20px;">ไม่พบข้อมูลสมาชิก</td></tr>`;

  card.innerHTML = `
    <table>
      <thead><tr>
        <th>ID</th><th>ชื่อ-นามสกุล</th><th class="center">อายุ</th>
        <th class="center">สาขา</th><th class="center">วันหมดอายุ</th><th class="center">วันคงเหลือ</th>
        <th class="center">ชม.เทรน</th><th>เทรนเนอร์</th><th class="center">สถานะ</th>
        ${editable ? '<th></th>' : ''}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
  root.appendChild(card);
}

function statusBadge(s) {
  if (s === 'Active')   return '<span class="badge ok">Active</span>';
  if (s === 'Frozen')   return '<span class="badge info">Frozen</span>';
  if (s === 'Expired')  return '<span class="badge bad">Expired</span>';
  if (s === 'Cancelled')return '<span class="badge gray">Cancelled</span>';

}

function saveMember(e, idOrNull) {
  e.preventDefault();
  const isNew = !idOrNull;
  const obj = {
    id: document.getElementById('mm-id').value,
    branch: document.getElementById('mm-branch').value,
    name: document.getElementById('mm-name').value,
    surname: document.getElementById('mm-surname').value,
    age: Number(document.getElementById('mm-age').value || 0),
    startDate: new Date(document.getElementById('mm-start').value).toISOString(),
    endDate: new Date(document.getElementById('mm-end').value).toISOString(),
    hours: Number(document.getElementById('mm-hours').value || 0),
    trainer: document.getElementById('mm-trainer').value,
    lineUid: document.getElementById('mm-line').value,
    status: document.getElementById('mm-status').value,
  };
  if (isNew) {
    if (DATA.members.some(m => m.id === obj.id)) {
      toast('Member ID ซ้ำ', 'bad'); return;
    }
    DATA.members.push(obj);
  } else {
    const idx = DATA.members.findIndex(m => m.id === idOrNull);
    DATA.members[idx] = { ...DATA.members[idx], ...obj };
  }
  saveData();
  closeModal();
  toast('บันทึกสมาชิกเรียบร้อย', 'ok');
  navigate('members');
}

function deleteMember(id) {
  if (!confirm('ลบสมาชิก ' + id + ' ?')) return;
  DATA.members = DATA.members.filter(m => m.id !== id);
  db.del('members', id);
  saveData();
  closeModal();
  toast('ลบสมาชิกเรียบร้อย', 'ok');
  navigate('members');
}

    id: document.getElementById('ee-id').value,
    branch: document.getElementById('ee-branch').value,
    name: document.getElementById('ee-name').value,
    surname: document.getElementById('ee-surname').value,
    position: document.getElementById('ee-position').value,
    status: document.getElementById('ee-status').value,
    photo: document.getElementById('ee-photo').value || '',
  };
  if (!idOrNull) {
    if (DATA.employees.some(x => x.id === obj.id)) { toast('EmpID ซ้ำ', 'bad'); return; }
    DATA.employees.push(obj);
  } else {
    const idx = DATA.employees.findIndex(x => x.id === idOrNull);
    DATA.employees[idx] = { ...DATA.employees[idx], ...obj };
  }
  saveData(); closeModal(); toast('บันทึกเรียบร้อย', 'ok'); navigate('employees');
}
function deleteEmployee(id) {
  if (!isManagerOrAbove()) { toast('เฉพาะ Admin/Manager เท่านั้นที่ลบพนักงานได้', 'bad'); return; }
  if (!confirm('ลบพนักงาน ' + id + ' ?')) return;
  DATA.employees = DATA.employees.filter(e => e.id !== id);
  db.del('employees', id);
  saveData(); closeModal(); toast('ลบเรียบร้อย', 'ok'); navigate('employees');
}

function handleEmpPhoto(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { toast('กรุณาเลือกไฟล์รูปภาพ', 'bad'); return; }
  if (file.size > 5 * 1024 * 1024) { toast('ไฟล์ใหญ่เกิน 5MB', 'bad'); return; }
  const reader = new FileReader();
  reader.onload = ev2 => {
    const img = new Image();
    img.onload = () => {
      const max = 256;
      const ratio = Math.min(max / img.width, max / img.height, 1);
      const w = Math.round(img.width * ratio);
      const h = Math.round(img.height * ratio);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      const photoEl = document.getElementById('ee-photo');
      const previewEl = document.getElementById('ee-photo-preview');
      if (photoEl) photoEl.value = dataUrl;
      if (previewEl) previewEl.innerHTML = `<img src="${dataUrl}">`;
    };
    img.onerror = () => toast('ไม่สามารถอ่านไฟล์รูปได้', 'bad');
    img.src = ev2.target.result;
  };
  reader.readAsDataURL(file);
}

function clearEmpPhoto() {
  const photoEl = document.getElementById('ee-photo');
  const previewEl = document.getElementById('ee-photo-preview');
  const fileEl = document.getElementById('ee-photo-file');
  if (photoEl) photoEl.value = '';
  if (previewEl) previewEl.innerHTML = '👤';
  if (fileEl) fileEl.value = '';
}

// ============ REPORTS ============
function renderReports(root) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>รายงาน 30 วันล่าสุด</h2><div class="chart-wrap" style="height:280px;"><canvas id="repRev"></canvas></div>`;
  root.appendChild(card);

  const breakdown = document.createElement('div');
  breakdown.className = 'two-col';
  breakdown.innerHTML = `
    <div class="card"><h2>สัดส่วนยอดตามประเภท</h2><div class="chart-wrap" style="height:240px;"><canvas id="repType"></canvas></div></div>
    <div class="card"><h2>สัดส่วนยอดตามสาขา</h2><div class="chart-wrap" style="height:240px;"><canvas id="repBranch"></canvas></div></div>
  `;
  root.appendChild(breakdown);

  const ref = todayStart();
  const days = [], totals = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(ref); d.setDate(d.getDate() - i);
    days.push(d.toLocaleDateString('th-TH', { day:'2-digit', month:'short' }));
    const sum = DATA.sales.filter(s => isSameDay(s.ts, d) && (CURRENT_BRANCH === '*' || s.branch === CURRENT_BRANCH))
                          .filter(s => s.type !== 'Train')
                          .reduce((a,b) => a + b.amount, 0);
    totals.push(sum);
  }
  CHARTS.rep1 = new Chart(document.getElementById('repRev'), {
    type: 'bar',
    data: { labels: days, datasets: [{ label: 'ยอด', data: totals, backgroundColor: '#FF5C00' }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#6B7280', font: { size: 9 } }, grid: { display: false } },
        y: { ticks: { color: '#6B7280', font: { size: 10 }, callback: v => '฿' + (v/1000).toFixed(0) + 'K' }, grid: { color: '#E5E7EB' } }
      }
    }
  });

  const startWindow = new Date(ref); startWindow.setDate(startWindow.getDate() - 29);
  const ws = DATA.sales.filter(s => new Date(s.ts) >= startWindow && (CURRENT_BRANCH === '*' || s.branch === CURRENT_BRANCH));
  const byType = { MEM: 0, PT: 0, Plan: 0, Other: 0 };
  ws.forEach(s => { if (s.type === 'MEM' || s.type === 'PT' || s.type === 'Plan') byType[s.type] += s.amount; else if (s.type !== 'Train') byType.Other += s.amount; });
  CHARTS.rep2 = new Chart(document.getElementById('repType'), {
    type: 'doughnut',
    data: { labels: Object.keys(byType), datasets: [{ data: Object.values(byType), backgroundColor: ['#534AB7','#185FA5','#888780','#BA7517'] }] },
    options: { responsive: true, maintainAspectRatio: false, cutout: '60%', plugins: { legend: { position: 'right', labels: { font: { size: 11 } } } } }
  });

  const byBr = {};
  DATA.branches.forEach(b => byBr[b.code] = 0);
  ws.filter(s => s.type !== 'Train').forEach(s => { byBr[s.branch] = (byBr[s.branch] || 0) + s.amount; });
  CHARTS.rep3 = new Chart(document.getElementById('repBranch'), {
    type: 'doughnut',
    data: { labels: Object.keys(byBr), datasets: [{ data: Object.values(byBr), backgroundColor: ['#185FA5','#1D9E75','#BA7517','#791F1F'] }] },
    options: { responsive: true, maintainAspectRatio: false, cutout: '60%', plugins: { legend: { position: 'right', labels: { font: { size: 11 } } } } }
  });
}

function saveSettings() { saveData(); toast('บันทึกเรียบร้อย', 'ok'); navigate('settings'); }
function addBranch() {
  const code = prompt('รหัสสาขาใหม่ (เช่น BR04):');
  if (!code) return;
  if (DATA.branches.some(b => b.code === code)) { toast('รหัสซ้ำ', 'bad'); return; }
  DATA.branches.push({ code, name: 'FITSTATION 24 - ' + code, lineToken: '', lineGroupId: '', managerPwd: 'changeme' });
  saveData(); navigate('settings');
}
function deleteBranch(idx) {
  const code = DATA.branches[idx].code;
  if (!confirm('ลบสาขา ' + code + ' ?')) return;
  DATA.branches.splice(idx, 1);
  db.del('branches', code);
  saveData(); navigate('settings');
}
function addUser() {
  const email = prompt('Username ผู้ใช้ใหม่:');
  if (!email) return;
  if (DATA.users.some(u => u.email.toLowerCase() === email.toLowerCase())) { toast('Username นี้มีอยู่แล้ว', 'bad'); return; }
  const name = prompt('ชื่อ-นามสกุล:'); if (!name) return;
  const role = prompt('Role (Owner/Manager/Staff/Trainer):', 'Staff');
  if (!['Owner','Manager','Staff','Trainer'].includes(role)) { toast('Role ไม่ถูก', 'bad'); return; }
  const branchInput = prompt('สาขา (รหัสสาขา หรือ * สำหรับทุกสาขา):', 'BR01');
  const pwd = prompt('รหัสผ่านเริ่มต้น:', 'changeme');
  DATA.users.push({ email, pwd, name, role, branch: branchInput || 'BR01' });
  saveData(); toast('เพิ่มผู้ใช้เรียบร้อย', 'ok'); navigate('settings');
}
function changePassword(idx) {
  const newPwd = prompt('รหัสผ่านใหม่ของ ' + DATA.users[idx].email + ':');
  if (!newPwd) return;
  DATA.users[idx].pwd = newPwd; saveData(); toast('รีเซ็ตรหัสเรียบร้อย', 'ok');
}
function deleteUser(idx) {
  const email = DATA.users[idx].email;
  if (!confirm('ลบผู้ใช้ ' + email + ' ?')) return;
  DATA.users.splice(idx, 1);
  db.del('users', email);
  saveData(); navigate('settings');
}

// ============ EXPORT/IMPORT ============
function exportJSON() {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'fitstation24-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Export สำเร็จ', 'ok');
}
function importJSON(e) {
  const file = e.target.files[0]; if (!file) return;
  if (!confirm('Import จะแทนที่ข้อมูลทั้งหมด ดำเนินการต่อ?')) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      DATA = JSON.parse(r.result);
      saveData(); toast('Import สำเร็จ', 'ok'); navigate('settings');
    } catch (err) { toast('ไฟล์ไม่ถูกต้อง', 'bad'); }
  };
  r.readAsText(file);
}
function resetAll() {
  if (!confirm('รีเซ็ตข้อมูลทั้งหมดกลับเป็นค่าตั้งต้น? (ลบทุกอย่าง)')) return;
  DATA = defaultData(); saveData(); toast('รีเซ็ตเรียบร้อย', 'ok'); navigate('dashboard');
}
function exportCSV(kind) {
  let rows = [];
  if (kind === 'sales') {
    rows.push(['Time','Branch','EmpID','Type','Channel','MemberID','MemberName','Amount','Slip','Note','Notify']);
    filterByBranch(DATA.sales).forEach(s => {
      rows.push([s.ts, s.branch, s.empId, s.type, s.channel || '', s.memberId, s.memberName, s.amount, s.slip, s.note, s.notify]);
    });
  }
  const csv = rows.map(r => r.map(v => '"' + String(v||'').replace(/"/g,'""') + '"').join(',')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = kind + '-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click(); URL.revokeObjectURL(url);
}

// ============ MODAL ============
function showModal(html) {
  const host = document.getElementById('modal-host');
  host.innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal() {
  document.getElementById('modal-host').innerHTML = '';
}

// ============ INIT ============
(async () => {
  db.init();
  await loadData();
  SESSION = loadSession();
  if (SESSION) bootApp();

  // Real-time sync: when other devices change data, reload + re-render
  let isReloading = false;
  db.subscribe(async () => {
    if (isReloading) return;
    if (document.getElementById('modal-host').innerHTML.trim()) return; // skip if modal open
    if (!SESSION) return;
    isReloading = true;
    try {
      const remote = await db.loadAll();
      if (remote) {
        const seed = defaultData();
        DATA = {
          settings:     remote.settings  || seed.settings,
          branches:     remote.branches.length ? remote.branches : DATA.branches,
          users:        remote.users.length    ? remote.users    : DATA.users,
          employees:    remote.employees,
          members:      remote.members,
          sales:        remote.sales,
          trainings:    remote.trainings,
          alerts:       remote.alerts,
          loginLog:     remote.loginLog,
          lastDailyRun: remote.lastDailyRun,
        };
        localStorage.setItem(LS_KEY, JSON.stringify(DATA));
        if (CURRENT_VIEW) navigate(CURRENT_VIEW);
      }
    } finally { isReloading = false; }
  });
})();

// Allow Enter key to submit login
document.getElementById('login-pwd').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
