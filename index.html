// ============ ALERTS ============
function renderAlerts(root) {
  const card = document.createElement('div');
  card.className = 'card';
  const list = DATA.alerts.filter(a => CURRENT_BRANCH === '*' || a.branch === CURRENT_BRANCH);
  const ownerCanDelete = isOwner();
  let rows = '';
  list.forEach(a => {
    const tBadge = a.type === 'Member Expiring'
      ? '<span class="badge warn">หมดอายุ</span>'
      : '<span class="badge info">ชม. ใกล้หมด</span>';
    const sBadge = a.status === 'Sent' ? '<span class="badge ok">Sent</span>'
                 : a.status === 'No LINE' ? '<span class="badge gray">No LINE</span>'
                 : '<span class="badge bad">Failed</span>';
    const actions = ownerCanDelete ? `<td class="center"><button class="btn small danger" onclick="deleteAlert('${a.id}')">ลบ</button></td>` : '';
    rows += `<tr>
      <td>${fmtTime(a.ts)}</td>
      <td>${tBadge}</td>
      <td>${_h(a.branch)}</td>
      <td><strong>${_h(a.memberName)}</strong></td>
      <td>${_h(a.value)}</td>
      <td>${_h(a.message)}</td>
      <td class="center">${sBadge}</td>
      ${actions}
    </tr>`;
  });
  const colspan = ownerCanDelete ? 8 : 7;
  if (rows === '') rows = `<tr><td colspan="${colspan}" class="muted center" style="padding: 20px;">ไม่มีการแจ้งเตือน</td></tr>`;
  const clearBtn = ownerCanDelete && list.length > 0
    ? `<div style="margin-top: 12px;"><button class="btn small danger" onclick="clearAlerts()">ล้างทั้งหมดของสาขานี้</button></div>` : '';
  card.innerHTML = `
    <h2>การแจ้งเตือน <small>${list.length} รายการ</small></h2>
    <table>
      <thead><tr><th>เวลา</th><th>ประเภท</th><th>สาขา</th><th>สมาชิก</th><th>ค่าที่เหลือ</th><th>ข้อความ</th><th class="center">สถานะ</th>${ownerCanDelete ? '<th class="center">จัดการ</th>' : ''}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${clearBtn}
  `;
  root.appendChild(card);
}

// ============ EMPLOYEES ============
function renderEmployees(root) {
  const canEdit = isManagerOrAbove();
  const tb = document.createElement('div');
  tb.className = 'toolbar';
  tb.innerHTML = canEdit
    ? `<div class="muted">สิทธิ์: ${SESSION.role} · เพิ่ม/แก้/ลบ ได้</div><button class="btn" onclick="openEmployeeModal()">+ เพิ่มพนักงาน</button>`
    : `<div class="muted">โหมดดูอย่างเดียว · เฉพาะ Admin/Manager เท่านั้นที่เพิ่ม/ลบพนักงานได้</div><div></div>`;
  root.appendChild(tb);

  const list = filterByBranch(DATA.employees);
  if (list.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'card';
    empty.innerHTML = '<div class="muted center" style="padding: 30px;">ไม่พบพนักงาน</div>';
    root.appendChild(empty);
    return;
  }

  const trainers = list.filter(e => normalizePosition(e.position) === 'Trainer');
  const sales    = list.filter(e => normalizePosition(e.position) === 'Sale');

  const renderEmpCard = (e) => {
    const initial = (e.name || '?').charAt(0);
    const avatar = e.photo
      ? `<img class="emp-avatar" src="${e.photo}" alt="">`
      : `<div class="emp-avatar">${initial}</div>`;
    const salesAmount = DATA.sales
      .filter(s => s.empId === e.id && (s.type === 'MEM' || s.type === 'PT'))
      .reduce((sum, s) => sum + (Number(s.amount) || 0), 0);
    const isTrainer = normalizePosition(e.position) === 'Trainer';
    const trainCount = isTrainer
      ? DATA.trainings.filter(t => t.trainerId === e.id && t.verified).length
      : 0;
    const stats = `
      <div class="estats">
        <div class="estat">
          <div class="estat-label">ยอดขาย</div>
          <div class="estat-value">${thb(salesAmount)}</div>
        </div>
        ${isTrainer ? `
        <div class="estat">
          <div class="estat-label">เทรนสะสม</div>
          <div class="estat-value">${trainCount} ครั้ง</div>
        </div>` : ''}
      </div>`;
    const actions = canEdit ? `
      <div class="eactions">
        <button class="btn small secondary" onclick="openEmployeeModal('${e.id}')">แก้</button>
        <button class="btn small danger" onclick="deleteEmployee('${e.id}')">ลบ</button>
      </div>` : '';
    return `
      <div class="emp-card">
        ${avatar}
        <div class="ename">${_h(e.name)} ${_h(e.surname)}</div>
        <div class="epos">${_h(e.position)}</div>
        <div class="eid">${_h(e.id)}</div>
        <div class="emeta">${_h(e.branch)} · ${statusBadge(e.status)}</div>
        ${stats}
        ${actions}
      </div>`;
  };

  const renderSection = (title, items) => {
    const section = document.createElement('div');
    section.className = 'card';
    if (items.length === 0) {
      section.innerHTML = `<h2>${title} <small>0 คน</small></h2><div class="muted center" style="padding: 16px;">ไม่มีพนักงานในหมวดนี้</div>`;
    } else {
      const cards = items.map(renderEmpCard).join('');
      section.innerHTML = `<h2>${title} <small>${items.length} คน</small></h2><div class="emp-grid">${cards}</div>`;
    }
    root.appendChild(section);
  };

  renderSection('Sale', sales);
  renderSection('Trainer', trainers);
}

function openEmployeeModal(id) {
  if (!isManagerOrAbove()) { toast('เฉพาะ Admin/Manager เท่านั้นที่เพิ่ม/แก้/ลบพนักงานได้', 'bad'); return; }
  const e = id ? DATA.employees.find(x => x.id === id) : null;
  const isNew = !e;
  const branches = DATA.branches.map(b => `<option value="${_h(b.code)}" ${e && e.branch===b.code?'selected':''}>${_h(b.code)}</option>`).join('');
  const positions = ['Sale','Trainer']
    .map(p => `<option value="${p}" ${e && normalizePosition(e.position)===p?'selected':''}>${p}</option>`).join('');
  const newId = isNew ? 'E' + String(100 + DATA.employees.length + 1) : e.id;
  const photoSrc = e && e.photo ? e.photo : '';
  const initial = e && e.name ? _h(e.name.charAt(0)) : '👤';
  showModal(`
    <h3>${isNew ? 'เพิ่มพนักงานใหม่' : 'แก้ไขพนักงาน ' + _h(e.id)}</h3>
    <form onsubmit="saveEmployee(event, ${isNew ? 'null' : "'" + _h(e.id) + "'"})">
      <div class="form-grid">
        <div class="field full">
          <label>รูปพนักงาน</label>
          <div class="photo-upload">
            <div class="preview" id="ee-photo-preview">${photoSrc ? `<img src="${_h(photoSrc)}">` : initial}</div>
            <div class="controls">
              <input type="file" id="ee-photo-file" accept="image/*" onchange="handleEmpPhoto(event)">
              <button type="button" class="btn small secondary" onclick="clearEmpPhoto()">ลบรูป</button>
            </div>
          </div>
          <input type="hidden" id="ee-photo" value="${_h(photoSrc)}">
        </div>
        <div class="field"><label>EmpID</label><input id="ee-id" value="${_h(newId)}" ${isNew?'':'readonly'}></div>
        <div class="field"><label>สาขา *</label><select id="ee-branch" required>${branches}</select></div>
        <div class="field"><label>ชื่อ *</label><input id="ee-name" required value="${e ? _h(e.name) : ''}"></div>
        <div class="field"><label>นามสกุล *</label><input id="ee-surname" required value="${e ? _h(e.surname) : ''}"></div>
        <div class="field"><label>ตำแหน่ง *</label><select id="ee-position">${positions}</select></div>
        <div class="field"><label>สถานะ</label>
          <select id="ee-status">
            <option value="Active" ${e && e.status==='Active'?'selected':''}>Active</option>
            <option value="Inactive" ${e && e.status==='Inactive'?'selected':''}>Inactive</option>
          </select>
        </div>
      </div>
      <div class="actions">
        ${!isNew ? `<button type="button" class="btn danger" onclick="deleteEmployee('${e.id}')">ลบ</button>` : ''}
        <button type="button" class="btn secondary" onclick="closeModal()">ยกเลิก</button>
        <button type="submit" class="btn">บันทึก</button>
      </div>
    </form>
  `);
}

function saveEmployee(ev, idOrNull) {
  ev.preventDefault();
  if (!isManagerOrAbove()) { toast('เฉพาะ Admin/Manager เท่านั้นที่เพิ่ม/แก้พนักงานได้', 'bad'); return; }
  const obj = {
    id: document.getElementById('ee-id').value,
    branch: document.getElementById('ee-branch').value,
    name: document.getElementById('ee-name').value,
    surname: document.getElementById('ee-surname').value,
    position: document.getElementById('ee-position').value,
    status: document.getElementById('ee-status').value,
    photo: document.getElementById('ee-photo').value || '',
  };
  if (!idOrNull) {
    if (DATA.employees.some(x => x.id === obj.id)) { toast('EmpID ซ้ำ', 'bad'); return; }
    DATA.employees.push(obj);
  } else {
    const idx = DATA.employees.findIndex(x => x.id === idOrNull);
    DATA.employees[idx] = { ...DATA.employees[idx], ...obj };
  }
  saveData(); closeModal(); toast('บันทึกเรียบร้อย', 'ok'); navigate('employees');
}
function deleteEmployee(id) {
  if (!isManagerOrAbove()) { toast('เฉพาะ Admin/Manager เท่านั้นที่ลบพนักงานได้', 'bad'); return; }
  if (!confirm('ลบพนักงาน ' + id + ' ?')) return;
  DATA.employees = DATA.employees.filter(e => e.id !== id);
  db.del('employees', id);
  saveData(); closeModal(); toast('ลบเรียบร้อย', 'ok'); navigate('employees');
}

function deleteSale(id) {
  if (!isOwner()) { toast('เฉพาะ Owner เท่านั้นที่ลบยอดขายได้', 'bad'); return; }

function deleteTraining(id) {

  if (!confirm('ลบรายการเทรนนี้?\nหมายเหตุ: ชั่วโมงสมาชิกจะไม่ถูกคืนอัตโนมัติ')) return;

function deleteAlert(id) {
  if (!isOwner()) { toast('เฉพาะ Owner เท่านั้นที่ลบการแจ้งเตือนได้', 'bad'); return; }
  DATA.alerts = DATA.alerts.filter(a => a.id !== id);
  db.del('alerts', id);
  saveData(); navigate('alerts');
}

function clearAlerts() {
  if (!isOwner()) { toast('เฉพาะ Owner เท่านั้นที่ลบการแจ้งเตือนได้', 'bad'); return; }
  const inScope = DATA.alerts.filter(a => CURRENT_BRANCH === '*' || a.branch === CURRENT_BRANCH);
  if (inScope.length === 0) return;
  if (!confirm('ล้างการแจ้งเตือนทั้งหมด ' + inScope.length + ' รายการ?')) return;
  inScope.forEach(a => db.del('alerts', a.id));
  DATA.alerts = DATA.alerts.filter(a => !(CURRENT_BRANCH === '*' || a.branch === CURRENT_BRANCH));
  saveData(); toast('ล้างเรียบร้อย', 'ok'); navigate('alerts');
}

function handleEmpPhoto(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { toast('กรุณาเลือกไฟล์รูปภาพ', 'bad'); return; }
  if (file.size > 5 * 1024 * 1024) { toast('ไฟล์ใหญ่เกิน 5MB', 'bad'); return; }
  const reader = new FileReader();
  reader.onload = ev2 => {
    const img = new Image();
    img.onload = () => {
      const max = 256;
      const ratio = Math.min(max / img.width, max / img.height, 1);
      const w = Math.round(img.width * ratio);
      const h = Math.round(img.height * ratio);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      const photoEl = document.getElementById('ee-photo');
      const previewEl = document.getElementById('ee-photo-preview');
      if (photoEl) photoEl.value = dataUrl;
      if (previewEl) previewEl.innerHTML = `<img src="${dataUrl}">`;
    };
    img.onerror = () => toast('ไม่สามารถอ่านไฟล์รูปได้', 'bad');
    img.src = ev2.target.result;
  };
  reader.readAsDataURL(file);
}

function clearEmpPhoto() {
  const photoEl = document.getElementById('ee-photo');
  const previewEl = document.getElementById('ee-photo-preview');
  const fileEl = document.getElementById('ee-photo-file');
  if (photoEl) photoEl.value = '';
  if (previewEl) previewEl.innerHTML = '👤';
  if (fileEl) fileEl.value = '';
}

// ============ REPORTS ============
function renderReports(root) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>รายงาน 30 วันล่าสุด</h2><div class="chart-wrap" style="height:280px;"><canvas id="repRev"></canvas></div>`;
  root.appendChild(card);

  const breakdown = document.createElement('div');
  breakdown.className = 'two-col';
  breakdown.innerHTML = `
    <div class="card"><h2>สัดส่วนยอดตามประเภท</h2><div class="chart-wrap" style="height:240px;"><canvas id="repType"></canvas></div></div>
    <div class="card"><h2>สัดส่วนยอดตามสาขา</h2><div class="chart-wrap" style="height:240px;"><canvas id="repBranch"></canvas></div></div>
  `;
  root.appendChild(breakdown);

  const ref = todayStart();
  const days = [], totals = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(ref); d.setDate(d.getDate() - i);
    days.push(d.toLocaleDateString('th-TH', { day:'2-digit', month:'short' }));
    const sum = DATA.sales.filter(s => isSameDay(s.ts, d) && (CURRENT_BRANCH === '*' || s.branch === CURRENT_BRANCH))
                          .filter(s => s.type !== 'Train')
                          .reduce((a,b) => a + b.amount, 0);
    totals.push(sum);
  }
  CHARTS.rep1 = new Chart(document.getElementById('repRev'), {
    type: 'bar',
    data: { labels: days, datasets: [{ label: 'ยอด', data: totals, backgroundColor: '#FF5C00' }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#6B7280', font: { size: 9 } }, grid: { display: false } },
        y: { ticks: { color: '#6B7280', font: { size: 10 }, callback: v => '฿' + (v/1000).toFixed(0) + 'K' }, grid: { color: '#E5E7EB' } }
      }
    }
  });

  const startWindow = new Date(ref); startWindow.setDate(startWindow.getDate() - 29);
  const ws = DATA.sales.filter(s => new Date(s.ts) >= startWindow && (CURRENT_BRANCH === '*' || s.branch === CURRENT_BRANCH));
  const byType = { MEM: 0, PT: 0, Plan: 0, Other: 0 };
  ws.forEach(s => { if (s.type === 'MEM' || s.type === 'PT' || s.type === 'Plan') byType[s.type] += s.amount; else if (s.type !== 'Train') byType.Other += s.amount; });
  CHARTS.rep2 = new Chart(document.getElementById('repType'), {
    type: 'doughnut',
    data: { labels: Object.keys(byType), datasets: [{ data: Object.values(byType), backgroundColor: ['#534AB7','#185FA5','#888780','#BA7517'] }] },
    options: { responsive: true, maintainAspectRatio: false, cutout: '60%', plugins: { legend: { position: 'right', labels: { font: { size: 11 } } } } }
  });

  const byBr = {};
  DATA.branches.forEach(b => byBr[b.code] = 0);
  ws.filter(s => s.type !== 'Train').forEach(s => { byBr[s.branch] = (byBr[s.branch] || 0) + s.amount; });
  CHARTS.rep3 = new Chart(document.getElementById('repBranch'), {
    type: 'doughnut',
    data: { labels: Object.keys(byBr), datasets: [{ data: Object.values(byBr), backgroundColor: ['#185FA5','#1D9E75','#BA7517','#791F1F'] }] },
    options: { responsive: true, maintainAspectRatio: false, cutout: '60%', plugins: { legend: { position: 'right', labels: { font: { size: 11 } } } } }
  });
}

  card4.className = 'card';

    <div style="margin-bottom: 16px;">

function rebuildNav() {
  const nav = document.getElementById('nav');
  if (!nav) return;
  nav.innerHTML = '';
  NAV_ITEMS.forEach(i => {
    if (!canAccessView(SESSION.role, i.id)) return;
    const b = document.createElement('button');
    b.textContent = i.label;
    b.dataset.id = i.id;
    b.classList.toggle('active', i.id === CURRENT_VIEW);
    b.onclick = () => navigate(i.id);
    nav.appendChild(b);
  });
}

function toggleRolePerm(role, viewId, on) {
  if (!DELEGABLE_ROLES.includes(role)) return;
  if (viewId === 'settings') return;
  if (!DATA.settings.rolePermissions) DATA.settings.rolePermissions = defaultRolePermissions();
  const cur = DATA.settings.rolePermissions[role] || [];
  const set = new Set(cur);
  if (on) set.add(viewId); else set.delete(viewId);
  DATA.settings.rolePermissions[role] = Array.from(set);
  saveData();
  rebuildNav();
}

function resetRolePermissions() {
  if (!confirm('รีเซ็ตสิทธิ์การเข้าถึงเมนูทุก role เป็นค่าเริ่มต้น?')) return;
  DATA.settings.rolePermissions = defaultRolePermissions();
  saveData();
  rebuildNav();
  navigate('settings');
}
function addBranch() {
  const code = prompt('รหัสสาขาใหม่ (เช่น BR04):');

  if (DATA.branches.some(b => b.code === code)) { toast('รหัสซ้ำ', 'bad'); return; }
  DATA.branches.push({ code, name: 'FITSTATION 24 - ' + code, lineToken: '', lineGroupId: '', managerPwd: 'changeme' });
  saveData(); navigate('settings');
}
function deleteBranch(idx) {
  const code = DATA.branches[idx].code;
  if (!confirm('ลบสาขา ' + code + ' ?')) return;
  DATA.branches.splice(idx, 1);
  db.del('branches', code);

function saveUserFromModal(e) {
  e.preventDefault();
  const email = document.getElementById('ue-email').value.trim();
  const name = document.getElementById('ue-name').value.trim();
  const role = document.getElementById('ue-role').value;
  const branch = document.getElementById('ue-branch').value;
  const pwd = document.getElementById('ue-pwd').value;

  if (DATA.users.some(u => u.email.toLowerCase() === email.toLowerCase())) { toast('Username นี้มีอยู่แล้ว', 'bad'); return; }
  DATA.users.push({ email, pwd, name, role, branch });
  saveData(); closeModal(); toast('เพิ่มผู้ใช้เรียบร้อย', 'ok'); navigate('settings');
}
function changePassword(idx) {

  if (!newPwd) return;

function deleteUser(idx) {
  const email = DATA.users[idx].email;

  if (!confirm('Import จะแทนที่ข้อมูลทั้งหมด ดำเนินการต่อ?')) return;

  r.onload = () => {

      DATA = JSON.parse(r.result);
      saveData(); toast('Import สำเร็จ', 'ok'); navigate('settings');
    } catch (err) { toast('ไฟล์ไม่ถูกต้อง', 'bad'); }
  };

}

// ============ AUTO BACKUP ============
const BACKUP_KEEP_DAYS = 7;

async function createDailyBackup(force) {
  if (!db.enabled) return;
  const today = new Date().toISOString().slice(0, 10);
  const key = 'backup_' + today;
  if (!force) {
    if (DATA.settings.lastBackupDate === today) return;
  }
  try {
    const { error } = await db.client.from('app_settings').upsert({ key, value: DATA }, { onConflict: 'key' });
    if (error) throw error;
    DATA.settings.lastBackupDate = today;
    await cleanupOldBackups();
  } catch (e) {
    console.error('[backup] create failed', e);
  }
}

async function listBackups() {
  if (!db.enabled) return [];
  const { data, error } = await db.client.from('app_settings').select('key').like('key', 'backup_%').order('key', { ascending: false });
  if (error) { console.error('[backup] list failed', error); return []; }
  return (data || []).map(r => r.key.replace('backup_', ''));
}

async function cleanupOldBackups() {
  if (!db.enabled) return;
  const { data, error } = await db.client.from('app_settings').select('key').like('key', 'backup_%').order('key', { ascending: false });
  if (error || !data || data.length <= BACKUP_KEEP_DAYS) return;
  const toDelete = data.slice(BACKUP_KEEP_DAYS).map(r => r.key);
  for (const k of toDelete) {
    await db.client.from('app_settings').delete().eq('key', k);
  }
}

async function restoreBackup(date) {
  if (!isOwner()) { toast('เฉพาะ Owner เท่านั้น', 'bad'); return; }
  if (!confirm('Restore ข้อมูลทั้งหมดเป็นของวันที่ ' + date + '?\n⚠️ ข้อมูลปัจจุบันจะถูกแทนที่ทันที กดอีกครั้งเพื่อยืนยัน')) return;
  if (!confirm('ยืนยันอีกครั้ง — Restore ข้อมูลของวันที่ ' + date + '?')) return;
  try {
    const { data, error } = await db.client.from('app_settings').select('value').eq('key', 'backup_' + date).single();
    if (error || !data) throw error || new Error('not found');
    DATA = data.value;
    if (!DATA.settings.lastBackupDate) DATA.settings.lastBackupDate = date;
    saveData();
    toast('Restore สำเร็จ — กำลัง refresh...', 'ok');
    setTimeout(() => location.reload(), 1500);
  } catch (e) {
    console.error('[backup] restore failed', e);
    toast('Restore ล้มเหลว: ' + (e.message || e), 'bad');
  }
}

async function downloadBackup(date) {
  if (!db.enabled) return;
  try {
    const { data, error } = await db.client.from('app_settings').select('value').eq('key', 'backup_' + date).single();
    if (error || !data) throw error;
    const blob = new Blob([JSON.stringify(data.value, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'fitstation24-backup-' + date + '.json';
    a.click();
    URL.revokeObjectURL(url);
    toast('Download สำเร็จ', 'ok');
  } catch (e) {
    console.error('[backup] download failed', e);
    toast('Download ล้มเหลว', 'bad');
  }
}

async function manualBackup() {
  if (!isOwner()) { toast('เฉพาะ Owner เท่านั้น', 'bad'); return; }
  toast('กำลังสำรองข้อมูล...', 'ok');
  await createDailyBackup(true);
  toast('สำรองข้อมูลสำเร็จ', 'ok');
  navigate('settings');
}

async function renderBackupHistory() {
  const list = document.getElementById('backup-history-list');
  if (!list) return;
  const dates = await listBackups();
  if (dates.length === 0) {
    list.innerHTML = '<div class="muted small">ยังไม่มีประวัติการสำรอง — กด "สำรองตอนนี้" เพื่อสร้าง</div>';
    return;
  }
  const today = new Date().toISOString().slice(0, 10);
  list.innerHTML = `
    <table>
      <thead><tr><th>วันที่</th><th></th></tr></thead>
      <tbody>${dates.map(d => `
        <tr>
          <td>${d} ${d === today ? '<span class="badge ok">วันนี้</span>' : ''}</td>
          <td class="row-actions" style="text-align: right;">
            <button class="btn small secondary" onclick="downloadBackup('${d}')">Download</button>
            <button class="btn small danger" onclick="restoreBackup('${d}')">Restore</button>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>
  `;
}
function exportCSV(kind) {
  let rows = [];
  if (kind === 'sales') {
    rows.push(['Time','Branch','EmpID','Type','Channel','MemberID','MemberName','Amount','Slip','Note','Notify']);
    filterByBranch(DATA.sales).filter(s => s.type !== 'Train').forEach(s => {
      rows.push([s.ts, s.branch, s.empId, s.type, s.channel || '', s.memberId, s.memberName, s.amount, s.slip, s.note, s.notify]);
    });
  }
  const csv = rows.map(r => r.map(v => '"' + String(v||'').replace(/"/g,'""') + '"').join(',')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = kind + '-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click(); URL.revokeObjectURL(url);
}

// ============ MODAL ============
function showModal(html, opts) {
  const host = document.getElementById('modal-host');
  const sizeClass = opts && opts.size === 'large' ? ' modal-lg' : '';
  host.innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal${sizeClass}">${html}</div></div>`;
}
function closeModal() {
  document.getElementById('modal-host').innerHTML = '';
}

// ============ INIT ============
(async () => {
  db.init();
  await loadData();
  SESSION = loadSession();
  if (SESSION) bootApp();

  // Real-time sync: when other devices change data, reload + re-render
  let isReloading = false;
  db.subscribe(async () => {
    if (isReloading) return;
    if (document.getElementById('modal-host').innerHTML.trim()) return; // skip if modal open
    if (!SESSION) return;
    isReloading = true;
    try {
      const remote = await db.loadAll();
      if (remote) {
        const seed = defaultData();
        DATA = {
          settings:     remote.settings  || seed.settings,
          branches:     remote.branches.length ? remote.branches : DATA.branches,
          users:        remote.users.length    ? remote.users    : DATA.users,
          employees:    remote.employees,
          members:      remote.members,
          sales:        remote.sales,
          trainings:    remote.trainings,
          alerts:       remote.alerts,
          loginLog:     remote.loginLog,
          lastDailyRun: remote.lastDailyRun,
        };
        localStorage.setItem(LS_KEY, JSON.stringify(DATA));
        if (CURRENT_VIEW) navigate(CURRENT_VIEW);
      }
    } finally { isReloading = false; }
  });
})();
