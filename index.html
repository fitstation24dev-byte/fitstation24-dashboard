<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FITSTATION 24 — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --brand: #0B132B;
    --accent: #FF5C00;
    --teal: #5BC0BE;
    --ok: #16A34A;
    --warn: #F59E0B;
    --bad: #DC2626;
    --bg: #F4F4F5;
    --surface: #FFFFFF;
    --border: #E5E7EB;
    --muted: #6B7280;
    --text: #1F2A44;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Sarabun', 'Noto Sans Thai', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: 14px; }
  .hidden { display: none !important; }

  /* ====== LOGIN ====== */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0B132B 0%, #1C2541 100%);
    padding: 20px;
  }
  .login-card {
    background: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 380px;
  }
  .login-card .logo {
    text-align: center;
    margin-bottom: 24px;
  }
  .login-card .logo img {
    width: 140px;
    height: 140px;
    object-fit: contain;
    border-radius: 16px;
    background: #000;
    padding: 8px;
    margin-bottom: 8px;
  }
  .login-card .logo .name {
    font-size: 22px;
    font-weight: 700;
    color: var(--brand);
    letter-spacing: 1px;
  }
  .login-card .logo .sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  .login-card label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    margin-top: 14px;
  }
  .login-card input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s;
  }
  .login-card input:focus { border-color: var(--accent); }
  .login-card .err {
    background: #FEE2E2;
    color: var(--bad);
    padding: 10px;
    border-radius: 8px;
    font-size: 12px;
    margin-top: 14px;
    display: none;
  }
  .login-card .err.show { display: block; }
  .login-card button.primary {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-weight: 600;
    margin-top: 20px;
    transition: background 0.15s;
  }
  .login-card button.primary:hover { background: #E04D00; }
  .login-card .demo {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
  }
  .login-card .demo-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-family: ui-monospace, 'SF Mono', Monaco, monospace;
    cursor: pointer;
  }
  .login-card .demo-row:hover { color: var(--accent); }

  /* ====== APP LAYOUT ====== */
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 240px;
    background: var(--brand);
    color: white;
    padding: 20px 0;
    flex-shrink: 0;
  }
  .sidebar .brand {
    padding: 0 20px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .sidebar .brand .name {
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 1px;
  }
  .sidebar .brand .sub {
    font-size: 11px;
    color: #9CA3AF;
    margin-top: 2px;
  }
  .sidebar nav { padding: 12px 0; }
  .sidebar nav button {
    display: block;
    width: 100%;
    padding: 10px 20px;
    background: transparent;
    color: #D1D5DB;
    border: none;
    text-align: left;
    font-size: 13px;
    transition: all 0.12s;
    border-left: 3px solid transparent;
  }
  .sidebar nav button:hover {
    background: rgba(255,255,255,0.05);
    color: white;
  }
  .sidebar nav button.active {
    background: rgba(255,92,0,0.1);
    color: white;
    border-left-color: var(--accent);
    font-weight: 600;
  }
  .sidebar .user-box {
    margin-top: auto;
    padding: 16px 20px;
    border-top: 1px solid rgba(255,255,255,0.1);
    font-size: 12px;
  }
  .sidebar .user-box .uname { color: white; font-weight: 600; }
  .sidebar .user-box .urole { color: #9CA3AF; font-size: 11px; }
  .sidebar .user-box button {
    margin-top: 8px;
    background: transparent;
    color: #D1D5DB;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11px;
    width: 100%;
  }
  .sidebar .user-box button:hover { background: rgba(255,255,255,0.05); }

  .main {
    flex: 1;
    overflow-x: hidden;
  }
  .topbar {
    background: white;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
  }
  .topbar .branch-pick select {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    font-size: 13px;
  }
  .content { padding: 24px 28px; }

  /* ====== KPI cards ====== */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 22px;
  }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .kpi .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .kpi .value { font-size: 26px; font-weight: 700; color: var(--brand); }
  .kpi .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .kpi.accent .value { color: var(--accent); }
  .kpi.ok .value { color: var(--ok); }

  /* ====== Cards ====== */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .card h2 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    color: var(--text);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card h2 small {
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
  }

  /* ====== Employee cards ====== */
  .emp-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px;
  }
  .emp-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 16px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    transition: box-shadow 0.15s, transform 0.15s;
  }
  .emp-card:hover {
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    transform: translateY(-2px);
  }
  .emp-avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    object-fit: cover;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: var(--muted);
    overflow: hidden;
    font-weight: 600;
  }
  img.emp-avatar { display: block; }
  .emp-card .ename { font-weight: 600; font-size: 14px; color: var(--text); }
  .emp-card .epos { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .emp-card .eid {
    font-size: 10px; color: var(--muted); margin-top: 6px;
    letter-spacing: 0.5px; font-family: ui-monospace, monospace;
  }
  .emp-card .emeta { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .emp-card .estats {
    margin-top: 12px; padding-top: 12px;
    border-top: 1px dashed var(--border);
    display: flex; gap: 12px; width: 100%; justify-content: center;
  }
  .emp-card .estat { flex: 1; }
  .emp-card .estat-label { font-size: 10px; color: var(--muted); }
  .emp-card .estat-value { font-size: 13px; font-weight: 600; color: var(--text); margin-top: 2px; }
  .emp-card .eactions { margin-top: 14px; display: flex; gap: 6px; width: 100%; }
  .emp-card .eactions button { flex: 1; }

  /* Photo upload (in modal) */
  .photo-upload { display: flex; align-items: center; gap: 14px; }
  .photo-upload .preview {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--bg); border: 1px dashed var(--border);
    overflow: hidden; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; color: var(--muted);
  }
  .photo-upload .preview img { width: 100%; height: 100%; object-fit: cover; }
  .photo-upload .controls { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .photo-upload input[type=file] { font-size: 12px; }

  /* Slip upload (in sales form) */
  .slip-input { display: flex; gap: 12px; align-items: flex-start; }
  .slip-preview {
    width: 72px; height: 72px; border-radius: 8px;
    background: var(--bg); border: 1px dashed var(--border);
    flex-shrink: 0; cursor: pointer; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: var(--muted);
    transition: border-color 0.15s;
  }
  .slip-preview:hover { border-color: var(--accent); }
  .slip-preview img { width: 100%; height: 100%; object-fit: cover; }
  .slip-controls { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
  .slip-controls input[type=file] { font-size: 12px; }

  /* ====== Tables ====== */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left;
    color: var(--muted);
    font-weight: 500;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  tbody td {
    padding: 10px;
    border-bottom: 1px solid var(--border);
  }
  tbody tr:hover { background: var(--bg); }
  td.right, th.right { text-align: right; }
  td.center, th.center { text-align: center; }

  /* Badges */
  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 500;
  }
  .badge.ok { background: #DCFCE7; color: #166534; }
  .badge.warn { background: #FEF3C7; color: #92400E; }
  .badge.bad { background: #FEE2E2; color: #991B1B; }
  .badge.info { background: #DBEAFE; color: #1E40AF; }
  .badge.gray { background: #F3F4F6; color: #4B5563; }

  /* ====== Forms ====== */
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 14px;
  }
  .form-grid .field { display: flex; flex-direction: column; gap: 4px; }
  .form-grid label { font-size: 11px; color: var(--muted); }
  .form-grid input, .form-grid select, .form-grid textarea {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
    transition: border-color 0.15s;
    background: white;
  }
  .form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus {
    border-color: var(--accent);
  }
  .form-grid .field.full { grid-column: 1 / -1; }

  button.btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 9px 18px;
    border-radius: 7px;
    font-weight: 600;
    font-size: 13px;
    transition: background 0.15s;
  }
  button.btn:hover { background: #E04D00; }
  button.btn.secondary {
    background: white;
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.btn.secondary:hover { background: var(--bg); }
  button.btn.danger { background: var(--bad); }
  button.btn.small { padding: 5px 10px; font-size: 12px; }

  .row-actions { display: flex; gap: 6px; }

  /* Charts */
  .chart-wrap {
    position: relative;
    height: 240px;
    width: 100%;
  }

  /* Two-col layout */
  .two-col {
    display: grid;
    grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
    gap: 18px;
  }
  @media (max-width: 900px) {
    .two-col { grid-template-columns: 1fr; }
    .sidebar { width: 60px; }
    .sidebar nav button { padding: 10px 18px; font-size: 0; }
    .sidebar .brand, .sidebar .user-box { padding-left: 14px; padding-right: 14px; }
  }

  /* Modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
  }
  .modal {
    background: white;
    border-radius: 12px;
    padding: 24px;
    width: 95%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal.modal-lg { max-width: 1100px; }
  .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--brand); color: white;
    padding: 12px 18px; border-radius: 8px;
    font-size: 13px; z-index: 2000;
    transition: opacity 0.3s, transform 0.3s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }
  .toast.ok { background: var(--ok); }
  .toast.bad { background: var(--bad); }
  .toast.warn { background: var(--warn); color: #422006; }

  /* Member status colors */
  .days-low { color: var(--bad); font-weight: 600; }
  .days-warn { color: var(--warn); font-weight: 600; }
  .hrs-low { color: var(--bad); font-weight: 600; }

  /* Misc */
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .toolbar .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .toolbar input, .toolbar select {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: white;
    font-size: 13px;
  }
</style>
</head>
<body>

<!-- ============== LOGIN SCREEN ============== -->
<div id="login-screen">
  <div class="login-card">
    <div class="logo">
      <img src="logo.png" alt="FITSTATION 24">
      <div class="sub">Dashboard System</div>
    </div>
    <label>Username</label>
    <input id="login-email" type="text" placeholder="username" autocomplete="username">
    <label>Password</label>
    <input id="login-pwd" type="password" placeholder="••••••••" autocomplete="current-password">
    <div id="login-err" class="err">Username หรือ Password ไม่ถูกต้อง</div>
    <button class="primary" onclick="doLogin()">เข้าสู่ระบบ</button>
  </div>
</div>

<!-- ============== MAIN APP ============== -->
<div id="app" class="app hidden">
  <aside class="sidebar" style="display: flex; flex-direction: column;">
    <div class="brand">
      <div class="name">FITSTATION 24</div>
      <div class="sub">Dashboard System</div>
    </div>
    <nav id="nav" style="flex: 1;"></nav>
    <div class="user-box">
      <div class="uname" id="user-name">—</div>
      <div class="urole" id="user-role">—</div>
      <button onclick="doLogout()">ออกจากระบบ</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="page-title">Dashboard</h1>
      <div style="display:flex; align-items:center; gap:14px;">
        <span id="db-status" style="font-size: 11px; color: #9CA3AF;" title="สถานะการซิงค์ข้อมูล">○ Offline</span>
        <div class="branch-pick">
          <select id="branch-filter" onchange="onBranchChange()"></select>
        </div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="modal-host"></div>

<script>
// ============================================================
// FITSTATION 24 — Single-file dashboard
// All data persists in localStorage. Export/Import for backup.
// ============================================================

const LS_KEY = 'fitstation24_data_v1';
const SESSION_KEY = 'fitstation24_session';

// ============================================================
// SUPABASE ADAPTER (cross-device sync)
// Falls back silently to localStorage if Supabase is unavailable.
// ============================================================
const SUPABASE_URL = 'https://xfnlwuqnxbrhbwveiwgm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhmbmx3dXFueGJyaGJ3dmVpd2dtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MjEzNDIsImV4cCI6MjA5MzM5NzM0Mn0.UKMN7PW-KxMuMNUcA3Iac9GdGI0-nMb2ZpdSC1q6QWU';
const LINE_FUNCTION_URL = SUPABASE_URL + '/functions/v1/swift-handler';
const SLIP_BUCKET = 'slips';

const TABLE_SPEC = {
  branches:  { table: 'app_branches',  pk: 'code',  fields: [['code','code'],['name','name'],['lineToken','line_token'],['lineGroupId','line_group_id'],['managerEmail','manager_email'],['managerPwd','manager_pwd']] },
  users:     { table: 'app_users',     pk: 'email', fields: [['email','email'],['pwd','pwd'],['name','name'],['role','role'],['branch','branch']] },
  employees: { table: 'app_employees', pk: 'id',    fields: [['id','id'],['name','name'],['surname','surname'],['position','position'],['branch','branch'],['status','status'],['photo','photo']] },
  members:   { table: 'app_members',   pk: 'id',    fields: [['id','id'],['name','name'],['surname','surname'],['age','age'],['branch','branch'],['startDate','start_date'],['endDate','end_date'],['hours','hours'],['trainer','trainer'],['lineUid','line_uid'],['status','status']] },
  sales:     { table: 'app_sales',     pk: 'id',    fields: [['id','id'],['ts','ts'],['branch','branch'],['empId','emp_id'],['type','type'],['memberId','member_id'],['memberName','member_name'],['amount','amount'],['channel','channel'],['slip','slip'],['note','note'],['notify','notify']] },
  trainings: { table: 'app_trainings', pk: 'id',    fields: [['id','id'],['ts','ts'],['branch','branch'],['memberId','member_id'],['memberName','member_name'],['trainerId','trainer_id'],['trainerName','trainer_name'],['verified','verified'],['hoursBefore','hours_before'],['hoursAfter','hours_after']] },
  alerts:    { table: 'app_alerts',    pk: 'id',    fields: [['id','id'],['ts','ts'],['kind','kind'],['message','message'],['branch','branch'],['read','read']] },
};

const db = {
  client: null,
  enabled: false,
  saveTimer: null,
  status: 'offline',  // 'offline' | 'online' | 'error' | 'syncing'

  init() {
    if (!window.supabase || !SUPABASE_URL || !SUPABASE_KEY) {
      console.warn('[db] Supabase not configured, using localStorage only');
      return false;
    }
    try {
      this.client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      this.enabled = true;
      this.setStatus('syncing');
      return true;
    } catch (e) {
      console.error('[db] init failed', e);
      return false;
    }
  },

  setStatus(s) {
    this.status = s;
    const el = document.getElementById('db-status');
    if (!el) return;
    const map = {
      online:  { text: '● Online',  color: '#15803D', title: 'ซิงค์ออนไลน์ทำงานอยู่' },
      offline: { text: '○ Offline', color: '#9CA3AF', title: 'ใช้ localStorage เท่านั้น' },
      syncing: { text: '◌ Syncing', color: '#D97706', title: 'กำลังซิงค์ข้อมูล' },
      error:   { text: '⚠ Sync error', color: '#DC2626', title: 'ซิงค์ขัดข้อง — แก้ไขในเครื่องอย่างเดียว' },
    };
    const m = map[s] || map.offline;
    el.textContent = m.text;
    el.style.color = m.color;
    el.title = m.title;
  },

  toRow(name, item) {
    const row = {};
    for (const [js, sql] of TABLE_SPEC[name].fields) row[sql] = item[js] !== undefined ? item[js] : null;
    return row;
  },
  toItem(name, row) {
    const item = {};
    for (const [js, sql] of TABLE_SPEC[name].fields) item[js] = row[sql];
    return item;
  },

  async loadAll() {
    if (!this.enabled) return null;
    try {
      const tableEntries = Object.entries(TABLE_SPEC);
      const tablePromises = tableEntries.map(([name, spec]) =>
        this.client.from(spec.table).select('*').then(r => ({ name, ...r }))
      );
      const settingsPromise = this.client.from('app_settings').select('*').not('key', 'like', 'backup_%');
      const logPromise = this.client.from('app_login_log').select('*').order('id', { ascending: false }).limit(200);

      const [tableResults, settingsResult, logResult] = await Promise.all([
        Promise.all(tablePromises),
        settingsPromise,
        logPromise,
      ]);

      const out = {};
      for (const r of tableResults) {
        if (r.error) throw r.error;
        out[r.name] = (r.data || []).map(row => this.toItem(r.name, row));
      }
      if (settingsResult.error) throw settingsResult.error;
      const sm = {};
      for (const r of (settingsResult.data || [])) sm[r.key] = r.value;
      out.settings = sm.global || null;
      out.lastDailyRun = sm.lastDailyRun || '';
      if (logResult.error) throw logResult.error;
      out.loginLog = (logResult.data || []).map(r => ({ ts: r.ts, email: r.email, role: r.role, branch: r.branch, action: r.action }));
      this.setStatus('online');
      return out;
    } catch (e) {
      console.error('[db] loadAll failed', e);
      this.setStatus('error');
      return null;
    }
  },

  async pushAll(data) {
    if (!this.enabled) return;
    try {
      const ops = [];
      for (const [name, spec] of Object.entries(TABLE_SPEC)) {
        const items = data[name] || [];
        if (items.length === 0) continue;
        const rows = items.map(i => this.toRow(name, i));
        ops.push(this.client.from(spec.table).upsert(rows, { onConflict: spec.pk }));
      }
      ops.push(this.client.from('app_settings').upsert({ key: 'global', value: data.settings || {} }, { onConflict: 'key' }));
      ops.push(this.client.from('app_settings').upsert({ key: 'lastDailyRun', value: data.lastDailyRun || '' }, { onConflict: 'key' }));
      const results = await Promise.all(ops);
      for (const r of results) if (r.error) throw r.error;
      this.setStatus('online');
    } catch (e) {
      console.error('[db] pushAll failed', e);
      this.setStatus('error');
    }
  },

  pushAllDebounced(data) {
    if (!this.enabled) return;
    clearTimeout(this.saveTimer);
    this.setStatus('syncing');
    this.saveTimer = setTimeout(() => this.pushAll(data), 700);
  },

  async del(name, id) {
    if (!this.enabled) return;
    const spec = TABLE_SPEC[name];
    if (!spec) return;
    try {
      const { error } = await this.client.from(spec.table).delete().eq(spec.pk, id);
      if (error) throw error;
    } catch (e) { console.error('[db] delete failed', name, id, e); }
  },

  async appendLogin(entry) {
    if (!this.enabled) return;
    try { await this.client.from('app_login_log').insert({ ts: entry.ts, email: entry.email, role: entry.role, branch: entry.branch, action: entry.action }); }
    catch (e) { console.error('[db] login log append failed', e); }
  },

  async isEmpty() {
    if (!this.enabled) return false;
    try {
      const { count } = await this.client.from('app_branches').select('*', { count: 'exact', head: true });
      return (count || 0) === 0;
    } catch (e) { return false; }
  },

  subscribe(onChange) {
    if (!this.enabled) return;
    const tables = Object.values(TABLE_SPEC).map(s => s.table).concat(['app_settings', 'app_login_log']);
    let pendingTimer = null;
    const trigger = (t) => {
      clearTimeout(pendingTimer);
      pendingTimer = setTimeout(() => onChange(t), 300);
    };
    for (const t of tables) {
      this.client.channel('rt:' + t)
        .on('postgres_changes', { event: '*', schema: 'public', table: t }, () => trigger(t))
        .subscribe();
    }
  },
};

async function loadData() {
  // 1. Try Supabase first
  if (db.enabled) {
    const remote = await db.loadAll();
    if (remote) {
      const empty = (remote.branches || []).length === 0;
      if (empty) {
        // First-run: seed Supabase with localStorage data if available, else defaults
        let seedSrc = null;
        try {
          const raw = localStorage.getItem(LS_KEY);
          if (raw) seedSrc = JSON.parse(raw);
        } catch {}
        DATA = seedSrc || defaultData();
        await db.pushAll(DATA);
      } else {
        const seed = defaultData();
        DATA = {
          settings:      remote.settings  || seed.settings,
          branches:      remote.branches.length  ? remote.branches  : seed.branches,
          users:         remote.users.length     ? remote.users     : seed.users,
          employees:     remote.employees,
          members:       remote.members,
          sales:         remote.sales,
          trainings:     remote.trainings,
          alerts:        remote.alerts,
          loginLog:      remote.loginLog,
          lastDailyRun:  remote.lastDailyRun,
        };
      }
      localStorage.setItem(LS_KEY, JSON.stringify(DATA));
      return;
    }
  }
  // 2. Fallback to localStorage
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) {
      DATA = defaultData();
      saveData();
    } else {
      DATA = JSON.parse(raw);
    }
  } catch (e) {
    console.error('loadData error', e);
    DATA = defaultData();
    saveData();
  }
}

function saveData() {
  localStorage.setItem(LS_KEY, JSON.stringify(DATA));
  db.pushAllDebounced(DATA);
}

function loadSession() {
  try {
    const raw = sessionStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function saveSession(s) {
  if (s) sessionStorage.setItem(SESSION_KEY, JSON.stringify(s));
  else sessionStorage.removeItem(SESSION_KEY);
}

// Escape user-controlled strings for safe insertion into HTML (XSS defense)
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ---------- FORMATTERS ----------
function thb(n) { return DATA.settings.currency + Number(n || 0).toLocaleString('th-TH'); }
function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('th-TH', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
}
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: 'numeric' });
}
function fmtTimeShort(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', hour12: false });
}
function todayStart() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function isSameDay(iso, refDate) {
  const d = new Date(iso);
  return d.getFullYear() === refDate.getFullYear() && d.getMonth() === refDate.getMonth() && d.getDate() === refDate.getDate();
}
function inRange(iso, range) {
  const t = new Date(iso).getTime();
  return t >= range.start.getTime() && t < range.end.getTime();
}
function getDashRange() {
  const today = todayStart();
  const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
  const dayMs = 1000 * 60 * 60 * 24;
  switch (DASH_PERIOD.type) {
    case 'today':
      return { start: today, end: tomorrow, label: 'วันนี้', days: 1 };
    case 'yesterday': {
      const s = new Date(today); s.setDate(s.getDate() - 1);
      return { start: s, end: today, label: 'เมื่อวาน', days: 1 };
    }
    case '7d': {
      const s = new Date(today); s.setDate(s.getDate() - 6);
      return { start: s, end: tomorrow, label: '7 วันล่าสุด', days: 7 };
    }
    case '30d': {
      const s = new Date(today); s.setDate(s.getDate() - 29);
      return { start: s, end: tomorrow, label: '30 วันล่าสุด', days: 30 };
    }
    case 'thisMonth': {
      const s = new Date(today.getFullYear(), today.getMonth(), 1);
      const e = new Date(today.getFullYear(), today.getMonth() + 1, 1);
      return { start: s, end: e, label: 'เดือนนี้', days: Math.round((e - s) / dayMs) };
    }
    case 'lastMonth': {
      const s = new Date(today.getFullYear(), today.getMonth() - 1, 1);
      const e = new Date(today.getFullYear(), today.getMonth(), 1);
      return { start: s, end: e, label: 'เดือนที่แล้ว', days: Math.round((e - s) / dayMs) };
    }
    case 'custom': {
      const s = DASH_PERIOD.from ? new Date(DASH_PERIOD.from + 'T00:00:00') : new Date(today);
      s.setHours(0, 0, 0, 0);
      const eRef = DASH_PERIOD.to ? new Date(DASH_PERIOD.to + 'T00:00:00') : new Date(today);
      eRef.setHours(0, 0, 0, 0);
      const e = new Date(eRef); e.setDate(e.getDate() + 1);
      const days = Math.max(1, Math.round((e - s) / dayMs));
      return { start: s, end: e, label: 'กำหนดเอง', days };
    }
    default:
      return { start: today, end: tomorrow, label: 'วันนี้', days: 1 };
  }
}
function setDashPeriod(type, from, to) {
  DASH_PERIOD = { type, from: from || null, to: to || null };
  DASHBOARD_DATE = '';
  if (CURRENT_VIEW === 'dashboard') navigate('dashboard');
}
function applyDashCustomRange() {
  const f = document.getElementById('dash-from').value;
  const t = document.getElementById('dash-to').value;
  if (!f || !t) { toast('กรุณาเลือกวันที่ให้ครบ', 'bad'); return; }
  if (new Date(f) > new Date(t)) { toast('วันที่เริ่มต้นต้องไม่เกินวันสิ้นสุด', 'bad'); return; }
  setDashPeriod('custom', f, t);
}
function daysBetween(iso1, ref) {
  const a = new Date(iso1); a.setHours(0,0,0,0);
  const b = new Date(ref);  b.setHours(0,0,0,0);
  return Math.round((a - b) / (1000*60*60*24));
}

// ---------- TOAST ----------
function toast(msg, kind) {
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(8px)'; }, 2400);
  setTimeout(() => t.remove(), 2800);
}

// ---------- DAILY DECREMENT (run on first load each day) ----------
function runDailyMaintenance() {
  const today = new Date().toISOString().slice(0, 10);
  if (DATA.lastDailyRun === today) return;
  DATA.lastDailyRun = today;

  // Build alerts list
  const newAlerts = [];
  const ref = todayStart();
  DATA.members.forEach(m => {
    if (m.status !== 'Active') return;
    if (m.endDate) {
      const dl = daysBetween(m.endDate, ref);
      if (dl >= 0 && dl <= DATA.settings.expiryWarnDays) {
        newAlerts.push({
          id: nid(), ts: new Date().toISOString(),
          type: 'Member Expiring', branch: m.branch,
          memberId: m.id, memberName: m.name + ' ' + m.surname,
          value: dl + ' วัน', message: 'หมดอายุในอีก ' + dl + ' วัน',
          status: m.lineUid ? 'Sent' : 'No LINE',
        });
      }
    }
    if (m.hours > 0 && m.hours <= DATA.settings.trainerWarnHrs) {
      newAlerts.push({
        id: nid(), ts: new Date().toISOString(),
        type: 'Trainer Hours Low', branch: m.branch,
        memberId: m.id, memberName: m.name + ' ' + m.surname,
        value: m.hours + ' ครั้ง', message: 'เหลือชั่วโมงเทรน ' + m.hours + ' ครั้ง',
        status: m.lineUid ? 'Sent' : 'No LINE',
      });
    }
  });
  // Replace today's alerts with new ones (avoid daily duplicates)
  DATA.alerts = newAlerts.concat(DATA.alerts.filter(a => !isSameDay(a.ts, ref))).slice(0, 200);
  saveData();

  // Fire-and-forget: notify branch LINE group about expiring members
  sendDailyExpiryAlertsToGroup().catch(err => console.error('[daily] expiry alert push failed', err));
  sendDailyHoursLowAlertsToGroup().catch(err => console.error('[daily] hours-low alert push failed', err));
  // Fire-and-forget: snapshot DATA into Supabase (rolling 7-day backup)
  createDailyBackup().catch(err => console.error('[daily] backup failed', err));
}

    nav.appendChild(b);
  });

  // Branch picker
  const bf = document.getElementById('branch-filter');
  bf.innerHTML = '';
  if (canSeeAllBranches()) {
    const opt = document.createElement('option');
    opt.value = '*'; opt.textContent = 'ทุกสาขา';
    bf.appendChild(opt);
  }
  visibleBranches().forEach(code => {
    const br = DATA.branches.find(b => b.code === code);
    if (br) {
      const opt = document.createElement('option');
      opt.value = code;
      opt.textContent = br.name;
      bf.appendChild(opt);
    }
  });
  // Restore branch from sessionStorage if user still has access
  let savedBranch = '';
  try { savedBranch = sessionStorage.getItem('fs24_branch') || ''; } catch {}
  const allowedBranches = Array.from(bf.options).map(o => o.value);
  CURRENT_BRANCH = (savedBranch && allowedBranches.includes(savedBranch))
    ? savedBranch
    : (canSeeAllBranches() ? '*' : SESSION.branch);
  bf.value = CURRENT_BRANCH;

  migrateEmployeePositions();
  runDailyMaintenance();

  // Restore view from sessionStorage if user still has access
  const allowedViews = Array.from(document.querySelectorAll('#nav button')).map(b => b.dataset.id);
  let savedView = '';
  try { savedView = sessionStorage.getItem('fs24_view') || ''; } catch {}
  const initialView = (savedView && allowedViews.includes(savedView)) ? savedView : 'dashboard';
  navigate(initialView);
}

function onBranchChange() {
  CURRENT_BRANCH = document.getElementById('branch-filter').value;
  try { sessionStorage.setItem('fs24_branch', CURRENT_BRANCH); } catch {}
  navigate(CURRENT_VIEW);
}

function navigate(view) {
  if (SESSION && !canAccessView(SESSION.role, view)) {
    view = canAccessView(SESSION.role, 'dashboard') ? 'dashboard' : (NAV_ITEMS.find(i => canAccessView(SESSION.role, i.id)) || {}).id || 'dashboard';
  }
  TRAIN_GATE_VERIFIED = false;
  CURRENT_VIEW = view;
  try { sessionStorage.setItem('fs24_view', view); } catch {}
  document.querySelectorAll('#nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.id === view);
  });
  Object.values(CHARTS).forEach(c => c.destroy && c.destroy());
  CHARTS = {};
  const titles = {
    'dashboard': 'Dashboard', 'sales': 'บันทึกยอดขาย', 'trainings': 'บันทึกการเทรน',
    'members': 'สมาชิก', 'registration': '📝 สมัครสมาชิก',
    'sales-log': 'ประวัติการขาย', 'invoices': 'ใบกำกับภาษี',
    'alerts': 'การแจ้งเตือน',
    'employees': 'พนักงาน', 'reports': 'รายงาน', 'settings': 'ตั้งค่าระบบ',
  };
  document.getElementById('page-title').textContent = titles[view] || view;
  const c = document.getElementById('content');
  c.innerHTML = '';
  if (view === 'dashboard')           renderDashboard(c);
  else if (view === 'sales')          renderSalesEntry(c);
  else if (view === 'trainings')      renderTrainingsEntry(c);
  else if (view === 'members')        renderMembers(c);
  else if (view === 'registration')   renderRegistration(c);
  else if (view === 'sales-log')      renderSalesLog(c);
  else if (view === 'invoices')       renderInvoices(c);
  else if (view === 'alerts')         renderAlerts(c);
  else if (view === 'employees')      renderEmployees(c);
  else if (view === 'reports')        renderReports(c);
  else if (view === 'settings')       renderSettings(c);
}

// ============ DASHBOARD ============
function renderDashboard(root) {
  const today = todayStart();
  const range = getDashRange();
  const dateLabel = range.label;
  const ref = new Date(range.end.getTime() - 86400000); ref.setHours(0, 0, 0, 0);

  const sales = filterByBranch(DATA.sales);
  const trainings = filterByBranch(DATA.trainings);

  const todaySales = sales.filter(s => inRange(s.ts, range));
  const todayMem = todaySales.filter(s => s.type === 'MEM').reduce((a,b) => a + b.amount, 0);
  const todayPt  = todaySales.filter(s => s.type === 'PT').reduce((a,b) => a + b.amount, 0);
  const todayPlan = todaySales.filter(s => s.type === 'Plan').reduce((a,b) => a + b.amount, 0);
  const todayTotal = todayMem + todayPt + todayPlan;
  const todayTrain = trainings.filter(t => t.verified && inRange(t.ts, range)).length;

  const memCount = todaySales.filter(s => s.type === 'MEM').length;
  const ptCount  = todaySales.filter(s => s.type === 'PT').length;

  // Period picker toolbar
  const opts = [
    { id: 'today',     label: 'วันนี้' },
    { id: 'yesterday', label: 'เมื่อวาน' },
    { id: '7d',        label: '7 วัน' },
    { id: '30d',       label: '30 วัน' },
    { id: 'thisMonth', label: 'เดือนนี้' },
    { id: 'lastMonth', label: 'เดือนที่แล้ว' },
    { id: 'custom',    label: 'กำหนดเอง' },
  ];
  const todayStr = today.toISOString().slice(0, 10);
  const fromVal = DASH_PERIOD.from || todayStr;
  const toVal = DASH_PERIOD.to || todayStr;
  const rangeText = range.days === 1
    ? fmtDate(range.start.toISOString())
    : `${fmtDate(range.start.toISOString())} - ${fmtDate(ref.toISOString())}`;
  const tb = document.createElement('div');
  tb.className = 'toolbar';
  tb.innerHTML = `
    <div class="filters" style="align-items: center; flex-wrap: wrap; gap: 6px;">
      <label class="muted small" style="margin-right: 6px;">ช่วงเวลา:</label>
      ${opts.map(o => `<button class="btn small ${DASH_PERIOD.type === o.id ? '' : 'secondary'}" onclick="setDashPeriod('${o.id}')">${o.label}</button>`).join('')}
      <span id="dash-custom-range" style="display:${DASH_PERIOD.type === 'custom' ? 'inline-flex' : 'none'}; gap:6px; align-items:center; margin-left:8px;">
        <input type="date" id="dash-from" value="${fromVal}" max="${todayStr}" style="padding:5px 8px; border:1px solid var(--border); border-radius:6px;">
        <span class="muted small">ถึง</span>
        <input type="date" id="dash-to" value="${toVal}" max="${todayStr}" style="padding:5px 8px; border:1px solid var(--border); border-radius:6px;">
        <button class="btn small" onclick="applyDashCustomRange()">ใช้</button>
      </span>
    </div>
    <div class="muted small">${rangeText}</div>
  `;
  root.appendChild(tb);

  // KPI cards
  const kpi = document.createElement('div');
  kpi.className = 'kpi-grid';
  kpi.innerHTML = `
    <div class="kpi accent">
      <div class="label">ยอดรวม${dateLabel}</div>
      <div class="value">${thb(todayTotal)}</div>
      <div class="sub">${todaySales.length} รายการ</div>
    </div>
    <div class="kpi">
      <div class="label">MEM ${dateLabel}</div>
      <div class="value">${memCount}</div>
      <div class="sub">${thb(todayMem)}</div>
    </div>
    <div class="kpi">
      <div class="label">PT ${dateLabel}</div>
      <div class="value">${ptCount}</div>
      <div class="sub">${thb(todayPt)}</div>
    </div>
    <div class="kpi ok">
      <div class="label">เทรน${dateLabel}</div>
      <div class="value">${todayTrain}</div>
      <div class="sub">ครั้ง</div>
    </div>
  `;
  root.appendChild(kpi);

  // Channel breakdown (Walk-In / Online / Br / Renew)
  const channelSales = todaySales.filter(s => s.type !== 'Train');
  const channels = ['Walk-In', 'Online', 'Br', 'Renew'];
  const chCards = channels.map(ch => {
    const items = channelSales.filter(s => s.channel === ch);
    const total = items.reduce((a, b) => a + Number(b.amount || 0), 0);
    return `
      <div class="kpi">
        <div class="label">${ch} ${dateLabel}</div>
        <div class="value">${items.length}</div>
        <div class="sub">${thb(total)}</div>
      </div>`;
  }).join('');
  const chWrap = document.createElement('div');
  chWrap.innerHTML = `
    <h3 style="margin: 18px 0 8px 0; color: var(--text); font-size: 14px;">ยอดขายตามช่องทาง</h3>
    <div class="kpi-grid">${chCards}</div>
  `;
  root.appendChild(chWrap);

  // Branch breakdown card
  const bb = document.createElement('div');
  bb.className = 'card';
  let rows = '';
  const showBranches = canSeeAllBranches() ? DATA.branches.map(b => b.code) : [SESSION.branch];
  let totals = { mem: 0, pt: 0, plan: 0, all: 0, train: 0, overdue: 0 };
  const overdueRef = today;
  showBranches.forEach(code => {
    const br = DATA.branches.find(x => x.code === code);
    const bs = DATA.sales.filter(s => s.branch === code && inRange(s.ts, range));
    const mem = bs.filter(x => x.type === 'MEM').reduce((a,b) => a + b.amount, 0);
    const pt  = bs.filter(x => x.type === 'PT').reduce((a,b) => a + b.amount, 0);
    const pl  = bs.filter(x => x.type === 'Plan').reduce((a,b) => a + b.amount, 0);
    const tot = mem + pt + pl;
    const tr  = DATA.trainings.filter(t => t.branch === code && t.verified && inRange(t.ts, range)).length;
    const overdue = DATA.members.filter(m => m.branch === code && m.status === 'Active' && new Date(m.endDate) < overdueRef).length;
    totals.mem += mem; totals.pt += pt; totals.plan += pl; totals.all += tot; totals.train += tr; totals.overdue += overdue;
    rows += `
      <tr>
        <td><strong>${_h(code)}</strong> · <span class="muted">${br ? _h(br.name.replace(code + ' - ', '')) : ''}</span></td>
        <td class="right">${thb(mem)}</td>
        <td class="right">${thb(pt)}</td>
        <td class="right">${thb(pl)}</td>
        <td class="right"><strong>${thb(tot)}</strong></td>
        <td class="right">${tr}</td>
        <td class="right">${overdue > 0 ? '<span class="badge bad">'+overdue+'</span>' : '<span class="muted">0</span>'}</td>
      </tr>`;
  });
  if (showBranches.length > 1) {
    rows += `
      <tr style="background: var(--bg); font-weight: 600;">
        <td>รวม</td>
        <td class="right">${thb(totals.mem)}</td>
        <td class="right">${thb(totals.pt)}</td>
        <td class="right">${thb(totals.plan)}</td>
        <td class="right">${thb(totals.all)}</td>
        <td class="right">${totals.train}</td>
        <td class="right">${totals.overdue}</td>
      </tr>`;
  }
  bb.innerHTML = `
    <h2>ยอด${dateLabel}แยกตามสาขา</h2>
    <table>
      <thead><tr>
        <th>สาขา</th><th class="right">MEM</th><th class="right">PT</th><th class="right">Plan</th>
        <th class="right">รวม</th><th class="right">เทรน</th><th class="right">เกินกำหนด</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
  root.appendChild(bb);

  // Two-col: revenue chart + alerts
  const tc = document.createElement('div');
  tc.className = 'two-col';

  const left = document.createElement('div');
  left.className = 'card';
  const chartWindow = Math.max(range.days, 14);
  left.innerHTML = `<h2>ยอดขายรวมรายวัน <small>${chartWindow} วันล่าสุด</small></h2><div class="chart-wrap"><canvas id="dashChartRev"></canvas></div>`;
  tc.appendChild(left);

  const right = document.createElement('div');
  right.className = 'card';
  const recentAlerts = DATA.alerts.filter(a => !canSeeAllBranches() ? a.branch === SESSION.branch : (CURRENT_BRANCH === '*' || a.branch === CURRENT_BRANCH)).slice(0, 6);
  let alertHtml = '';
  if (recentAlerts.length === 0) {
    alertHtml = '<div class="muted small" style="padding: 16px 0;">ไม่มีการแจ้งเตือน</div>';
  } else {
    recentAlerts.forEach(a => {
      const cls = a.type === 'Member Expiring' ? 'warn' : 'info';
      alertHtml += `<div style="display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border);">
        <span class="badge ${cls}" style="white-space: nowrap;">${_h(a.value)}</span>
        <div style="min-width: 0; flex: 1;">
          <div style="font-weight: 500;">${_h(a.memberName)}</div>
          <div class="muted small">${_h(a.branch)} · ${_h(a.message)}</div>
        </div>
      </div>`;
    });
  }
  right.innerHTML = `<h2>การแจ้งเตือน</h2>${alertHtml}`;
  tc.appendChild(right);
  root.appendChild(tc);

  // Recent sales card
  const rs = document.createElement('div');
  rs.className = 'card';
  const recent = sales.filter(s => s.type !== 'Train').slice().sort((a,b) => new Date(b.ts) - new Date(a.ts)).slice(0, 8);
  let rsRows = '';
  recent.forEach(s => {
    const typeBadge = `<span style="font-weight: 600; color: ${typeColor(s.type)};">${_h(s.type)}</span>`;
    const channel = s.channel ? `<span class="badge gray">${_h(s.channel)}</span>` : '<span class="muted">—</span>';
    const notify = renderNotifyBadge(s.notify);
    const slipLink = s.slip ? `<a href="#" onclick="event.preventDefault(); viewSaleSlipById('${_h(s.id)}');" style="color: var(--accent); cursor:pointer;">ดู</a>` : '<span class="muted">—</span>';
    rsRows += `<tr>
      <td>${fmtTimeShort(s.ts)}</td>
      <td>${typeBadge}</td>
      <td class="center">${channel}</td>
      <td>${s.memberName ? _h(s.memberName) : '<span class="muted">—</span>'}</td>
      <td>${_h(s.branch)}</td>
      <td class="right"><strong>${thb(s.amount)}</strong></td>
      <td class="center">${slipLink}</td>
      <td class="center">${notify}</td>
    </tr>`;
  });
  if (rsRows === '') rsRows = '<tr><td colspan="8" class="muted center" style="padding: 20px;">ยังไม่มีรายการขาย</td></tr>';
  rs.innerHTML = `<h2>รายการขายล่าสุด</h2>
    <table>
      <thead><tr>
        <th>เวลา</th><th>ประเภท</th><th class="center">ช่องทาง</th><th>สมาชิก</th><th>สาขา</th>
        <th class="right">ยอด</th><th class="center">สลิป</th><th class="center">LINE</th>
      </tr></thead>
      <tbody>${rsRows}</tbody>
    </table>`;
  root.appendChild(rs);

  // Build chart
  const chartRef = ref;
  const days = [];
  const totals2 = [];
  for (let i = chartWindow - 1; i >= 0; i--) {
    const d = new Date(chartRef); d.setDate(d.getDate() - i);
    days.push(d.toLocaleDateString('th-TH', { day: '2-digit', month: 'short' }));
    const sum = DATA.sales.filter(s => isSameDay(s.ts, d) && (CURRENT_BRANCH === '*' || s.branch === CURRENT_BRANCH))
                          .reduce((a, b) => a + b.amount, 0);
    totals2.push(sum);
  }
  CHARTS.dashRev = new Chart(document.getElementById('dashChartRev'), {
    type: 'line',
    data: {
      labels: days,
      datasets: [{
        label: 'ยอดรวม', data: totals2,
        borderColor: '#FF5C00', backgroundColor: 'rgba(255,92,0,0.1)',
        fill: true, tension: 0.35, pointRadius: 3,
        pointBackgroundColor: '#FF5C00', borderWidth: 2,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => '฿' + c.parsed.y.toLocaleString() } }
      },
      scales: {
        x: { ticks: { color: '#6B7280', font: { size: 10 }, autoSkip: true, maxTicksLimit: 7 }, grid: { display: false } },
        y: { ticks: { color: '#6B7280', font: { size: 10 }, callback: v => '฿' + (v/1000).toFixed(0) + 'K' }, grid: { color: '#E5E7EB' } }
      }
    }
  });
}

function typeColor(t) {
  return { 'MEM': '#534AB7', 'PT': '#185FA5', 'Plan': '#888780', 'Train': '#16A34A' }[t] || '#6B7280';
}
function renderNotifyBadge(n) {
  if (n === 'Sent') return '<span class="badge ok">Sent</span>';
  if (n === 'Failed') return '<span class="badge bad">Failed</span>';
  if (n === 'Pending') return '<span class="badge warn">Pending</span>';
  return '<span class="muted">—</span>';
}

function onMemberPick() {
  const id = document.getElementById('se-member').value;
  const m = DATA.members.find(x => x.id === id);
  if (m) {
    document.getElementById('se-mname').value = m.name + ' ' + m.surname;
    document.getElementById('se-branch').value = m.branch;
  }
  updateLinePreview();
}

function updateSaleSlipReq() {
  const t = document.getElementById('se-type').value;
  const req = document.getElementById('se-slip-req');
  if (t === 'MEM' || t === 'PT') req.style.display = '';
  else req.style.display = 'none';
  updateLinePreview();
}

function onSaleMemberInput() {
  const inp = document.getElementById('se-mname');
  const list = document.getElementById('se-members-list');
  const hidden = document.getElementById('se-member-id');
  const opt = list ? Array.from(list.options).find(o => o.value === inp.value) : null;
  hidden.value = opt ? (opt.dataset.id || '') : '';
  updateRenewAvailability();
}

function updateRenewAvailability() {
  const memberId = (document.getElementById('se-member-id') || {}).value || '';
  const channelSel = document.getElementById('se-channel');
  const renewOpt = channelSel ? channelSel.querySelector('option[value="Renew"]') : null;
  if (!renewOpt) return;
  if (memberId) {
    renewOpt.disabled = false;
    renewOpt.textContent = 'Renew';
  } else {
    renewOpt.disabled = true;

function handleSaleSlip(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { toast('กรุณาเลือกไฟล์รูปภาพ', 'bad'); return; }
  if (file.size > 8 * 1024 * 1024) { toast('ไฟล์ใหญ่เกิน 8MB', 'bad'); return; }
  const reader = new FileReader();
  reader.onload = ev2 => {
    const img = new Image();
    img.onload = () => {
      const max = 800;
      const ratio = Math.min(max / img.width, max / img.height, 1);
      const w = Math.round(img.width * ratio);
      const h = Math.round(img.height * ratio);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      const slipEl = document.getElementById('se-slip');
      if (slipEl) { slipEl.value = dataUrl; updateSlipPreview(); updateLinePreview(); }
    };
    img.onerror = () => toast('ไม่สามารถอ่านไฟล์รูปได้', 'bad');
    img.src = ev2.target.result;
  };
  reader.readAsDataURL(file);
}

async function uploadSlipToStorage(dataUrl, saleId) {
  if (!dataUrl) return '';
  if (!dataUrl.startsWith('data:')) return dataUrl; // already a URL — pass through
  if (!db.client) throw new Error('Supabase ยังไม่เชื่อมต่อ');
  const blob = await (await fetch(dataUrl)).blob();
  const ext = (blob.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg');
  const yyyymmdd = new Date().toISOString().slice(0, 10);
  const path = `${yyyymmdd}/${saleId}.${ext}`;
  const { error } = await db.client.storage
    .from(SLIP_BUCKET)
    .upload(path, blob, { contentType: blob.type, upsert: true });
  if (error) throw error;
  const { data } = db.client.storage.from(SLIP_BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

async function sendLineMessage(text, slipUrl, branchCode) {
  const branch = branchCode ? DATA.branches.find(b => b.code === branchCode) : null;
  if (!branch) throw new Error('ไม่พบสาขา: ' + branchCode);
  if (!branch.lineToken || !branch.lineGroupId) {
    throw new Error(`สาขา ${branch.code} ยังไม่ได้ตั้งค่า LINE Token / Group ID`);
  }
  const res = await fetch(LINE_FUNCTION_URL, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message: text,
      slipUrl: slipUrl || undefined,
      branchCode: branch.code,
      lineToken: branch.lineToken,
      lineGroupId: branch.lineGroupId,
    }),
  });
  const result = await res.json().catch(() => ({}));
  if (!res.ok || !result.ok) throw new Error(result.error || ('HTTP ' + res.status));
}

async function sendSaleToLine(sale, slipUrl) {

สมาชิก: ${sale.memberName || '-'}
พนักงาน: ${emp ? emp.name + ' ' + emp.surname : sale.empId}
ยอด: ${DATA.settings.currency}${Number(sale.amount).toLocaleString()}${sale.note ? '\nหมายเหตุ: ' + sale.note : ''}
เวลา: ${new Date(sale.ts).toLocaleString('th-TH')}`;
  await sendLineMessage(text, slipUrl, sale.branch);
}

async function sendDailyHoursLowAlertsToGroup() {
  if (!DATA.settings.hoursNotified) DATA.settings.hoursNotified = {};
  const notified = DATA.settings.hoursNotified;
  const threshold = DATA.settings.trainerWarnHrs;
  let changed = false;

  const lowHours = [];
  DATA.members.forEach(m => {
    if (m.status !== 'Active') return;
    if (m.hours > threshold) {
      if (notified[m.id]) { delete notified[m.id]; changed = true; }
    } else if (m.hours >= 0 && !notified[m.id]) {
      lowHours.push(m);
    }
  });
  if (changed) saveData();
  if (lowHours.length === 0) return;

  const byBranch = {};
  lowHours.forEach(m => { (byBranch[m.branch] = byBranch[m.branch] || []).push(m); });

  for (const code of Object.keys(byBranch)) {
    const br = DATA.branches.find(b => b.code === code);
    const items = byBranch[code].sort((a, b) => a.hours - b.hours);
    const lines = items.map(m =>
      `• ${m.id} — ${m.name} ${m.surname} (เหลือ ${m.hours} ครั้ง)`).join('\n');
    const text = `⚠️ ชั่วโมงเทรนใกล้หมด — ${br ? br.name : code}
${lines}
รวม ${items.length} คน · เหลือ ≤ ${threshold} ครั้ง`;
    try {
      await sendLineMessage(text, null, code);
      items.forEach(m => { notified[m.id] = true; });
      saveData();
    } catch (err) {
      console.error('[hours-alert] send failed for branch', code, err);
    }
  }
}

async function sendDailyExpiryAlertsToGroup() {
  const ref = todayStart();
  if (!DATA.settings.expiryNotified) DATA.settings.expiryNotified = {};
  const notified = DATA.settings.expiryNotified;
  const expiring = DATA.members
    .filter(m => m.status === 'Active' && m.endDate)
    .map(m => ({ m, dl: daysBetween(m.endDate, ref) }))
    .filter(x => x.dl >= 0 && x.dl <= DATA.settings.expiryWarnDays)
    .filter(x => notified[x.m.id] !== x.m.endDate);
  if (expiring.length === 0) return;

  const byBranch = {};
  expiring.forEach(({ m, dl }) => {
    (byBranch[m.branch] = byBranch[m.branch] || []).push({ m, dl });
  });

  for (const code of Object.keys(byBranch)) {
    const br = DATA.branches.find(b => b.code === code);
    const items = byBranch[code].sort((a, b) => a.dl - b.dl);
    const lines = items.map(({ m, dl }) =>
      `• ${m.id} — ${m.name} ${m.surname} (อีก ${dl} วัน)`).join('\n');
    const text = `⏰ สมาชิกใกล้หมดอายุ — ${br ? br.name : code}
${lines}
รวม ${items.length} คน · ส่งภายใน ${DATA.settings.expiryWarnDays} วัน`;
    try {
      await sendLineMessage(text, null, code);
      items.forEach(({ m }) => { notified[m.id] = m.endDate; });
      saveData();
    } catch (err) {
      console.error('[expiry-alert] send failed for branch', code, err);
    }
  }
}

async function onSubmitSale(e) {
  e.preventDefault();
  const branch = document.getElementById('se-branch').value;
  const empId = document.getElementById('se-emp').value;
  const type = document.getElementById('se-type').value;
  const amount = Number(document.getElementById('se-amount').value);
  const channel = document.getElementById('se-channel').value;
  const memberName = document.getElementById('se-mname').value;
  const memberId = (document.getElementById('se-member-id') || {}).value || '';
  const slip = document.getElementById('se-slip').value;
  const note = document.getElementById('se-note').value;

  if (channel === 'Renew' && !memberId) {
    toast('ช่องทาง Renew ใช้ได้กับสมาชิกเก่าเท่านั้น', 'bad'); return;
  }

  if ((type === 'MEM' || type === 'PT') && !slip) {
    if (!confirm('ประเภท ' + type + ' ปกติต้องแนบสลิป\nบันทึกโดยไม่มีสลิปจริงหรือ?')) return;
  }

  const needsLine = (type === 'MEM' || type === 'PT');
  const sale = {
    id: nid(), ts: new Date().toISOString(),
    branch, empId, type, memberId, memberName, amount, channel, slip, note,
    notify: needsLine ? 'Pending' : '—',
  };
  DATA.sales.unshift(sale);
  saveData();
  toast('บันทึกยอดเรียบร้อย ' + thb(amount), 'ok');
  resetSaleForm();

  if (!needsLine) return;

  // Send LINE notification asynchronously
  try {
    let slipUrl = '';
    if (slip) {
      slipUrl = await uploadSlipToStorage(slip, sale.id);
      // Replace data URL with public URL in DATA + DB
      const idx = DATA.sales.findIndex(s => s.id === sale.id);
      if (idx >= 0) DATA.sales[idx].slip = slipUrl;
    }
    await sendSaleToLine(sale, slipUrl);
    const idx = DATA.sales.findIndex(s => s.id === sale.id);
    if (idx >= 0) DATA.sales[idx].notify = 'Sent';
    saveData();
    toast('ส่ง LINE Group แล้ว ✓', 'ok');
  } catch (err) {
    console.error('LINE notify failed', err);
    const idx = DATA.sales.findIndex(s => s.id === sale.id);
    if (idx >= 0) DATA.sales[idx].notify = 'Failed';
    saveData();
    toast('บันทึกแล้ว แต่ส่ง LINE ไม่สำเร็จ: ' + (err.message || err), 'bad');
  }
}

function onSubmitTrain(e) {
  e.preventDefault();
  const branch = document.getElementById('te-branch').value;
  const memberId = document.getElementById('te-member').value;
  const trainerId = document.getElementById('te-trainer').value;
  const note = document.getElementById('te-note').value;

  if (!memberId) { toast('กรุณาเลือกสมาชิกจากรายการ (พิมพ์แล้วเลือกตัวเลือกที่ขึ้น)', 'bad'); return; }
  const member = DATA.members.find(m => m.id === memberId);
  const trainer = DATA.employees.find(e => e.id === trainerId);
  const br = DATA.branches.find(b => b.code === branch);

  if (!member || !trainer || !br) {
    toast('ข้อมูลไม่ครบ', 'bad'); return;
  }
  if (member.hours <= 0) {
    toast('สมาชิกนี้ไม่เหลือชั่วโมงเทรน', 'bad'); return;
  }
  // Deduct
  const hoursBefore = member.hours;
  member.hours = Math.max(0, member.hours - 1);
  // If member was above threshold and just crossed below, clear the notify flag so we re-alert
  if (hoursBefore > DATA.settings.trainerWarnHrs && DATA.settings.hoursNotified) {
    delete DATA.settings.hoursNotified[member.id];
  }
  DATA.trainings.unshift({
    id: nid(), ts: new Date().toISOString(), branch, memberId,
    memberName: member.name + ' ' + member.surname,
    trainerId, trainerName: trainer.name,
    verified: true, hoursBefore, hoursAfter: member.hours, note,
  });
  // Add as a "Train" sale row for tracking
  DATA.sales.unshift({
    id: nid(), ts: new Date().toISOString(), branch, empId: trainerId,
    type: 'Train', memberId, memberName: member.name + ' ' + member.surname,
    amount: 0, slip: '', note: 'บันทึกเทรน', notify: '—',
  });
  // Alert if low hours
  if (member.hours <= DATA.settings.trainerWarnHrs) {
    DATA.alerts.unshift({
      id: nid(), ts: new Date().toISOString(),
      type: 'Trainer Hours Low', branch,
      memberId: member.id, memberName: member.name + ' ' + member.surname,
      value: member.hours + ' ครั้ง',
      message: 'เหลือชั่วโมงเทรน ' + member.hours + ' ครั้ง',
      status: member.lineUid ? 'Sent' : 'No LINE',
    });
  }
  saveData();
  toast('หักชั่วโมงสำเร็จ — เหลือ ' + member.hours + ' ครั้ง', 'ok');
  navigate('trainings');
  sendDailyHoursLowAlertsToGroup().catch(err => console.error('[hours-alert] post-train push failed', err));
}

function renderMembers(root) {
  const editable = ['Owner','Manager','Staff'].includes(SESSION.role);
  const tb = document.createElement('div');
  tb.className = 'toolbar';
  tb.innerHTML = `
    <div class="filters">
      <input id="m-search" type="text" placeholder="ค้นหา ชื่อ/นามสกุล/รหัส..." oninput="renderMembers(document.getElementById('content'))">
      <select id="m-status" onchange="renderMembers(document.getElementById('content'))">
        <option value="">ทุกสถานะ</option>
        <option value="Active">Active</option>
        <option value="Frozen">Frozen</option>
        <option value="Expired">Expired</option>
      </select>
    </div>
    ${editable ? '<button class="btn" onclick="openMemberModal()">+ เพิ่มสมาชิก</button>' : ''}
  `;
  root.appendChild(tb);

  // preserve search/filter values across re-renders
  const prevSearch = document.getElementById('m-search') ? document.getElementById('m-search').value : '';
  const prevStatus = document.getElementById('m-status') ? document.getElementById('m-status').value : '';
  // (the toolbar HTML re-rendered, so values reset; restore manually)
  setTimeout(() => {
    const s = document.getElementById('m-search'); if (s && prevSearch) s.value = prevSearch;
    const st = document.getElementById('m-status'); if (st && prevStatus) st.value = prevStatus;
  }, 0);

  const search = (window.event && window.event.target && window.event.target.id === 'm-search') ? window.event.target.value : '';
  const statusFilter = (window.event && window.event.target && window.event.target.id === 'm-status') ? window.event.target.value : '';

  const card = document.createElement('div');
  card.className = 'card';
  const ref = todayStart();
  let list = filterByBranch(DATA.members);
  if (search) {
    const q = search.toLowerCase();
    list = list.filter(m => (m.name + ' ' + m.surname + ' ' + m.id).toLowerCase().includes(q));
  }
  if (statusFilter) list = list.filter(m => m.status === statusFilter);
  list.sort((a, b) => daysBetween(a.endDate, ref) - daysBetween(b.endDate, ref));

  let rows = '';
  list.forEach(m => {
    const days = daysBetween(m.endDate, ref);
    const dayCls = days < 0 ? 'days-low' : (days <= DATA.settings.expiryWarnDays ? 'days-warn' : '');
    const hrCls = m.hours > 0 && m.hours <= DATA.settings.trainerWarnHrs ? 'hrs-low' : '';
    rows += `<tr>
      <td>${_h(m.id)}</td>
      <td><strong>${_h(m.name)} ${_h(m.surname)}</strong></td>
      <td class="center">${m.age}</td>
      <td class="center">${_h(m.branch)}</td>
      <td class="center">${fmtDate(m.endDate)}</td>
      <td class="center ${dayCls}">${days < 0 ? 'หมดแล้ว ' + (-days) + ' วัน' : days + ' วัน'}</td>
      <td class="center ${hrCls}">${m.hours}</td>
      <td>${m.trainer ? _h(m.trainer) : '<span class="muted">—</span>'}</td>
      <td class="center">${statusBadge(m.status)}</td>
      <td class="row-actions">
        <button class="btn small secondary" onclick="openMemberHistoryModal('${_h(m.id)}')">📜 ประวัติ</button>
        ${editable ? `<button class="btn small secondary" onclick="openMemberModal('${_h(m.id)}')">แก้</button>` : ''}
      </td>
    </tr>`;
  });
  if (rows === '') rows = `<tr><td colspan="10" class="muted center" style="padding: 20px;">ไม่พบข้อมูลสมาชิก</td></tr>`;

  card.innerHTML = `
    <table>
      <thead><tr>
        <th>ID</th><th>ชื่อ-นามสกุล</th><th class="center">อายุ</th>
        <th class="center">สาขา</th><th class="center">วันหมดอายุ</th><th class="center">วันคงเหลือ</th>
        <th class="center">ชม.เทรน</th><th>เทรนเนอร์</th><th class="center">สถานะ</th>
        <th></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
  root.appendChild(card);
}

function statusBadge(s) {
  if (s === 'Active')   return '<span class="badge ok">Active</span>';
  if (s === 'Frozen')   return '<span class="badge info">Frozen</span>';
  if (s === 'Expired')  return '<span class="badge bad">Expired</span>';
  if (s === 'Cancelled')return '<span class="badge gray">Cancelled</span>';
  return '<span class="badge gray">' + s + '</span>';
}

    .slice()

    .filter(t => t.memberId === id)
    .slice()
    .sort((a, b) => new Date(b.ts) - new Date(a.ts));

      <div><span class="muted small">รวมการซื้อ:</span> <strong>${sales.length}</strong> รายการ</div>
      <div><span class="muted small">ยอดรวม:</span> <strong>${cur}${totalAmount.toLocaleString()}</strong></div>

      </div>
    </form>
  `);
}

function saveMember(e, idOrNull) {
  e.preventDefault();
  const isNew = !idOrNull;
  const obj = {
    id: document.getElementById('mm-id').value,
    branch: document.getElementById('mm-branch').value,
    name: document.getElementById('mm-name').value,
    surname: document.getElementById('mm-surname').value,
    age: Number(document.getElementById('mm-age').value || 0),
    startDate: new Date(document.getElementById('mm-start').value).toISOString(),
    endDate: new Date(document.getElementById('mm-end').value).toISOString(),
    hours: Number(document.getElementById('mm-hours').value || 0),
    trainer: document.getElementById('mm-trainer').value,
    lineUid: document.getElementById('mm-line').value,
    status: document.getElementById('mm-status').value,
  };
  if (isNew) {
    if (DATA.members.some(m => m.id === obj.id)) {
      toast('Member ID ซ้ำ', 'bad'); return;
    }
    DATA.members.push(obj);
  } else {
    const idx = DATA.members.findIndex(m => m.id === idOrNull);
    DATA.members[idx] = { ...DATA.members[idx], ...obj };
  }
  // If hours topped up above threshold, clear the hours-low notify flag so we'll re-alert next time it drops
  if (obj.hours > DATA.settings.trainerWarnHrs && DATA.settings.hoursNotified) {
    delete DATA.settings.hoursNotified[obj.id];
  }
  saveData();
  closeModal();
  toast('บันทึกสมาชิกเรียบร้อย', 'ok');
  navigate('members');
}

function deleteMember(id) {
  if (!confirm('ลบสมาชิก ' + id + ' ?')) return;
  DATA.members = DATA.members.filter(m => m.id !== id);
  db.del('members', id);
  saveData();
  closeModal();
  toast('ลบสมาชิกเรียบร้อย', 'ok');
  navigate('members');
}

function nextMemberId() {
  const nums = DATA.members
    .map(m => String(m.id || ''))
    .filter(s => /^M\d+$/.test(s))
    .map(s => Number(s.slice(1)));
  const max = nums.length ? Math.max.apply(null, nums) : 1000;
  return 'M' + String(max + 1).padStart(4, '0');
}

function onPickPackage() {
  const code = document.getElementById('rg-package').value;
  if (code && code !== 'CUSTOM') {
    const pkg = MEMBERSHIP_PACKAGES.find(p => p.code === code);
    if (pkg) {
      document.getElementById('rg-days').value = pkg.days;
      document.getElementById('rg-price').value = pkg.price;
    }
  }
  // ถ้าเลือก CUSTOM หรือล้างค่า ให้ผู้ใช้กรอกเอง
  updateRegSummary();
}

function onPickPT() {
  const code = document.getElementById('rg-pt').value;
  if (code && code !== 'CUSTOM') {
    const pt = PT_PACKAGES.find(p => p.code === code);
    if (pt) {
      document.getElementById('rg-ptHours').value = pt.hours;
      document.getElementById('rg-ptPrice').value = pt.price;
    }
  } else if (code === '') {
    document.getElementById('rg-ptHours').value = 0;
    document.getElementById('rg-ptPrice').value = 0;
  }
  updateRegSummary();
}

function updateRegSummary() {
  const pkgCode = document.getElementById('rg-package').value;
  const ptCode = document.getElementById('rg-pt').value;
  const days = Number(document.getElementById('rg-days').value || 0);
  const price = Number(document.getElementById('rg-price').value || 0);
  const ptHours = Number(document.getElementById('rg-ptHours').value || 0);
  const ptPrice = Number(document.getElementById('rg-ptPrice').value || 0);

  const el = document.getElementById('reg-summary');
  if (!days || !price) { el.textContent = 'กรอกจำนวนวันและราคาเพื่อดูยอดรวม'; return; }

  const pkgPreset = MEMBERSHIP_PACKAGES.find(p => p.code === pkgCode);
  const ptPreset = PT_PACKAGES.find(p => p.code === ptCode);

  let pkgLabel = pkgPreset ? pkgPreset.label : (pkgCode === 'CUSTOM' ? 'กำหนดเอง' : 'แพ็กเกจ');
  let ptLabel = ptPreset ? ptPreset.label : (ptCode === 'CUSTOM' ? 'PT กำหนดเอง' : '');

  const total = price + ptPrice;
  let txt = `${pkgLabel} (${days} วัน, ${thb(price)})`;
  if (ptHours > 0 || ptPrice > 0) txt += ` + ${ptLabel} (${ptHours} ครั้ง, ${thb(ptPrice)})`;
  txt += `  •  ยอดรวม: ${thb(total)}`;
  el.textContent = txt;
}

function saveRegistration(e) {
  e.preventDefault();
  const v = id => (document.getElementById(id).value || '').trim();
  const pkgCode = v('rg-package');
  if (!pkgCode) { toast('กรุณาเลือกแพ็กเกจ', 'bad'); return; }
  const days = Number(v('rg-days'));
  const price = Number(v('rg-price'));
  if (!days || days < 1) { toast('กรุณากรอกจำนวนวัน', 'bad'); return; }
  if (price < 0 || isNaN(price)) { toast('กรุณากรอกราคา', 'bad'); return; }

  const ptCode = v('rg-pt');
  const ptHours = Number(v('rg-ptHours')) || 0;
  const ptPrice = Number(v('rg-ptPrice')) || 0;

  const pkgPreset = MEMBERSHIP_PACKAGES.find(p => p.code === pkgCode);
  const ptPreset = PT_PACKAGES.find(p => p.code === ptCode);
  const pkgLabel = pkgPreset ? pkgPreset.label : 'กำหนดเอง';
  const ptLabel = ptPreset ? ptPreset.label : (ptHours > 0 || ptPrice > 0 ? `PT ${ptHours} ครั้ง` : '');

  const startDate = v('rg-startDate') ? new Date(v('rg-startDate')) : new Date();
  startDate.setHours(0, 0, 0, 0);
  const endDate = new Date(startDate.getTime() + days * 24 * 3600 * 1000);
  const totalPrice = price + ptPrice;
  const trainerHrs = ptHours;
  const memberId = nextMemberId();

  const member = {
    id: memberId,
    name: v('rg-firstName'),
    surname: v('rg-lastName'),
    age: Number(v('rg-age')) || 0,
    branch: v('rg-branch'),
    startDate: startDate.toISOString(),
    endDate: endDate.toISOString(),
    hours: trainerHrs,
    trainer: '',
    lineUid: v('rg-lineUid'),
    status: 'Active',
    // ฟิลด์เสริม (เก็บใน DATA.members + localStorage — Supabase sync เฉพาะฟิลด์ที่ใน TABLE_SPEC)
    gender: v('rg-gender'),
    idCard: v('rg-idCard'),
    phone: v('rg-phone'),
    email: v('rg-email'),
    address: v('rg-address'),
    emergencyName: v('rg-emergencyName'),
    emergencyPhone: v('rg-emergencyPhone'),
    packageCode: pkgCode,
    packageLabel: pkgLabel + (ptLabel ? ' + ' + ptLabel : ''),
    packageDays: days,
    packagePrice: price,
    ptCode: ptCode,
    ptHours: ptHours,
    ptPrice: ptPrice,
    totalPrice: totalPrice,
    health: v('rg-health'),
    note: v('rg-note'),
  };

  DATA.members.push(member);
  saveData();
  toast(`สมัครสมาชิก ${memberId} เรียบร้อย`, 'ok');

  // เปิดเอกสารสัญญาในแท็บใหม่ (พร้อมปริ้น)
  printContract(member);
}

    </div>
    <button class="btn secondary" onclick="exportCSV('sales')">Export CSV</button>
  `;
  root.appendChild(tb);

  const fType = document.getElementById('sl-type') ? document.getElementById('sl-type').value : '';
  const fNotify = document.getElementById('sl-notify') ? document.getElementById('sl-notify').value : '';

  let list = filterByBranch(DATA.sales).filter(s => s.type !== 'Train').slice().sort((a,b) => new Date(b.ts) - new Date(a.ts));
  if (fType) list = list.filter(s => s.type === fType);
  if (fNotify) list = list.filter(s => s.notify === fNotify);

  }
  if (SALES_LOG_DATE_TO) {

  }

  const card = document.createElement('div');

  let rows = '';

    const channelBadge = s.channel ? `<span class="badge gray">${s.channel}</span>` : '<span class="muted">—</span>';
    const actions = ownerCanDelete ? `<button class="btn small danger" onclick="deleteSale('${s.id}')">ลบ</button>` : '';
    rows += `<tr>
      <td>${fmtTime(s.ts)}</td>
      <td>${_h(s.branch)}</td>
      <td><span style="font-weight: 600; color: ${typeColor(s.type)};">${_h(s.type)}</span></td>
      <td class="center">${channelBadge}</td>
      <td>${_h(s.empId)}</td>
      <td>${s.memberName ? _h(s.memberName) : '<span class="muted">—</span>'}</td>
      <td class="right"><strong>${thb(s.amount)}</strong></td>
      <td class="center">${slipLink}</td>
      <td class="center">${renderNotifyBadge(s.notify)}</td>
      <td class="muted small">${_h(s.note || '')}</td>
      ${ownerCanDelete ? `<td class="center">${actions}</td>` : ''}
    </tr>`;
  });
  const colspan = ownerCanDelete ? 11 : 10;
  if (rows === '') rows = `<tr><td colspan="${colspan}" class="muted center" style="padding: 20px;">ไม่พบรายการ</td></tr>`;
  card.innerHTML = `
    <h2>ประวัติการขาย <small>${list.length} รายการ${list.length > 100 ? ' (แสดง 100 รายการล่าสุด)' : ''}</small></h2>

        <th>สมาชิก</th><th class="right">ยอด</th><th class="center">สลิป</th>
        <th class="center">LINE</th><th>หมายเหตุ</th>
        ${ownerCanDelete ? '<th class="center">จัดการ</th>' : ''}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
  root.appendChild(card);
}

  num = Number(num) || 0;
  const sign = num < 0 ? 'ลบ' : '';
  num = Math.abs(num);
  const digits = ['', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'];
  const positions = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน'];
  function chunkText(n) {
    if (n === 0) return '';
    const arr = String(n).split('').reverse();
    let out = '';
    for (let i = arr.length - 1; i >= 0; i--) {
      const d = Number(arr[i]);
      if (d === 0) continue;
      let dt = digits[d];
      const pt = positions[i];
      if (i === 1 && d === 1) dt = '';
      else if (i === 1 && d === 2) dt = 'ยี่';
      if (i === 0 && d === 1 && arr.length > 1) dt = 'เอ็ด';
      out += dt + pt;
    }
    return out;
  }
  function intToThai(n) {
    if (n === 0) return 'ศูนย์';
    let out = '';
    while (n >= 1000000) {
      const part = n % 1000000;
      n = Math.floor(n / 1000000);
      out = chunkText(part) + 'ล้าน' + out;
      if (n < 1000000) {
        if (n > 0) out = chunkText(n) + 'ล้าน' + out.replace(/^ล้าน/, '');
      }
    }
    if (n > 0 && out === '') return chunkText(n);
    if (n > 0) return chunkText(n) + out;
    return out;
  }
  const intPart = Math.floor(num);
  const cents = Math.round((num - intPart) * 100);
  let text = sign + intToThai(intPart) + 'บาท';
  text += (cents === 0) ? 'ถ้วน' : intToThai(cents) + 'สตางค์';
  return text;
}

function fmtMoney(n) {
  return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtThaiDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear() + 543}`;
}

function fmtThaiDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  const ss = String(d.getSeconds()).padStart(2, '0');
  return `${fmtThaiDate(iso)} ${hh}:${mm}:${ss}`;
}

function nextReceiptNo() {
  const used = (DATA.invoices || []).map(inv => parseInt(inv.receiptNo, 10) || 0);
  const max = used.length ? Math.max(...used) : 0;
  return String(max + 1).padStart(6, '0');
}

function renderInvoiceItemRow(i, it) {
  it = it || { description: '', unitPrice: 0, qty: 1 };
  return `<tr data-idx="${i}">
    <td class="center">${i + 1}</td>
    <td><input class="iv-it-desc" value="${_h(it.description || '')}" oninput="recalcInvoice()" placeholder="ค่าสมาชิก 3 เดือน ฯลฯ"></td>
    <td><input class="iv-it-price" type="number" min="0" step="0.01" value="${Number(it.unitPrice || 0)}" oninput="recalcInvoice()" style="text-align: right;"></td>
    <td><input class="iv-it-qty" type="number" min="0" step="1" value="${Number(it.qty || 1)}" oninput="recalcInvoice()" style="text-align: center;"></td>
    <td class="right iv-it-sum">0.00</td>
    <td class="center"><button type="button" class="btn small danger" onclick="removeInvoiceItem(${i})">×</button></td>
  </tr>`;
}

function addInvoiceItem() {
  const tbody = document.getElementById('iv-items');
  const i = tbody.querySelectorAll('tr').length;
  tbody.insertAdjacentHTML('beforeend', renderInvoiceItemRow(i, null));
  recalcInvoice();
}

function removeInvoiceItem(i) {
  const tbody = document.getElementById('iv-items');
  const rows = tbody.querySelectorAll('tr');
  if (rows[i]) rows[i].remove();
  Array.from(tbody.querySelectorAll('tr')).forEach((r, idx) => {
    r.dataset.idx = idx;
    r.querySelector('td:first-child').textContent = idx + 1;
    const delBtn = r.querySelector('button.danger');
    if (delBtn) delBtn.setAttribute('onclick', `removeInvoiceItem(${idx})`);
  });
  recalcInvoice();
}

function collectInvoiceItems() {
  const out = [];
  document.querySelectorAll('#iv-items tr').forEach(r => {
    const description = r.querySelector('.iv-it-desc').value.trim();
    const unitPrice = Number(r.querySelector('.iv-it-price').value) || 0;
    const qty = Number(r.querySelector('.iv-it-qty').value) || 0;
    if (description || unitPrice || qty) out.push({ description, unitPrice, qty });
  });
  return out;
}

function recalcInvoice() {
  const items = collectInvoiceItems();
  let totalIncVat = 0;
  document.querySelectorAll('#iv-items tr').forEach(r => {
    const price = Number(r.querySelector('.iv-it-price').value) || 0;
    const qty = Number(r.querySelector('.iv-it-qty').value) || 0;
    const sum = price * qty;
    r.querySelector('.iv-it-sum').textContent = fmtMoney(sum);
    totalIncVat += sum;
  });
  const vatRate = 0.07;
  const beforeVat = totalIncVat / (1 + vatRate);
  const vat = totalIncVat - beforeVat;
  const sum = document.getElementById('iv-summary');
  if (sum) {
    sum.innerHTML = `
      <div style="display: flex; justify-content: space-between;"><span>จำนวนเงิน (ก่อน VAT):</span><strong>${fmtMoney(beforeVat)}</strong></div>
      <div style="display: flex; justify-content: space-between;"><span>ภาษีมูลค่าเพิ่ม 7%:</span><strong>${fmtMoney(vat)}</strong></div>
      <div style="display: flex; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 6px; margin-top: 6px;"><span>ราคารวมทั้งสิ้น:</span><strong style="font-size: 16px;">${fmtMoney(totalIncVat)}</strong></div>
      <div class="muted small" style="margin-top: 6px;"># ${thaiBahtText(totalIncVat)} #</div>
    `;
  }
}

function onPickInvoiceMember() {
  const sel = document.getElementById('iv-member-pick');
  const id = sel.value;
  if (!id) return;
  const m = DATA.members.find(x => x.id === id);
  if (!m) return;
  document.getElementById('iv-cname').value = m.name + ' ' + m.surname;
  document.getElementById('iv-cmid').value = m.id;
  const br = DATA.branches.find(b => b.code === m.branch);
  if (br) document.getElementById('iv-branch').value = m.branch;
}

function saveInvoice(e, id, isNew) {
  if (e) e.preventDefault();
  if (!Array.isArray(DATA.invoices)) DATA.invoices = [];
  const items = collectInvoiceItems();
  if (items.length === 0) { toast('กรุณาเพิ่มรายการอย่างน้อย 1 รายการ', 'bad'); return null; }

  const dateStr = document.getElementById('iv-date').value;
  const obj = {
    id,
    receiptNo: document.getElementById('iv-no').value.trim(),
    ts: new Date(dateStr + 'T' + new Date().toTimeString().slice(0, 8)).toISOString(),
    branch: document.getElementById('iv-branch').value,
    branchNo: document.getElementById('iv-branchno').value.trim(),
    customerName: document.getElementById('iv-cname').value.trim(),
    customerMemberId: document.getElementById('iv-cmid').value.trim(),
    customerAddress: document.getElementById('iv-caddr').value.trim(),
    items,
    paymentMethod: document.getElementById('iv-paymethod').value,
    paymentDetails: document.getElementById('iv-paydetail').value.trim(),
    receiptNote: document.getElementById('iv-note').value.trim(),
    createdBy: SESSION ? SESSION.email : '',
  };

  if (isNew) {
    DATA.invoices.unshift(obj);
  } else {
    const idx = DATA.invoices.findIndex(x => x.id === id);
    if (idx >= 0) DATA.invoices[idx] = obj;
    else DATA.invoices.unshift(obj);
  }
  saveData();
  toast(isNew ? 'บันทึกใบเสร็จใหม่เรียบร้อย' : 'อัปเดตใบเสร็จเรียบร้อย', 'ok');
  closeModal();
  if (CURRENT_VIEW === 'invoices') {
    const c = document.getElementById('content'); c.innerHTML = ''; renderInvoices(c);
  }
  return obj;
}

function saveAndPrintInvoice(id, isNew) {
  const saved = saveInvoice(null, id, isNew);
  if (saved) printInvoice(saved.id);
}

function deleteInvoice(id) {
  if (!confirm('ลบใบเสร็จนี้ใช่หรือไม่?')) return;
  DATA.invoices = (DATA.invoices || []).filter(x => x.id !== id);
  saveData();
  toast('ลบแล้ว', 'ok');
  closeModal();
  if (CURRENT_VIEW === 'invoices') {
    const c = document.getElementById('content'); c.innerHTML = ''; renderInvoices(c);
  }
}

function printInvoice(id) {
  const inv = (DATA.invoices || []).find(x => x.id === id);
  if (!inv) { toast('ไม่พบใบเสร็จ', 'bad'); return; }
  const html = buildInvoicePrintHTML(inv);
  const w = window.open('', '_blank', 'width=1200,height=700');
  if (!w) { toast('โปรดอนุญาต popup เพื่อพิมพ์', 'bad'); return; }
  w.document.open(); w.document.write(html); w.document.close();
  inv.printCount = (inv.printCount || 0) + 1;
  inv.lastPrintedAt = new Date().toISOString();
  saveData();
}
